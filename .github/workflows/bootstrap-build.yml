name: Emerald Storm v0.2.22 TEXMAN ScanSafe NVDEC Runtime Restore COMPILEFIX3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-build.yml'

concurrency:
  group: emerald-texman-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  TEXMAN_REPO: https://github.com/isyvdshvsy/Skyline-texman.git
  TEXMAN_SHA: 24e2f648871a5daab5198e119f95187791c96c6e
  SOURCE_DIR: texman-src
  NDK_VERSION: 25.0.8775105
  CMAKE_VERSION: 3.22.1
  DONOR_ZIP: EmeraldStorm-v0.1.0-Baseline-Source.zip
  DONOR_EXTRACT: emerald-runtime-donor

jobs:
  android:
    name: Build v0.2.22 TEXMAN + ScanSafe + NVDEC H264 VP9 COMPILEFIX3
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Emerald repository metadata
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache git unzip glslang-tools

      - name: Switch to Java 11 for legacy TEXMAN Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Extract known-good Emerald runtime donor
        run: |
          set -euo pipefail
          test -f "$DONOR_ZIP"
          rm -rf "$DONOR_EXTRACT"
          mkdir -p "$DONOR_EXTRACT"
          unzip -q "$DONOR_ZIP" -d "$DONOR_EXTRACT"
          DONOR_ROOT=$(dirname "$(find "$DONOR_EXTRACT" -type f -name gradlew -print -quit)")
          test -n "$DONOR_ROOT"
          test -f "$DONOR_ROOT/app/build.gradle"
          echo "$DONOR_ROOT" > donor-root.txt
          echo "[ES-CI] Emerald runtime donor: $DONOR_ROOT"
          grep -RIl --exclude-dir=.git -E '\[ES-NVDEC\]|\[ES-VIC\]|video/x-vnd\.on2\.vp9|vp9_reconstructor' "$DONOR_ROOT/app" | head -n 40 || true

      - name: Clone recovered Skyline TEXMAN snapshot
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR"
          git clone --filter=blob:none --no-recurse-submodules "$TEXMAN_REPO" "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          git checkout --detach "$TEXMAN_SHA"
          test "$(git rev-parse HEAD)" = "$TEXMAN_SHA"
          echo "[ES-CI] Recovered TEXMAN source: $(git rev-parse HEAD)"

      - name: Restore TEXMAN pinned dependencies through surviving mirrors
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          git config --global url."https://github.com/azquadri90/shader-compiler.git".insteadOf "https://github.com/skyline-emu/shader-compiler.git"
          git config --global url."https://github.com/ReinUsesLisp/sirit.git".insteadOf "https://github.com/yuzu-emu/sirit"
          git config --global --add url."https://github.com/ReinUsesLisp/sirit.git".insteadOf "https://github.com/yuzu-emu/sirit.git"
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          test -f app/libraries/shader-compiler/CMakeLists.txt
          test -f app/libraries/sirit/CMakeLists.txt
          test -f app/libraries/vkhpp/vulkan/vulkan.hpp
          echo "[ES-CI] TEXMAN dependencies restored"

      - name: Restore Emerald ScanSafe library behavior COMPILEFIX3
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------------------------------------------------------
          # 1) LoaderResult: unknown native values must never crash Kotlin.
          #    Use a whitespace-tolerant structural regex instead of an
          #    exact source string.
          # ---------------------------------------------------------------
          rom_file = Path("app/src/main/java/emu/skyline/loader/RomFile.kt")
          text = rom_file.read_text()

          loader_pattern = re.compile(
              r'fun\s+get\s*\(\s*value\s*:\s*Int\s*\)\s*=\s*'
              r'values\s*\(\s*\)\s*\.first\s*\{\s*value\s*==\s*it\.value\s*\}'
          )
          text, loader_count = loader_pattern.subn(
              'fun get(value : Int) = values().firstOrNull { value == it.value } ?: ParsingError',
              text,
              count=1,
          )
          if loader_count != 1:
              raise SystemExit(
                  f"ScanSafe LoaderResult structural patch expected 1 match, got {loader_count}"
              )
          rom_file.write_text(text)

          # ---------------------------------------------------------------
          # 2) Initial library enumeration: do NOT call native RomFile
          #    metadata parsing. The actual game launch still constructs a
          #    RomFile from the URI inside EmulationActivity.
          #
          #    Action #48 failed because the old workflow matched a whole
          #    Kotlin block including exact indentation. Match only the
          #    semantic RomFile expression here.
          # ---------------------------------------------------------------
          provider = Path("app/src/main/java/emu/skyline/RomProvider.kt")
          p = provider.read_text()

          p, import_count = re.subn(
              r'(?m)^\s*import\s+emu\.skyline\.loader\.RomFile\s*\n',
              'import emu.skyline.loader.LoaderResult\n',
              p,
              count=1,
          )
          if import_count != 1:
              raise SystemExit(
                  f"ScanSafe RomProvider RomFile import patch expected 1 match, got {import_count}"
              )

          call_pattern = re.compile(
              r'(?P<indent>^[ \t]*)'
              r'entries\.getOrPut\(\s*romFormat\s*,\s*\{\s*arrayListOf\(\)\s*\}\s*\)'
              r'\.add\(\s*RomFile\(\s*context\s*,\s*romFormat\s*,\s*file\.uri\s*,\s*systemLanguage\s*\)'
              r'\.appEntry\s*\)',
              re.M,
          )

          def replace_native_metadata_call(match):
              i = match.group("indent")
              return (
                  f'{i}try {{\n'
                  f'{i}    val displayName = file.name\n'
                  f'{i}        ?.substringBeforeLast(".")\n'
                  f'{i}        ?.takeIf {{ it.isNotBlank() }}\n'
                  f'{i}        ?: file.uri.lastPathSegment\n'
                  f'{i}            ?.substringAfterLast("/")\n'
                  f'{i}            ?.substringBeforeLast(".")\n'
                  f'{i}            ?.takeIf {{ it.isNotBlank() }}\n'
                  f'{i}        ?: "Unknown"\n'
                  f'{i}    entries.getOrPut(romFormat) {{ arrayListOf() }}.add(\n'
                  f'{i}        AppEntry(displayName, null, null, null, null, romFormat, file.uri, LoaderResult.Success)\n'
                  f'{i}    )\n'
                  f'{i}}} catch (_ : Exception) {{\n'
                  f'{i}    // ScanSafe: one bad provider entry must not kill the full auto-refresh.\n'
                  f'{i}}}'
              )

          p, scan_count = call_pattern.subn(
              replace_native_metadata_call,
              p,
              count=1,
          )
          if scan_count != 1:
              # Print the local region on CI if upstream formatting changes again.
              idx = p.find("entries.getOrPut")
              preview = p[max(0, idx - 300):idx + 900] if idx != -1 else "<entries.getOrPut not found>"
              print("[ES-CI] RomProvider region:")
              print(preview)
              raise SystemExit(
                  f"ScanSafe RomProvider structural patch expected 1 native RomFile call, got {scan_count}"
              )

          provider.write_text(p)

          # Hard verification in the same step.
          final_rom = rom_file.read_text()
          final_provider = provider.read_text()
          if "firstOrNull { value == it.value } ?: ParsingError" not in final_rom:
              raise SystemExit("ScanSafe LoaderResult verification failed")
          if "RomFile(context, romFormat, file.uri, systemLanguage).appEntry" in final_provider:
              raise SystemExit("ScanSafe native metadata call still present")
          if "AppEntry(displayName, null, null, null, null, romFormat, file.uri, LoaderResult.Success)" not in final_provider:
              raise SystemExit("ScanSafe lightweight AppEntry verification failed")

          print("[ES-CI] ScanSafe COMPILEFIX3 restored")
          print("[ES-CI] Initial scan uses filename/lightweight entries; native metadata parsing is deferred to launch")
          print("[ES-CI] Unknown LoaderResult values fall back to ParsingError")
          PY

      - name: Restore Emerald NVDEC H264 VP9 and VIC runtime COMPILEFIX3
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          export DONOR_ROOT="../$(cat ../donor-root.txt)"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil

          target = Path(".").resolve()
          donor = Path(os.environ["DONOR_ROOT"]).resolve()
          donor_app = donor / "app"
          target_app = target / "app"

          if not donor_app.is_dir():
              raise SystemExit(f"Emerald donor app missing: {donor_app}")

          # Action #48 proved these implementation families are present in the
          # known-good Emerald donor. Include Java/Kotlin too; Alpha1 only
          # searched C/C++ and would have silently missed NvdecMediaCodec.kt.
          source_ext = {".cpp", ".cc", ".c", ".h", ".hpp", ".kt", ".java"}
          native_ext = {".cpp", ".cc", ".c", ".h", ".hpp"}

          marker_re = re.compile(
              r"\[ES-NVDEC\]|\[ES-VIC\]|video/x-vnd\.on2\.vp9|"
              r"vp9_reconstructor|VP9 packet reconstructed|NvdecMediaCodec",
              re.I,
          )
          name_re = re.compile(r"nvdec|vp9|media.?codec|video.?decoder", re.I)

          protected_parts = (
              "skyline/gpu/texture/",
              "skyline/gpu/texture_manager",
              "skyline/gpu/interconnect/",
              "skyline/gpu/presentation_engine",
              "skyline/gpu/shader_manager",
          )

          def is_protected(rel):
              s = rel.as_posix()
              return any(part in s for part in protected_parts)

          seeds = set()

          # Explicit video bridge files. Missing optional entries are fine, but
          # the mandatory NVDEC/VP9/MediaCodec signals are checked later.
          explicit = (
              "src/main/cpp/skyline/soc/host1x/classes/nvdec.cpp",
              "src/main/cpp/skyline/soc/host1x/classes/nvdec.h",
              "src/main/cpp/skyline/soc/host1x/classes/vic.cpp",
              "src/main/cpp/skyline/soc/host1x/classes/vic.h",
              "src/main/cpp/skyline/soc/host1x/classes/vp9_reconstructor.cpp",
              "src/main/cpp/skyline/soc/host1x/classes/vp9_reconstructor.h",
              "src/main/cpp/skyline/soc/host1x/command_fifo.cpp",
              "src/main/cpp/skyline/soc/host1x/command_fifo.h",
              "src/main/cpp/skyline/soc/host1x/tegra_host_interface.h",
              "src/main/cpp/skyline/jvm.cpp",
              "src/main/cpp/skyline/jvm.h",
          )
          for rel_s in explicit:
              rel = Path(rel_s)
              if (donor_app / rel).is_file():
                  seeds.add(rel)

          # Discover every donor source that identifies itself as part of the
          # Emerald NVDEC/VIC/VP9 bridge. This also catches the exact package
          # location of NvdecMediaCodec.kt instead of guessing it.
          donor_main = donor_app / "src/main"
          for f in donor_main.rglob("*"):
              if not f.is_file() or f.suffix.lower() not in source_ext:
                  continue
              rel = f.relative_to(donor_app)
              if is_protected(rel):
                  continue
              try:
                  data = f.read_text(errors="ignore")
              except Exception:
                  continue

              host1x_integration = (
                  "src/main/cpp/skyline/soc/host1x/" in rel.as_posix()
                  and ("NvDecClass" in data or "nvDecClass" in data)
              )
              java_bridge = (
                  f.suffix.lower() in {".kt", ".java"}
                  and (name_re.search(f.name) or marker_re.search(data))
              )
              if marker_re.search(data) or name_re.search(f.name) or host1x_integration or java_bridge:
                  seeds.add(rel)

          if not seeds:
              raise SystemExit("No Emerald NVDEC/VP9 donor files discovered")

          # Recursively include local quoted headers only in the video/host1x/JVM
          # family. Never walk into TEXMAN's texture/interconnect renderer.
          cpp_root = donor_app / "src/main/cpp"
          include_re = re.compile(r'^\s*#\s*include\s*"([^"]+)"', re.M)
          queue = list(seeds)
          copied = set()

          dependency_keywords = (
              "nvdec", "vp9", "host1x", "video", "codec", "vic", "jvm"
          )

          while queue:
              rel = queue.pop()
              if rel in copied or is_protected(rel):
                  continue
              src = donor_app / rel
              if not src.is_file():
                  continue

              copied.add(rel)

              if rel.suffix.lower() in native_ext:
                  data = src.read_text(errors="ignore")
                  for inc in include_re.findall(data):
                      candidates = (
                          src.parent / inc,
                          cpp_root / inc,
                          cpp_root / "skyline" / inc,
                      )
                      for cand in candidates:
                          try:
                              resolved = cand.resolve()
                              if not resolved.is_file() or cpp_root.resolve() not in resolved.parents:
                                  continue
                              dep_rel = resolved.relative_to(donor_app)
                              dep_s = dep_rel.as_posix().lower()
                              if (
                                  not is_protected(dep_rel)
                                  and dep_rel not in copied
                                  and any(k in dep_s for k in dependency_keywords)
                              ):
                                  queue.append(dep_rel)
                              break
                          except Exception:
                              continue

          # Require the Java/Kotlin MediaCodec half of the bridge. Without this,
          # a native-only import can compile yet leave NVDEC unusable at runtime.
          media_codec_files = [
              rel for rel in copied
              if rel.suffix.lower() in {".kt", ".java"}
              and "nvdecmediacodec" in rel.name.lower()
          ]
          if not media_codec_files:
              # Give one explicit recovery search in case the class name differs
              # only by path/case in the donor.
              for f in donor_main.rglob("*"):
                  if f.is_file() and f.suffix.lower() in {".kt", ".java"}:
                      data = f.read_text(errors="ignore")
                      if "video/x-vnd.on2.vp9" in data or "class NvdecMediaCodec" in data:
                          rel = f.relative_to(donor_app)
                          if not is_protected(rel):
                              copied.add(rel)
                              media_codec_files.append(rel)

          if not media_codec_files:
              raise SystemExit("Emerald NvdecMediaCodec Kotlin/Java bridge was not found in donor")

          copied_files = []
          for rel in sorted(copied, key=lambda p: p.as_posix()):
              if is_protected(rel):
                  raise SystemExit(f"Refusing to overwrite TEXMAN renderer file: {rel}")
              src = donor_app / rel
              dst = target_app / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied_files.append(rel.as_posix())

          # Merge source-list entries for new native implementation units using
          # the donor's own CMake lines. Existing TEXMAN entries are left alone.
          donor_cmake_path = donor_app / "CMakeLists.txt"
          target_cmake_path = target_app / "CMakeLists.txt"
          donor_cmake = donor_cmake_path.read_text(errors="ignore")
          target_cmake = target_cmake_path.read_text()
          cmake_lines = []

          for rel in copied_files:
              if Path(rel).suffix.lower() not in {".cpp", ".cc", ".c"}:
                  continue
              short = rel.removeprefix("src/main/cpp/")
              for line in donor_cmake.splitlines():
                  if short in line:
                      stripped = line.strip()
                      if stripped and stripped not in target_cmake and stripped not in cmake_lines:
                          cmake_lines.append(stripped)

          if cmake_lines:
              anchor = "        ${source_DIR}/skyline/soc/host1x/classes/nvdec.cpp"
              pos = target_cmake.find(anchor)
              if pos == -1:
                  raise SystemExit("NVDEC CMake anchor missing in TEXMAN")
              end = target_cmake.find("\n", pos)
              insertion = "\n" + "\n".join("        " + line.lstrip() for line in cmake_lines)
              target_cmake = target_cmake[:end] + insertion + target_cmake[end:]
              target_cmake_path.write_text(target_cmake)

          Path("EMERALD_NVDEC_IMPORTED.txt").write_text("\n".join(copied_files) + "\n")

          imported = "\n".join(
              (target_app / Path(r)).read_text(errors="ignore")
              for r in copied_files
              if (target_app / Path(r)).suffix.lower() in source_ext
          )

          required = {
              "NVDEC marker": "[ES-NVDEC]" in imported,
              "VP9 MediaCodec MIME": "video/x-vnd.on2.vp9" in imported,
              "VP9 implementation": (
                  "VP9 packet reconstructed" in imported
                  or "vp9_reconstructor" in imported.lower()
              ),
              "NvdecMediaCodec Java/Kotlin": any(
                  "nvdecmediacodec" in Path(r).name.lower() for r in copied_files
              ),
          }
          missing = [name for name, ok in required.items() if not ok]
          if missing:
              raise SystemExit("Incomplete Emerald NVDEC donor import: " + ", ".join(missing))

          print(f"[ES-CI] Imported {len(copied_files)} NVDEC/VIC/JVM/MediaCodec runtime files")
          print(f"[ES-CI] Added {len(cmake_lines)} missing CMake source entries")
          for rel in copied_files:
              print(f"[ES-CI] NVDEC donor -> {rel}")
          PY

      - name: Restore Emerald launcher icon assets
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          export DONOR_ROOT="../$(cat ../donor-root.txt)"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          donor = Path(os.environ["DONOR_ROOT"]).resolve()
          src_res = donor / "app/src/main/res"
          dst_res = Path("app/src/main/res")
          copied = 0

          for d in src_res.glob("mipmap*"):
              if not d.is_dir():
                  continue
              out = dst_res / d.name
              out.mkdir(parents=True, exist_ok=True)
              for f in d.iterdir():
                  if f.is_file():
                      shutil.copy2(f, out / f.name)
                      copied += 1

          for d in src_res.glob("drawable*"):
              if not d.is_dir():
                  continue
              for f in d.iterdir():
                  if f.is_file() and any(k in f.name.lower() for k in ("launcher", "emerald", "app_icon")):
                      out = dst_res / d.name
                      out.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(f, out / f.name)
                      copied += 1

          if copied == 0:
              raise SystemExit("No Emerald launcher icon resources found in donor")
          print(f"[ES-CI] Restored {copied} Emerald launcher-icon resources")
          PY

      - name: Apply Emerald TEXMAN safety corrections and v0.2.22 branding
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          g, n_app = re.subn(r'applicationId\s+"skyline\.emu"', 'applicationId "org.stratoemu.strato"', g, count=1)
          g, n_code = re.subn(r'versionCode\s+3\b', 'versionCode 32', g, count=1)
          g, n_name = re.subn(r'versionName\s+"0\.0\.3"', 'versionName "0.2.22-texman-full-scansafe-nvdec-alpha1"', g, count=1)
          g, n_label = re.subn(r'manifestPlaceholders \+= \[appLabel: "Skyline"\]', 'manifestPlaceholders += [appLabel: "Emerald Storm"]', g, count=1)
          if (n_app, n_code, n_name, n_label) != (1, 1, 1, 1):
              raise SystemExit(f'Brand/version patch mismatch: app={n_app} code={n_code} name={n_name} label={n_label}')
          gradle.write_text(g)

          fermi = Path('app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp')
          f = fermi.read_text()
          f_anchor = '        // Blit shader always samples from centre so adjust if necessary\n'
          f_insert = '        // Emerald Storm: preserve a negative Y request exactly once.\n        const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};\n\n'
          if 'esHelperScaleY' not in f:
              if f_anchor not in f:
                  raise SystemExit('TEXMAN Fermi2D anchor missing')
              f = f.replace(f_anchor, f_insert + f_anchor, 1)
          f, n_scale = re.subn(r'(srcFermiTexture\.dimensions, dstFermiTexture\.dimensions,\s*\n\s*duDx,\s*)dvDy(,)', r'\1esHelperScaleY\2', f, count=1)
          if n_scale != 1:
              raise SystemExit(f'TEXMAN Fermi2D helper call patch mismatch: {n_scale}')
          fermi.write_text(f)

          guest = Path('app/src/main/cpp/skyline/gpu/texture/guest_texture.cpp')
          t = guest.read_text()
          old_stride = '\n'.join([
              '          linearLayerStride{CalculateLinearLayerStride(mipLayouts) * layerCount},',
              '          linearSize{linearLayerStride * layerCount} {}',
          ])
          new_stride = '\n'.join([
              '          linearLayerStride{CalculateLinearLayerStride(mipLayouts)},',
              '          linearSize{linearLayerStride * layerCount} {}',
          ])
          if old_stride not in t:
              raise SystemExit('TEXMAN linearLayerStride WIP anchor missing')
          t = t.replace(old_stride, new_stride, 1)

          old_sub = '\n'.join([
              '        u32 layer{offset / layerStride}, layerOffset{layer * layerStride}, level{}, levelOffset{};',
              '        for (; level < levelCount; level++) {',
              '            if (levelOffset >= offset)',
              '                break;',
              '            levelOffset += mipLayouts[level].blockLinearSize;',
              '        }',
              '',
              '        if (offset - layerOffset != levelOffset)',
              '            return {}; // The offset is not aligned to the start of a level',
          ])
          new_sub = '\n'.join([
              '        u32 layer{offset / layerStride}, layerOffset{layer * layerStride};',
              '        u32 offsetWithinLayer{offset - layerOffset}, level{}, levelOffset{};',
              '        for (; level < levelCount; level++) {',
              '            if (levelOffset >= offsetWithinLayer)',
              '                break;',
              '            levelOffset += mipLayouts[level].blockLinearSize;',
              '        }',
              '',
              '        if (offsetWithinLayer != levelOffset)',
              '            return {}; // The offset is not aligned to the start of a level',
          ])
          if old_sub not in t:
              raise SystemExit('TEXMAN CalculateSubresource WIP anchor missing')
          t = t.replace(old_sub, new_sub, 1)
          guest.write_text(t)

          manager = Path('app/src/main/cpp/skyline/gpu/texture_manager.cpp')
          m = manager.read_text()
          old_lookup = '\n'.join([
              '            if (it->iterator->begin() <= range.end() && range.end() <= it->iterator->end())',
              '                result.push_back(it);',
          ])
          new_lookup = '\n'.join([
              '            // Emerald Storm: real [begin,end) intersection.',
              '            if (it->iterator->begin() < range.end() && range.begin() < it->iterator->end())',
              '                result.push_back(it);',
          ])
          if old_lookup not in m:
              raise SystemExit('TEXMAN LookupRange WIP anchor missing')
          m = m.replace(old_lookup, new_lookup, 1)

          old_copy = '            CopyToTexture(recordCb, texture, target->texture, subresource->baseArrayLayer, subresource->baseMipLevel, 0, 0, levelCount, layerCount);'
          new_copy = '\n'.join([
              '            // Emerald Storm: preserve the old alias into the new representation.',
              '            // Recovered WIP source/destination and mip/layer ordering corrected.',
              '            CopyToTexture(recordCb, target->texture, texture,',
              '                          subresource->baseMipLevel, subresource->baseArrayLayer,',
              '                          0, 0, levelCount, layerCount);',
          ])
          if old_copy not in m:
              raise SystemExit('TEXMAN CopyToTexture WIP anchor missing')
          m = m.replace(old_copy, new_copy, 1)
          manager.write_text(m)

          print('[ES-CI] Full TEXMAN architecture enabled')
          print('[ES-CI] Safety fixes applied')
          print('[ES-CI] Version: 0.2.22-texman-full-scansafe-nvdec-alpha1 (32)')
          PY

      - name: Verify v0.2.22 TEXMAN runtime restoration COMPILEFIX3
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          test -f app/src/main/cpp/skyline/gpu/texture/guest_texture.cpp
