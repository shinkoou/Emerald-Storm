              '            // Maxwell method and wrote each value to GPU-visible memory immediately.\n'
              '            using EsImmediateCbWordArray = std::array<u32, 1>;\n'
              '            #define LOAD_CONSTANT_BUFFER_CALLBACKS(z, index, data_)                                      \\\n'
              '            ENGINE_STRUCT_ARRAY_CASE(loadConstantBuffer, data, index, {                                  \\\n'
              '                const u32 esCbOffset{registers.loadConstantBuffer->offset};                               \\\n'
              '                interconnect.DisableQuickConstantBufferBind();                                            \\\n'
              '                EsImmediateCbWordArray esCbWord{argument};                                                     \\\n'
              '                interconnect.LoadConstantBuffer(esCbWord, esCbOffset);                                    \\\n'
              '                registers.loadConstantBuffer->offset += 4;                                                \\\n'
              '                static std::atomic<u64> esImmediateCbCount{};                                             \\\n'
              '                const u64 esOccurrence{esImmediateCbCount.fetch_add(1, std::memory_order_relaxed) + 1};   \\\n'
