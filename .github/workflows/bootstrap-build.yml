              void EmeraldTextureManager::PopulateRecordLocked(Record &record, const GuestTexture &guestTexture) {
                  if (record.mappings.empty()) {
                      record.mappings.reserve(guestTexture.mappings.size());
                      for (const auto &mapping : guestTexture.mappings) {
                          if (!mapping.valid())
                              continue;
                          const auto begin{reinterpret_cast<uintptr_t>(mapping.data())};
                          record.mappings.push_back(MappingRange{begin, begin + mapping.size()});
                      }
                  }
                  record.dimensions = guestTexture.dimensions;
                  record.format = guestTexture.format ? guestTexture.format->vkFormat : vk::Format::eUndefined;
                  record.tileMode = static_cast<u32>(guestTexture.tileConfig.mode);
                  record.layerCount = guestTexture.layerCount;
                  record.mipLevelCount = guestTexture.mipLevelCount;
              }

              EmeraldTextureManager::Record &EmeraldTextureManager::EnsureRecordLocked(Texture &texture) {
                  auto [it, inserted] = records.try_emplace(texture.debugId);
                  auto &record{it->second};
                  if (inserted || record.id == 0) {
                      record.id = texture.debugId;
                      if (texture.guest)
                          PopulateRecordLocked(record, *texture.guest);
                  }
                  return record;
              }

              void EmeraldTextureManager::AddAliasLocked(u64 lhs, u64 rhs) {
                  if (!lhs || !rhs || lhs == rhs)
                      return;
                  auto &left{records[lhs]};
                  auto &right{records[rhs]};
                  if (!left.id)
                      left.id = lhs;
                  if (!right.id)
                      right.id = rhs;
                  if (std::find(left.aliases.begin(), left.aliases.end(), rhs) == left.aliases.end())
                      left.aliases.emplace_back(rhs);
                  if (std::find(right.aliases.begin(), right.aliases.end(), lhs) == right.aliases.end())
                      right.aliases.emplace_back(lhs);
              }

              void EmeraldTextureManager::RegisterTexture(
                  const std::shared_ptr<Texture> &texture,
                  const GuestTexture &guestTexture,
                  const boost::container::small_vector<std::shared_ptr<Texture>, 4> &overlaps) {
                  if (!texture)
                      return;

                  std::scoped_lock lock{mutex};
                  auto &record{EnsureRecordLocked(*texture)};
                  PopulateRecordLocked(record, guestTexture);

                  for (const auto &overlap : overlaps) {
                      if (!overlap || overlap->debugId == texture->debugId)
                          continue;
                      EnsureRecordLocked(*overlap);
                      AddAliasLocked(texture->debugId, overlap->debugId);
                      ++aliasEvents;
                  }

                  const u64 occurrence{++createEvents};
                  size_t mappedBytes{};
                  for (const auto &range : records.at(texture->debugId).mappings)
                      mappedBytes += range.end - range.begin;
                  const auto &finalRecord{records.at(texture->debugId)};
                  if (!finalRecord.aliases.empty() || EsTmShouldLog(occurrence, 96, 4096)) {
                      LOGI("[ES-TM] CREATE tex=#{} mappings={} bytes=0x{:X} dims={}x{}x{} fmt={} tile={} layers={} mips={} aliases={} occurrence #{}",
                           finalRecord.id, finalRecord.mappings.size(), mappedBytes,
                           finalRecord.dimensions.width, finalRecord.dimensions.height, finalRecord.dimensions.depth,
                           static_cast<u32>(finalRecord.format), finalRecord.tileMode,
                           finalRecord.layerCount, finalRecord.mipLevelCount, finalRecord.aliases.size(), occurrence);
                  }
              }

              void EmeraldTextureManager::ObserveReplacement(Texture &oldTexture, Texture &newTexture, const char *reason) {
                  std::scoped_lock lock{mutex};
                  EnsureRecordLocked(oldTexture);
                  EnsureRecordLocked(newTexture);
                  AddAliasLocked(oldTexture.debugId, newTexture.debugId);
                  const u64 occurrence{++aliasEvents};
                  if (EsTmShouldLog(occurrence, 160, 1024)) {
                      LOGI("[ES-TM] ALIAS replacement reason={} oldTex=#{} newTex=#{} oldTick={} newTick={} occurrence #{}",
                           reason, oldTexture.debugId, newTexture.debugId,
                           records.at(oldTexture.debugId).modificationTick,
                           records.at(newTexture.debugId).modificationTick,
                           occurrence);
                  }
              }

              void EmeraldTextureManager::ObserveIova(Texture &texture, u64 iova) {
                  std::scoped_lock lock{mutex};
                  auto &record{EnsureRecordLocked(texture)};
                  if (record.lastIova && record.lastIova != iova) {
                      const u64 occurrence{++iovaChangeEvents};
                      if (EsTmShouldLog(occurrence, 64, 2048)) {
                          LOGI("[ES-TM] IOVA-CHANGE tex=#{} old=0x{:X} new=0x{:X} aliases={} occurrence #{}",
                               record.id, record.lastIova, iova, record.aliases.size(), occurrence);
                      }
                  }
                  record.lastIova = iova;
              }

              void EmeraldTextureManager::MarkCpuModified(Texture &texture, const char *source) {
                  std::scoped_lock lock{mutex};
                  auto &record{EnsureRecordLocked(texture)};
                  record.modificationTick = ++modificationTick;
                  record.lastWriter = Writer::Cpu;
                  ++record.cpuWriteCount;
                  const u64 occurrence{++cpuWriteEvents};
                  if (!record.aliases.empty() || EsTmShouldLog(occurrence, 96, 4096)) {
                      LOGI("[ES-TM] CPU-WRITE tex=#{} tick={} source={} aliases={} iova=0x{:X} writes={} occurrence #{}",
                           record.id, record.modificationTick, source, record.aliases.size(), record.lastIova,
                           record.cpuWriteCount, occurrence);
                  }
              }

              void EmeraldTextureManager::ObserveRenderTarget(Texture &texture, TextureView *view) {
                  std::scoped_lock lock{mutex};
                  auto &record{EnsureRecordLocked(texture)};
                  record.modificationTick = ++modificationTick;
                  record.lastWriter = Writer::Gpu;
                  ++record.gpuWriteCount;
                  ++record.renderTargetUseCount;
                  const u64 occurrence{++gpuWriteEvents};
                  if (!record.aliases.empty() || EsTmShouldLog(occurrence, 96, 4096)) {
                      const u32 baseMip{view ? view->range.baseMipLevel : 0};
                      const u32 levelCount{view ? view->range.levelCount : 0};
                      const u32 baseLayer{view ? view->range.baseArrayLayer : 0};
                      const u32 layerCount{view ? view->range.layerCount : 0};
                      LOGI("[ES-TM] GPU-WRITE/RT tex=#{} tick={} aliases={} iova=0x{:X} mip={}/{} layer={}/{} writes={} occurrence #{}",
                           record.id, record.modificationTick, record.aliases.size(), record.lastIova,
                           baseMip, levelCount, baseLayer, layerCount, record.gpuWriteCount, occurrence);
                  }
              }

              void EmeraldTextureManager::ObserveSampled(Texture &texture, TextureView *view) {
                  std::scoped_lock lock{mutex};
                  auto &record{EnsureRecordLocked(texture)};
                  ++record.sampledUseCount;
                  const u64 occurrence{++sampledEvents};

                  u64 newestId{record.id};
                  u64 newestTick{record.modificationTick};
                  Writer newestWriter{record.lastWriter};
                  for (const u64 aliasId : record.aliases) {
                      auto it{records.find(aliasId)};
                      if (it == records.end())
                          continue;
                      if (it->second.modificationTick > newestTick) {
                          newestId = aliasId;
                          newestTick = it->second.modificationTick;
                          newestWriter = it->second.lastWriter;
                      }
                  }

                  const u32 baseMip{view ? view->range.baseMipLevel : 0};
                  const u32 levelCount{view ? view->range.levelCount : 0};
                  const u32 baseLayer{view ? view->range.baseArrayLayer : 0};
                  const u32 layerCount{view ? view->range.layerCount : 0};

                  if (newestId != record.id && newestTick > record.modificationTick) {
                      const u64 staleOccurrence{++staleSampledEvents};
                      if (EsTmShouldLog(staleOccurrence, 256, 1024)) {
                          LOGI("[ES-TM] STALE-SAMPLED tex=#{} tick={} writer={} newestAlias=#{} newestTick={} newestWriter={} aliases={} iova=0x{:X} mip={}/{} layer={}/{} staleOccurrence #{}",
                               record.id, record.modificationTick, WriterName(record.lastWriter),
                               newestId, newestTick, WriterName(newestWriter), record.aliases.size(), record.lastIova,
                               baseMip, levelCount, baseLayer, layerCount, staleOccurrence);
                      }
                  } else if (EsTmShouldLog(occurrence, 64, 8192)) {
                      LOGI("[ES-TM] SAMPLED tex=#{} tick={} writer={} aliases={} iova=0x{:X} mip={}/{} layer={}/{} uses={} occurrence #{}",
                           record.id, record.modificationTick, WriterName(record.lastWriter), record.aliases.size(), record.lastIova,
                           baseMip, levelCount, baseLayer, layerCount, record.sampledUseCount, occurrence);
                  }
              }

          '''
          if 'EmeraldTextureManager::RegisterTexture' not in m:
              if ctor_anchor not in m:
                  raise SystemExit('Phase0: TextureManager constructor anchor missing')
              m = m.replace(ctor_anchor, impl + ctor_anchor, 1)

