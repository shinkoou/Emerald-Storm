# Emerald Storm v0.2.44 Phase13 Renderer Bridge + UI Phase C
name: Emerald Storm v0.2.44 FIX3 Phase13 Texture Renderer Bridge + AMOLED UI C + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase13-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.44-FIX3-Phase13-Texture-Renderer-Bridge-AMOLED-UI-C-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V243_PHASE12_COMMIT: a5a5ab6d7c0f087de0449f48d6b1ad1b86347ab7
  # Historical pins required by the Action105 replay chain.
  V242_PHASE11_COMMIT: 3bbd5cab85ef11ee8327fad537e331493da55a55
  V241_PHASE10_COMMIT: bb308016f64b73f05d4d263c32ce5b8ade7878f9
  V241_FIX5_COMMIT: d99d5e7e073c7c6aa61559f703625e6b5e353e3b
  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
  V239_COMMIT: ca15dc208beb65a61a163ecd1e44eb7148992797
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.44 FIX3 Phase13 Renderer Bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct exact proven Phase12 FIX3 Action105 source
        run: |
          set -euo pipefail
          echo "[ES-PHASE13-FIX2] validating pinned provenance chain"
          for commit in \
            "$V243_PHASE12_COMMIT" \
            "$V242_PHASE11_COMMIT" \
            "$V241_PHASE10_COMMIT" \
            "$V241_FIX5_COMMIT" \
            "$V240_COMMIT" \
            "$V239_COMMIT" \
            "$V238_COMMIT" \
            "$V237_COMMIT" \
            "$V235_COMMIT"; do
            git cat-file -e "${commit}^{commit}"
            echo "[ES-PHASE13-FIX2] OK $commit"
          done

          # Action105 materialized these before entering the nested replay payload.
          git show "${V243_PHASE12_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v243-phase12.yml
          git show "${V242_PHASE11_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v242-phase11.yml
          test -s /tmp/emerald-v243-phase12.yml
          test -s /tmp/emerald-v242-phase11.yml
          echo "[ES-PHASE13-FIX2] Action105 replay prerequisites materialized"
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-replay>', 'exec'))"

      - name: Preflight Phase13 source anchors
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/cpp/skyline/gpu/texture_manager.h')
          t = p.read_text()
          print('[ES-PHASE13-FIX3] texture_manager.h public-count =', t.count('      public:\n'))
          print('[ES-PHASE13-FIX3] TextureManager ctor-count =', t.count('        TextureManager(GPU &gpu);\n'))
          start = t.find('    class TextureManager')
          if start < 0:
              raise SystemExit('[ES-PHASE13-FIX3] class TextureManager not found')
          end = t.find('\n    };', start)
          if end < 0:
              end = min(len(t), start + 6000)
          print('[ES-PHASE13-FIX3] TextureManager declaration excerpt:')
          print(t[start:end + 7])
          PY

      - name: Apply Phase13 Emerald Texture Renderer Bridge and UI Phase C
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-patch>', 'exec'))"

      - name: Prepare Phase13 renderer source snapshot
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          OUT="../EmeraldStorm-${ES_VERSION}-RendererSource-Action${GITHUB_RUN_NUMBER}.tar.gz"
          tar -czf "$OUT" \
            app/build.gradle \
            app/src/main/cpp/skyline/gpu/texture_manager.h \
            app/src/main/cpp/skyline/gpu/texture_manager.cpp \
            app/src/main/cpp/skyline/gpu/texture/texture.h \
            app/src/main/cpp/skyline/gpu/texture/texture.cpp \
            app/src/main/cpp/skyline/gpu/interconnect/command_executor.h \
            app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp \
            app/src/main/cpp/skyline/gpu/interconnect/common/textures.h \
            app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp \
            app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc \
            app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp \
            app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.h \
            app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp \
            EMERALD_PHASE13_PROVENANCE.md \
            EMERALD_UI_PHASEC_PROVENANCE.md
          sha256sum "$OUT" > "${OUT}.sha256"

      - name: Upload Phase13 renderer source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-RendererSource-Action${{ github.run_number }}
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-RendererSource-Action${{ github.run_number }}.tar.gz
            EmeraldStorm-${{ env.ES_VERSION }}-RendererSource-Action${{ github.run_number }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify Phase13 structural bridge
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-verify>', 'exec'))"

      - name: Phase13 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-audit>', 'exec'))"

      - name: Prove generated Phase13 code before compilation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          grep -nE 'versionCode 54|0.2.44-cam-phase13' app/build.gradle
          grep -nF 'coherenceInvalidationEpoch' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'BeginGuestCacheInvalidation' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF 'NotifyCpuWrite' app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -nF 'ReconcileCoherence(ctx.gpu.texture.CurrentInvalidationEpoch())' app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
          grep -nF '[ES-TEXCOH-REFRESH]' app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -nF 'strong-cpu-sync' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF '[ES-MAXWELL-TEXCACHE-INVALIDATE]' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF '#000000' app/src/main/res/values-night/colors_emerald_ui.xml
          grep -nF '@color/emerald_ui_background' app/src/main/res/layout/main_activity.xml
          grep -nF '@color/emerald_ui_outline' app/src/main/res/layout/app_item_grid.xml
          echo '[ES-PHASE13] generated proof passed'

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          for provenance in \
            EMERALD_PHASE5_PROVENANCE.md \
            EMERALD_PHASE6_PROVENANCE.md \
            EMERALD_PHASE7_PROVENANCE.md \
            EMERALD_PHASE8_PROVENANCE.md \
            EMERALD_PHASE9_PROVENANCE.md \
            EMERALD_PHASE10_PROVENANCE.md \
            EMERALD_PHASE11_PROVENANCE.md \
            EMERALD_PHASE12_PROVENANCE.md \
            EMERALD_PHASE13_PROVENANCE.md \
            EMERALD_UI_PHASEA_PROVENANCE.md \
            EMERALD_UI_PHASEB_PROVENANCE.md \
            EMERALD_UI_PHASEC_PROVENANCE.md; do
            test -f "$provenance"
            cp "$provenance" "../$provenance"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
            EMERALD_PHASE8_PROVENANCE.md
            EMERALD_PHASE9_PROVENANCE.md
            EMERALD_PHASE10_PROVENANCE.md
            EMERALD_PHASE11_PROVENANCE.md
            EMERALD_PHASE12_PROVENANCE.md
            EMERALD_PHASE13_PROVENANCE.md
            EMERALD_UI_PHASEA_PROVENANCE.md
            EMERALD_UI_PHASEB_PROVENANCE.md
            EMERALD_UI_PHASEC_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
