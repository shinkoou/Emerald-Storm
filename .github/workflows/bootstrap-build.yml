          insert = '''        auto texture{frame.textureView->texture};\n        if (gpu.storm4TextureForensics) {\n            const u64 esFrame{gpu.storm4PresentFrame.fetch_add(1, std::memory_order_relaxed) + 1};\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            LOGI("[ES-S4-FRAME] event={} frame={} presentedTex=#{} view=#{} gen={} writer={} lastWriteEvent={} layout={} dims={}x{}x{} crop=({},{}-{},{}), transform={} swapInterval={}",\n                 event, esFrame, texture->debugId, frame.textureView->esViewId,\n                 texture->esContentGeneration.load(std::memory_order_relaxed), texture->esLastWriter.load(std::memory_order_relaxed),\n                 texture->esLastWriteEvent.load(std::memory_order_relaxed), static_cast<u32>(texture->layout),\n                 texture->dimensions.width, texture->dimensions.height, texture->dimensions.depth,\n                 frame.crop.left, frame.crop.top, frame.crop.right, frame.crop.bottom, static_cast<u32>(frame.transform), frame.swapInterval);\n        }\n        if (frame.textureView->format != swapchainFormat || texture->dimensions != swapchainExtent)\n'''
          t = replace_once(t, anchor, insert, 'Present frame black-box trace')
