# CORRETO: Emerald Storm v0.2.39 Phase7 Storm4 Texture Forensics + TIC Fix + Settings Trace
name: Emerald Storm v0.2.39 CAM Phase7 Storm4 Texture Forensics + TIC Fix + Settings Trace + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase7-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.39-CAM-Phase7-Storm4-Texture-Forensics-TIC-Fix-Settings-Trace-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.39 CAM Phase7 + Full PT-BR
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.38 Action81 source exactly
        run: |
          set -euo pipefail
          git show "${V238_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v238.yml
          test -s /tmp/emerald-v238.yml
          python3 - <<'PYREPLAY'
          from __future__ import annotations
          import os, re, subprocess
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          WORKFLOW = Path('/tmp/emerald-v238.yml')
          SOURCE_DIR = os.environ['ES_SOURCE_DIR']
          lines = WORKFLOW.read_text().splitlines()
          starts = []
          for i, line in enumerate(lines):
              m = re.match(r'^      - name:\s*(.+?)\s*$', line)
              if m:
                  starts.append((i, m.group(1).strip('"\'')))

          run_steps = []
          for pos, (start, name) in enumerate(starts):
              end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
              block = lines[start:end]
              if name == 'Build Emerald Storm APK':
                  break
              workdir = None
              run_at = None
              for j, line in enumerate(block):
                  m = re.match(r'^        working-directory:\s*(.+?)\s*$', line)
                  if m:
                      workdir = m.group(1).strip('"\'')
                  if re.match(r'^        run:\s*\|\s*$', line):
                      run_at = j
                      break
              if run_at is None:
                  continue
              script_lines = []
              for line in block[run_at + 1:]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif not line.strip():
                      script_lines.append('')
                  else:
                      break
              run_steps.append((name, workdir, '\n'.join(script_lines) + '\n'))

          if not run_steps or run_steps[0][0] != 'Reconstruct proven v0.2.37 source exactly':
              raise SystemExit('v0.2.38 replay parser did not find expected first run step')
          if run_steps[-1][0] != 'CAM Phase6 regression safety audit':
              raise SystemExit(f'v0.2.38 replay parser ended at unexpected step: {run_steps[-1][0] if run_steps else "none"}')

          def resolve_workdir(raw):
              if not raw:
                  return ROOT
              expr_open = '$' + '{' + '{'
              source_expr = expr_open + ' env.ES_SOURCE_DIR ' + '}' + '}'
              raw = raw.replace(source_expr, SOURCE_DIR)
              if expr_open in raw:
                  raise SystemExit('Unsupported GitHub expression in replay workdir: ' + raw)
              return (ROOT / raw).resolve()

          for number, (name, workdir, script) in enumerate(run_steps, 1):
              cwd = resolve_workdir(workdir)
              print(f'\n[ES-REPLAY238] {number:02d}/{len(run_steps)} {name}', flush=True)
              subprocess.run(['bash', '-e', '-u', '-o', 'pipefail', '-c', script], cwd=cwd, env=os.environ.copy(), check=True)

          gradle = ROOT / SOURCE_DIR / 'app/build.gradle'
          body = gradle.read_text()
          if 'versionCode 48' not in body or '0.2.38-cam-phase6-graphics-settings-foundation-ptbr' not in body:
              raise SystemExit('v0.2.38 reconstruction version verification failed')
          dma = (ROOT / SOURCE_DIR / 'app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_dma.cpp').read_text()
          if 'const bool esMultiLineEnable' not in dma:
              raise SystemExit('v0.2.38 Action81 FIX4 DMA correction missing')
          print('[ES-REPLAY238] v0.2.38 source reconstructed from proven Action #81 workflow')
          PYREPLAY

      - name: Apply CAM Phase7 Storm4 texture forensics and TIC fix
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PYPHASE7'
          from pathlib import Path
          import re
          
          root = Path('.')
          
          def read(rel):
              return (root/rel).read_text()
          
          def write(rel, text):
              (root/rel).write_text(text)
          
          def replace_once(text, old, new, label):
              c = text.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: anchor count={c}, expected 1')
              return text.replace(old, new, 1)
          
          # ---------------------------------------------------------------------------
          # 0) Version identity.
          # ---------------------------------------------------------------------------
          rel = 'app/build.gradle'
          t = read(rel)
          t, n1 = re.subn(r'versionCode\s+48\b', 'versionCode 49', t, count=1)
          t, n2 = re.subn(r'versionName\s+"0\.2\.38-cam-phase6-graphics-settings-foundation-ptbr"',
                           'versionName "0.2.39-cam-phase7-storm4-texture-forensics-tic-fix-settings-trace-ptbr"', t, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'version bump failed: code={n1}, name={n2}')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 1) GPU title identity: enable heavy texture forensics only for Storm 4.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu.h'
          t = read(rel)
          if '#include <string>\n' not in t:
              t = replace_once(t, '#include <adrenotools/driver.h>\n', '#include <adrenotools/driver.h>\n#include <string>\n', 'gpu.h string include')
          anchor = '        memory::Buffer debugTracingBuffer; //!< General use buffer for debug tracing, first 4 bytes are allocated for checkpoints\n\n'
          insert = anchor + '''        // Emerald Storm Phase7: per-title forensic gate. The heavy texture trace is\n        // intentionally restricted to Storm 4 so other games do not pay the logging cost.\n        std::string currentTitleId{};\n        bool storm4TextureForensics{};\n\n'''
          t = replace_once(t, anchor, insert, 'GPU title forensic fields')
          write(rel, t)
          
          rel = 'app/src/main/cpp/skyline/gpu.cpp'
          t = read(rel)
          old = '''    void GPU::Initialise() {\n        std::string titleId{state.loader->nacp->GetSaveDataOwnerId()};\n        graphicsPipelineAssembler.emplace(*this, state.os->publicAppFilesPath + "vk_graphics_pipeline_cache/" + titleId);\n'''
          new = '''    void GPU::Initialise() {\n        currentTitleId = state.loader->nacp->GetSaveDataOwnerId();\n        storm4TextureForensics = currentTitleId == "010084D00CF5E000";\n        LOGI("[ES-S4TEX] title={} forensics={}", currentTitleId, storm4TextureForensics);\n\n        const std::string &titleId{currentTitleId};\n        graphicsPipelineAssembler.emplace(*this, state.os->publicAppFilesPath + "vk_graphics_pipeline_cache/" + titleId);\n'''
          t = replace_once(t, old, new, 'GPU Initialise title gate')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 2) Settings trace: prove Java payload and native values independently.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/java/org/stratoemu/strato/EmulationActivity.kt'
          t = read(rel)
          old = '''        GpuDriverHelper.ensureFileRedirectDir(this)\n        emulationThread = Thread {\n            executeApplication(rom.toString(), romType, romFd.detachFd(), NativeSettings(this, emulationSettings), applicationContext.getPublicFilesDir().canonicalPath + "/", applicationContext.filesDir.canonicalPath + "/", applicationInfo.nativeLibraryDir + "/", assets)\n            returnFromEmulation()\n        }\n'''
          new = '''        GpuDriverHelper.ensureFileRedirectDir(this)\n        val nativeSettings = NativeSettings(this, emulationSettings)\n        Log.i(\n            Tag,\n            "[ES-SETTINGS-JAVA] title=${item.titleId ?: item.key()} scope=${if (emulationSettings.isGlobal) "global" else "custom"} " +\n                "anisotropy=${nativeSettings.anisotropyMode} dma=${nativeSettings.dmaAccuracy} " +\n                "vramAggressive=${nativeSettings.freeGuestTextureMemory} async=${nativeSettings.useAsynchronousShaders} " +\n                "descriptorCompat=${nativeSettings.enableDescriptorCompatibility}"\n        )\n        emulationThread = Thread {\n            executeApplication(rom.toString(), romType, romFd.detachFd(), nativeSettings, applicationContext.getPublicFilesDir().canonicalPath + "/", applicationContext.filesDir.canonicalPath + "/", applicationInfo.nativeLibraryDir + "/", assets)\n            returnFromEmulation()\n        }\n'''
          t = replace_once(t, old, new, 'Java settings payload trace')
          write(rel, t)
          
          rel = 'app/src/main/cpp/emu_jni.cpp'
          t = read(rel)
          anchor = '''    skyline::AsyncLogger::Initialize(*settings->logLevel, publicAppFilesPath + "logs/emulation.log");
          '''
          insert = '''    skyline::AsyncLogger::Initialize(*settings->logLevel, publicAppFilesPath + "logs/emulation.log");
              LOGI("[ES-SETTINGS-NATIVE] anisotropy={} dma={} vramAggressive={} async={} descriptorCompat={}",
                   *settings->anisotropyMode, *settings->dmaAccuracy, *settings->freeGuestTextureMemory,
                   *settings->useAsynchronousShaders, *settings->enableDescriptorCompatibility);
          '''
          t = replace_once(t, anchor, insert, 'Native settings trace after logger init')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 3) Storm 4 texture forensics + same-sequence cache correctness fix.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp'
          t = read(rel)
          if '#include <mutex>\n' not in t:
              t = replace_once(t, '#include <atomic>\n', '#include <atomic>\n#include <mutex>\n#include <unordered_set>\n', 'textures forensic includes')
          
          ns_anchor = 'namespace skyline::gpu::interconnect {\n'
          ns_insert = '''namespace skyline::gpu::interconnect {\n    namespace {\n        std::mutex esStorm4TextureSeenMutex;\n        std::unordered_set<u64> esStorm4SeenTextureIds;\n        std::atomic<u64> esStorm4FirstUseEvents{};\n        std::atomic<u64> esStorm4TicChangeEvents{};\n        std::atomic<u64> esStorm4SameSequenceChanges{};\n        std::atomic<u64> esStorm4StaleReuseBlocked{};\n\n        bool EsStorm4ShouldLog(u64 occurrence, u64 first = 256, u64 every = 2048) {\n            return occurrence <= first || (every && (occurrence % every) == 0);\n        }\n    }\n'''
          t = replace_once(t, ns_anchor, ns_insert, 'textures forensic globals')
          
          old = '''            if (cached.sequenceNumber == ctx.channelCtx.channelSequenceNumber)\n                return cached.view;\n\n            // Normal resolved textures can remain cached across channel sequences while the TIC\n            // and backing stay unchanged. A transient null fallback must be retried on the next\n            // sequence so a guest mapping that appears later can recover automatically.\n            if (!cached.transientNull && cached.tic == textureHeaders[index] && !cached.view->texture->replaced) {\n                cached.sequenceNumber = ctx.channelCtx.channelSequenceNumber;\n                return cached.view;\n            }\n'''
          new = '''            const auto &esCurrentTic{textureHeaders[index]};\n            const u64 esCurrentSequence{ctx.channelCtx.channelSequenceNumber};\n            const bool esSameSequence{cached.sequenceNumber == esCurrentSequence};\n            const bool esTicEqual{cached.tic == esCurrentTic};\n            const bool esReplaced{cached.view->texture->replaced};\n\n            // Phase7 correctness fix: sequence equality alone is never sufficient to reuse a\n            // TextureView. Storm 4 can rewrite a TIC slot inside the same channel sequence.\n            // Reuse is legal only when the full TIC still matches and the backing is live.\n            if (ctx.gpu.storm4TextureForensics && !esTicEqual) {\n                const u64 changeOccurrence{esStorm4TicChangeEvents.fetch_add(1, std::memory_order_relaxed) + 1};\n                const bool esIovaChanged{cached.tic.Iova() != esCurrentTic.Iova()};\n                const bool esFormatChanged{cached.tic.formatWord.Raw() != esCurrentTic.formatWord.Raw()};\n                if (esSameSequence)\n                    esStorm4SameSequenceChanges.fetch_add(1, std::memory_order_relaxed);\n                if (EsStorm4ShouldLog(changeOccurrence, 2048, 4096)) {\n                    LOGI("[ES-S4-TIC-CHANGE] slot={} sameSequence={} oldSequence={} sequence={} oldTex=#{} oldIova=0x{:X} newIova=0x{:X} iovaChanged={} oldFmt=0x{:08X} newFmt=0x{:08X} formatChanged={} oldType={} newType={} oldDims={}x{} newDims={}x{} oldMip={}/{} newMip={}/{} transientNull={} replaced={} occurrence #{}",\n                         index, esSameSequence, cached.sequenceNumber, esCurrentSequence, cached.view->texture->debugId,\n                         cached.tic.Iova(), esCurrentTic.Iova(), esIovaChanged,\n                         cached.tic.formatWord.Raw(), esCurrentTic.formatWord.Raw(), esFormatChanged,\n                         static_cast<u32>(cached.tic.textureType), static_cast<u32>(esCurrentTic.textureType),\n                         cached.tic.widthMinusOne + 1, cached.tic.heightMinusOne + 1,\n                         esCurrentTic.widthMinusOne + 1, esCurrentTic.heightMinusOne + 1,\n                         static_cast<u32>(cached.tic.viewConfig.mipMinLevel), static_cast<u32>(cached.tic.viewConfig.mipMaxLevel),\n                         static_cast<u32>(esCurrentTic.viewConfig.mipMinLevel), static_cast<u32>(esCurrentTic.viewConfig.mipMaxLevel),\n                         cached.transientNull, esReplaced, changeOccurrence);\n                }\n            }\n\n            if (ctx.gpu.storm4TextureForensics && esSameSequence && (!esTicEqual || esReplaced)) {\n                const u64 blockedOccurrence{esStorm4StaleReuseBlocked.fetch_add(1, std::memory_order_relaxed) + 1};\n                if (EsStorm4ShouldLog(blockedOccurrence, 2048, 4096)) {\n                    LOGI("[ES-S4TEX] STALE-REUSE-BLOCKED slot={} tex=#{} sequence={} ticEqual={} replaced={} transientNull={} oldIova=0x{:X} newIova=0x{:X} oldFmt=0x{:08X} newFmt=0x{:08X} occurrence #{}",\n                         index, cached.view->texture->debugId, esCurrentSequence, esTicEqual, esReplaced, cached.transientNull,\n                         cached.tic.Iova(), esCurrentTic.Iova(), cached.tic.formatWord.Raw(), esCurrentTic.formatWord.Raw(), blockedOccurrence);\n                }\n            }\n\n            // Same sequence may still use a transient-null/stable fallback, but only while the\n            // TIC itself is unchanged. Across sequences, transient nulls must be retried.\n            if (esTicEqual && !esReplaced && (esSameSequence || !cached.transientNull)) {\n                cached.sequenceNumber = esCurrentSequence;\n                return cached.view;\n            }\n'''
          t = replace_once(t, old, new, 'same-sequence TIC fix')
          
          # Add first-use trace at the point where a TIC has resolved to an actual TextureView.
          anchor = '''        // EmeraldTextureManager Phase2: record TIC -> resolved TextureView provenance.\n        if (texture && texture->texture.get()) {\n'''
          insert = '''        // EmeraldTextureManager Phase2: record TIC -> resolved TextureView provenance.\n        if (texture && texture->texture.get()) {\n            if (ctx.gpu.storm4TextureForensics) {\n                const u64 esTextureId{texture->texture->debugId};\n                bool esFirstUse{};\n                {\n                    std::scoped_lock lock{esStorm4TextureSeenMutex};\n                    esFirstUse = esStorm4SeenTextureIds.insert(esTextureId).second;\n                }\n                if (esFirstUse) {\n                    const u64 firstOccurrence{esStorm4FirstUseEvents.fetch_add(1, std::memory_order_relaxed) + 1};\n                    const u32 esViewVkFormat{texture->format ? static_cast<u32>(texture->format->vkFormat) : 0U};\n                    const size_t esGuestBytes{texture->texture->guest ? texture->texture->guest->GetSize() : 0};\n                    LOGI("[ES-S4TEX] FIRST-USE tex=#{} slot={} sequence={} iova=0x{:X} bytes=0x{:X} rawFmt=0x{:08X} imageFmt={} viewVkFmt={} ticType={} shaderType={} viewType={} dims={}x{} mips={}/{} layers={}/{} srgb={} normalized={} headerType={} dirty={} everRT={} firstOccurrence #{}",\n                         esTextureId, index, ctx.channelCtx.channelSequenceNumber, textureHeader.Iova(), esGuestBytes,\n                         textureHeader.formatWord.Raw(), static_cast<u32>(textureHeader.formatWord.format), esViewVkFormat,\n                         static_cast<u32>(textureHeader.textureType), static_cast<u32>(shaderType), static_cast<u32>(texture->type),\n                         textureHeader.widthMinusOne + 1, textureHeader.heightMinusOne + 1,\n                         texture->range.baseMipLevel, texture->range.levelCount,\n                         texture->range.baseArrayLayer, texture->range.layerCount,\n                         static_cast<u32>(textureHeader.isSrgb), static_cast<u32>(textureHeader.normalizedCoordinates),\n                         static_cast<u32>(textureHeader.headerType), texture->texture->GetDebugDirtyState(),\n                         texture->texture->WasEverUsedAsRt(), firstOccurrence);\n                }\n            }\n'''
          t = replace_once(t, anchor, insert, 'Storm4 first-use texture trace')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 4) VRAM policy proof: log actual aggressive frees/restores for Storm 4.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/texture/texture.cpp'
          t = read(rel)
          old = '''    void Texture::FreeGuest() {\n        // Avoid freeing memory if the backing format doesn't match, as otherwise texture data would be lost on the guest side, also avoid if fast readback is active\n        if (*gpu.state.settings->freeGuestTextureMemory && guest->format == format && !(accumulatedGuestWaitTime > SkipReadbackHackWaitTimeThreshold && *gpu.state.settings->enableFastGpuReadbackHack)) {\n            gpu.state.process->memory.FreeMemory(mirror);\n            memoryFreed = true;\n        }\n    }\n'''
          new = '''    void Texture::FreeGuest() {\n        // Avoid freeing memory if the backing format doesn't match, as otherwise texture data would be lost on the guest side, also avoid if fast readback is active\n        if (*gpu.state.settings->freeGuestTextureMemory && guest->format == format && !(accumulatedGuestWaitTime > SkipReadbackHackWaitTimeThreshold && *gpu.state.settings->enableFastGpuReadbackHack)) {\n            if (gpu.storm4TextureForensics && !memoryFreed) {\n                static std::atomic<u64> esVramFreeEvents{};\n                const u64 occurrence{esVramFreeEvents.fetch_add(1, std::memory_order_relaxed) + 1};\n                if (occurrence <= 256 || (occurrence % 2048) == 0)\n                    LOGI("[ES-VRAM] FREE-GUEST tex=#{} bytes=0x{:X} dims={}x{}x{} occurrence #{}",\n                         debugId, guest->GetSize(), dimensions.width, dimensions.height, dimensions.depth, occurrence);\n            }\n            gpu.state.process->memory.FreeMemory(mirror);\n            memoryFreed = true;\n        }\n    }\n'''
          t = replace_once(t, old, new, 'VRAM free trace')
          
          old = '''        {\n            std::scoped_lock lock{stateMutex};\n            if (cpuDirty && dirtyState == DirtyState::Clean) {\n'''
          new = '''        bool esGuestWasFreed{};\n        {\n            std::scoped_lock lock{stateMutex};\n            esGuestWasFreed = memoryFreed;\n            if (cpuDirty && dirtyState == DirtyState::Clean) {\n'''
          # Need replace only in SynchronizeGuest. This exact anchor occurs possibly once or multiple; count.
          if t.count(old) != 1:
              raise SystemExit(f'VRAM restore prelude anchor count={t.count(old)}, expected 1')
          t = t.replace(old, new, 1)
          
          old = '''            dirtyState = cpuDirty ? DirtyState::CpuDirty : DirtyState::Clean;\n            memoryFreed = false;\n        }\n\n        if (layout == vk::ImageLayout::eUndefined || format != guest->format)\n'''
          new = '''            dirtyState = cpuDirty ? DirtyState::CpuDirty : DirtyState::Clean;\n            memoryFreed = false;\n        }\n\n        if (gpu.storm4TextureForensics && esGuestWasFreed) {\n            static std::atomic<u64> esVramRestoreEvents{};\n            const u64 occurrence{esVramRestoreEvents.fetch_add(1, std::memory_order_relaxed) + 1};\n            if (occurrence <= 256 || (occurrence % 2048) == 0)\n                LOGI("[ES-VRAM] RESTORE-GUEST tex=#{} bytes=0x{:X} dims={}x{}x{} occurrence #{}",\n                     debugId, guest->GetSize(), dimensions.width, dimensions.height, dimensions.depth, occurrence);\n        }\n\n        if (layout == vk::ImageLayout::eUndefined || format != guest->format)\n'''
          t = replace_once(t, old, new, 'VRAM restore trace')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 5) Provenance.
          # ---------------------------------------------------------------------------
          (root/'EMERALD_PHASE7_PROVENANCE.md').write_text('''# Emerald Storm v0.2.39 Phase7 provenance\n\nPhase7 is an original Emerald Storm implementation on top of the proven v0.2.38 Action #81 source reconstruction.\n\nChanges:\n- Storm 4-only texture forensic gate for title ID `010084D00CF5E000`.\n- Full first-use trace for every unique resolved texture ID.\n- TIC change trace including same-sequence, IOVA, format, dimensions, mip range and backing identity.\n- Functional fix: a cached TextureView is no longer reused solely because `channelSequenceNumber` matches; the complete TIC must still match and the backing must not be replaced.\n- `STALE-REUSE-BLOCKED` event proving when the fix changes behavior.\n- Independent Java and native settings traces for anisotropy, DMA, VRAM policy, async shaders and descriptor compatibility.\n- Storm 4 VRAM aggressive-policy free/restore events.\n\nNo Eden/Yuzu GPL source code was copied. Their behavior remains reference material only.\n''')
          
          print('[ES-PHASE7] Storm4 forensics + TIC same-sequence fix + settings trace applied')
          PYPHASE7

      - name: Verify CAM Phase7 forensic coverage and settings trace
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.')
          required={
              'gradle':'app/build.gradle',
              'gpu_h':'app/src/main/cpp/skyline/gpu.h',
              'gpu_cpp':'app/src/main/cpp/skyline/gpu.cpp',
              'textures':'app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp',
              'texture':'app/src/main/cpp/skyline/gpu/texture/texture.cpp',
              'jni':'app/src/main/cpp/emu_jni.cpp',
              'activity':'app/src/main/java/org/stratoemu/strato/EmulationActivity.kt',
              'dma':'app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_dma.cpp',
          }
          p={k:r/v for k,v in required.items()}
          for x in p.values():
              if not x.exists(): raise SystemExit('missing '+str(x))

          gradle=p['gradle'].read_text()
          if 'versionCode 49' not in gradle or '0.2.39-cam-phase7-storm4-texture-forensics-tic-fix-settings-trace-ptbr' not in gradle:
              raise SystemExit('v0.2.39 identity invalid')

          gpu_h=p['gpu_h'].read_text(); gpu_cpp=p['gpu_cpp'].read_text(); textures=p['textures'].read_text()
          for token in ['currentTitleId', 'storm4TextureForensics']:
              if token not in gpu_h: raise SystemExit('GPU forensic gate missing: '+token)
          for token in ['010084D00CF5E000', '[ES-S4TEX] title=']:
              if token not in gpu_cpp: raise SystemExit('Storm4 title gate missing: '+token)
          for token in ['[ES-S4TEX] FIRST-USE', '[ES-S4-TIC-CHANGE]', '[ES-S4TEX] STALE-REUSE-BLOCKED',
                        'const bool esTicEqual', 'esTicEqual && !esReplaced && (esSameSequence || !cached.transientNull)']:
              if token not in textures: raise SystemExit('Phase7 texture forensic/fix missing: '+token)
          unsafe='if (cached.sequenceNumber == ctx.channelCtx.channelSequenceNumber)\n                return cached.view;'
          if unsafe in textures:
              raise SystemExit('unsafe same-sequence-only TextureView reuse still present')

          jni=p['jni'].read_text(); activity=p['activity'].read_text(); texture=p['texture'].read_text(); dma=p['dma'].read_text()
          if '[ES-SETTINGS-JAVA]' not in activity: raise SystemExit('Java settings payload trace missing')
          if '[ES-SETTINGS-NATIVE]' not in jni: raise SystemExit('native settings trace missing')
          if jni.index('AsyncLogger::Initialize') > jni.index('[ES-SETTINGS-NATIVE]'):
              raise SystemExit('native settings trace occurs before logger initialization')
          for token in ['[ES-VRAM] FREE-GUEST', '[ES-VRAM] RESTORE-GUEST']:
              if token not in texture: raise SystemExit('VRAM runtime proof missing: '+token)
          for token in ['channelCtx.executor.DmaAccuracy()', 'const bool esMultiLineEnable', '[ES-DMA] mode=']:
              if token not in dma: raise SystemExit('DMA backend/FIX4 missing: '+token)

          if not (r/'EMERALD_PHASE7_PROVENANCE.md').exists(): raise SystemExit('Phase7 provenance missing')
          print('[ES-CI] Phase7 forensic/fix/settings verification passed')
          PY

      - name: CAM Phase7 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.')
          fermi=(r/'app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp').read_text()
          pipeline=(r/'app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc').read_text()
          shader=(r/'app/src/main/cpp/skyline/gpu/shader_manager.cpp').read_text()
          prefs=(r/'app/src/main/res/xml/emulation_preferences.xml').read_text()
          native=(r/'app/src/main/java/org/stratoemu/strato/settings/NativeSettings.kt').read_text()
          if 'const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};' not in fermi: raise SystemExit('Storm4 Fermi2D FlipY missing')
          if 'size_t sizeOverride{std::min<size_t>(cbufSizes[idx], view.size)};' not in pipeline: raise SystemExit('correct CBuffer min clamp missing')
          if 'support_descriptor_aliasing = descriptorAliasingSupported' not in shader: raise SystemExit('Phase5 descriptor safety missing')
          for key in ['use_asynchronous_shaders','anisotropy_mode','dma_accuracy','vram_usage_mode']:
              if key not in prefs: raise SystemExit('graphics setting missing: '+key)
          for token in ['var anisotropyMode : Int','var dmaAccuracy : Int','pref.vramUsageMode == 1']:
              if token not in native: raise SystemExit('Phase6 NativeSettings plumbing missing: '+token)
          if 'ResolveSampledFeedback(texture)' in pipeline: raise SystemExit('rejected feedback snapshot routing re-enabled')
          print('[ES-CI] Phase7 regression audit passed')
          PY

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          cp EMERALD_PHASE5_PROVENANCE.md ../EMERALD_PHASE5_PROVENANCE.md
          cp EMERALD_PHASE6_PROVENANCE.md ../EMERALD_PHASE6_PROVENANCE.md
          cp EMERALD_PHASE7_PROVENANCE.md ../EMERALD_PHASE7_PROVENANCE.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
