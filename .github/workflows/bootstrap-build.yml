diff --git a/.github/workflows/bootstrap-build.yml b/.github/workflows/bootstrap-build.yml
--- a/.github/workflows/bootstrap-build.yml
+++ b/.github/workflows/bootstrap-build.yml
@@
-# Emerald Storm v0.2.44 Phase13 Renderer Bridge + UI Phase C
-name: Emerald Storm v0.2.44 FIX1 Phase13 Texture Renderer Bridge + AMOLED UI C + PT-BR
+# Emerald Storm v0.2.44 Phase13 Renderer Bridge + UI Phase C
+name: Emerald Storm v0.2.44 FIX2 Phase13 Texture Renderer Bridge + AMOLED UI C + PT-BR
@@
 env:
-  ES_VERSION: v0.2.44-FIX1-Phase13-Texture-Renderer-Bridge-AMOLED-UI-C-Full-PTBR
+  ES_VERSION: v0.2.44-FIX2-Phase13-Texture-Renderer-Bridge-AMOLED-UI-C-Full-PTBR
   ES_SOURCE_DIR: EmeraldStorm-v0.1.0
   V243_PHASE12_COMMIT: a5a5ab6d7c0f087de0449f48d6b1ad1b86347ab7
+  # Historical pins required by the Action105 replay chain.
+  V242_PHASE11_COMMIT: 3bbd5cab85ef11ee8327fad537e331493da55a55
+  V241_PHASE10_COMMIT: bb308016f64b73f05d4d263c32ce5b8ade7878f9
+  V241_FIX5_COMMIT: d99d5e7e073c7c6aa61559f703625e6b5e353e3b
+  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
+  V239_COMMIT: ca15dc208beb65a61a163ecd1e44eb7148992797
+  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
+  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
+  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c
@@
-    name: Build Emerald Storm v0.2.44 Phase13 Renderer Bridge
+    name: Build Emerald Storm v0.2.44 FIX2 Phase13 Renderer Bridge
@@
       - name: Reconstruct exact proven Phase12 FIX3 Action105 source
         run: |
           set -euo pipefail
-          git cat-file -e "${V243_PHASE12_COMMIT}^{commit}"
+          echo "[ES-PHASE13-FIX2] validating pinned provenance chain"
+          for commit in \
+            "$V243_PHASE12_COMMIT" \
+            "$V242_PHASE11_COMMIT" \
+            "$V241_PHASE10_COMMIT" \
+            "$V241_FIX5_COMMIT" \
+            "$V240_COMMIT" \
+            "$V239_COMMIT" \
+            "$V238_COMMIT" \
+            "$V237_COMMIT" \
+            "$V235_COMMIT"; do
+            git cat-file -e "${commit}^{commit}"
+            echo "[ES-PHASE13-FIX2] OK $commit"
+          done
+
+          # The Phase12 compressed replay does not create this top-level
+          # dependency itself. Action105 created it before entering the
+          # replay payload, so Phase13 must reproduce the same environment.
           git show "${V243_PHASE12_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v243-phase12.yml
+          git show "${V242_PHASE11_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v242-phase11.yml
           test -s /tmp/emerald-v243-phase12.yml
+          test -s /tmp/emerald-v242-phase11.yml
+
+          echo "[ES-PHASE13-FIX2] Action105 replay prerequisites materialized"
+
+          # KEEP THE EXISTING <phase13-replay> python3 -c LINE BELOW UNCHANGED.
           python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('...EXISTING PHASE13 REPLAY PAYLOAD...')), '<phase13-replay>', 'exec'))"
@@
       - name: Apply Phase13 Emerald Texture Renderer Bridge and UI Phase C
         working-directory: ${{ env.ES_SOURCE_DIR }}
         run: |
           set -euo pipefail
           # KEEP THE EXISTING <phase13-patch> python3 -c LINE UNCHANGED.
           python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('...EXISTING PHASE13 PATCH PAYLOAD...')), '<phase13-patch>', 'exec'))"
+
+      # Upload the generated renderer source before verification/compilation.
+      # If a later stage fails, we still retain the exact Phase13 source for diagnosis.
+      - name: Prepare Phase13 renderer source snapshot
+        working-directory: ${{ env.ES_SOURCE_DIR }}
+        run: |
+          set -euo pipefail
+          OUT="../EmeraldStorm-${ES_VERSION}-RendererSource-Action${GITHUB_RUN_NUMBER}.tar.gz"
+          tar -czf "$OUT" \
+            app/build.gradle \
+            app/src/main/cpp/skyline/gpu/texture_manager.h \
+            app/src/main/cpp/skyline/gpu/texture_manager.cpp \
+            app/src/main/cpp/skyline/gpu/texture/texture.h \
+            app/src/main/cpp/skyline/gpu/texture/texture.cpp \
+            app/src/main/cpp/skyline/gpu/interconnect/command_executor.h \
+            app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp \
+            app/src/main/cpp/skyline/gpu/interconnect/common/textures.h \
+            app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp \
+            app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc \
+            app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp \
+            app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.h \
+            app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp \
+            EMERALD_PHASE13_PROVENANCE.md \
+            EMERALD_UI_PHASEC_PROVENANCE.md
+          sha256sum "$OUT" > "${OUT}.sha256"
+
+      - name: Upload Phase13 renderer source snapshot
+        uses: actions/upload-artifact@v4
+        with:
+          name: EmeraldStorm-${{ env.ES_VERSION }}-RendererSource-Action${{ github.run_number }}
+          path: |
+            EmeraldStorm-${{ env.ES_VERSION }}-RendererSource-Action${{ github.run_number }}.tar.gz
+            EmeraldStorm-${{ env.ES_VERSION }}-RendererSource-Action${{ github.run_number }}.tar.gz.sha256
+          if-no-files-found: error
+          retention-days: 30
