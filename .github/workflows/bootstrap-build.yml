                      auto &member{it->second};
                      member.modificationTick = tick;
                      member.lastWriter = Writer::Cpu;
                      if (id == origin.id)
                          ++member.cpuWriteCount;

                      for (const u64 aliasId : member.aliases)
                          if (std::find(visited.begin(), visited.end(), aliasId) == visited.end())
                              pending.emplace_back(aliasId);
                  }

                  const u64 occurrence{++cpuWriteEvents};
                  if (visited.size() > 1 || EsTmShouldLog(occurrence, 96, 4096)) {
                      LOGI("[ES-TM2] CPU-GROUP-WRITE originTex=#{} tick={} source={} groupMembers={} aliases={} iova=0x{:X} writes={} dirty={} occurrence #{}",
                           origin.id, tick, source, visited.size(), origin.aliases.size(),
                           origin.lastIova, origin.cpuWriteCount, texture.GetDebugDirtyState(), occurrence);
                  }
              }

          '''
          m = replace_function(m, cpu_start, cpu_end, cpu_impl)

          sample_start = '    void EmeraldTextureManager::ObserveSampled('
