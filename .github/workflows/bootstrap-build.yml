# CORRETO: Emerald Storm v0.2.38 Phase6 Graphics Settings Foundation
name: Emerald Storm v0.2.38 CAM Phase6 Graphics Settings Foundation + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase6-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.38-CAM-Phase6-Graphics-Settings-Foundation-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.38 CAM Phase6 + Full PT-BR
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.37 source exactly
        run: |
          set -euo pipefail
          git show "${V237_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v237.yml
          test -s /tmp/emerald-v237.yml
          python3 - <<'PYREPLAY'
          from __future__ import annotations
          import os, re, subprocess
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          WORKFLOW = Path('/tmp/emerald-v237.yml')
          SOURCE_DIR = os.environ['ES_SOURCE_DIR']
          lines = WORKFLOW.read_text().splitlines()
          starts = []
          for i, line in enumerate(lines):
              m = re.match(r'^      - name:\s*(.+?)\s*$', line)
              if m:
                  starts.append((i, m.group(1).strip('"\'')))

          run_steps = []
          for pos, (start, name) in enumerate(starts):
              end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
              block = lines[start:end]
              if name == 'Build Emerald Storm APK':
                  break
              workdir = None
              run_at = None
              for j, line in enumerate(block):
                  m = re.match(r'^        working-directory:\s*(.+?)\s*$', line)
                  if m:
                      workdir = m.group(1).strip('"\'')
                  if re.match(r'^        run:\s*\|\s*$', line):
                      run_at = j
                      break
              if run_at is None:
                  continue
              script_lines = []
              for line in block[run_at + 1:]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif not line.strip():
                      script_lines.append('')
                  else:
                      break
              run_steps.append((name, workdir, '\n'.join(script_lines) + '\n'))

          if not run_steps or run_steps[0][0] != 'Reconstruct proven v0.2.35 source exactly':
              raise SystemExit('v0.2.37 replay parser did not find expected first run step')
          if run_steps[-1][0] != 'Verify CAM Phase5 safety and UI':
              raise SystemExit(f'v0.2.37 replay parser ended at unexpected step: {run_steps[-1][0] if run_steps else "none"}')

          def resolve_workdir(raw):
              if not raw:
                  return ROOT
              expr_open = '$' + '{{'
              source_expr = expr_open + ' env.ES_SOURCE_DIR }}'
              raw = raw.replace(source_expr, SOURCE_DIR)
              if expr_open in raw:
                  raise SystemExit('Unsupported GitHub expression in replay workdir: ' + raw)
              return (ROOT / raw).resolve()

          for number, (name, workdir, script) in enumerate(run_steps, 1):
              cwd = resolve_workdir(workdir)
              print(f'\n[ES-REPLAY237] {number:02d}/{len(run_steps)} {name}', flush=True)
              subprocess.run(['bash', '-e', '-u', '-o', 'pipefail', '-c', script], cwd=cwd, env=os.environ.copy(), check=True)

          gradle = ROOT / SOURCE_DIR / 'app/build.gradle'
          body = gradle.read_text()
          if 'versionCode 47' not in body or '0.2.37-cam-phase5-qcom-descriptor-safety-async-shaders-ptbr' not in body:
              raise SystemExit('v0.2.37 reconstruction version verification failed')
          print('[ES-REPLAY237] v0.2.37 source reconstructed from proven Action #76 workflow')
          PYREPLAY

      - name: Apply CAM Phase6 functional graphics settings foundation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PYPHASE6'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          root = Path('.')
          
          def read(rel): return (root/rel).read_text()
          def write(rel, text): (root/rel).write_text(text)
          def replace_once(text, old, new, label):
              c = text.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: anchor count={c}, expected 1')
              return text.replace(old, new, 1)
          
          # ---------------------------------------------------------------------------
          # 1) Persistent graphics settings: anisotropy, DMA accuracy, VRAM policy.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/java/org/stratoemu/strato/settings/EmulationSettings.kt'
          t = read(rel)
          t = replace_once(t,
              '    var useAsynchronousShaders by sharedPreferences(context, false, prefName = prefName)\n    var forceTripleBuffering by sharedPreferences(context, true, prefName = prefName)\n',
              '    var useAsynchronousShaders by sharedPreferences(context, false, prefName = prefName)\n'
              '    var anisotropyMode by sharedPreferences(context, 1, prefName = prefName) // 0 Auto, 1 Default, 2/4/8/16 forced minimum\n'
              '    var dmaAccuracy by sharedPreferences(context, 0, prefName = prefName) // 0 Default, 1 Unsafe/Fast, 2 Safe\n'
              '    var vramUsageMode by sharedPreferences(context, 0, prefName = prefName) // 0 Conservative, 1 Aggressive\n'
              '    var forceTripleBuffering by sharedPreferences(context, true, prefName = prefName)\n',
              'EmulationSettings phase6 fields')
          write(rel, t)
          
          rel = 'app/src/main/java/org/stratoemu/strato/settings/NativeSettings.kt'
          t = read(rel)
          t = replace_once(t,
              '    var enableDescriptorCompatibility : Boolean,\n    var useAsynchronousShaders : Boolean,\n    var forceTripleBuffering : Boolean,\n',
              '    var enableDescriptorCompatibility : Boolean,\n    var useAsynchronousShaders : Boolean,\n    var anisotropyMode : Int,\n    var dmaAccuracy : Int,\n    var forceTripleBuffering : Boolean,\n',
              'NativeSettings phase6 fields')
          t = replace_once(t,
              '        pref.enableDescriptorCompatibility,\n        pref.useAsynchronousShaders,\n        pref.forceTripleBuffering,\n',
              '        pref.enableDescriptorCompatibility,\n        pref.useAsynchronousShaders,\n        pref.anisotropyMode,\n        pref.dmaAccuracy,\n        pref.forceTripleBuffering,\n',
              'NativeSettings phase6 constructor ints')
          # The old internal bool stays as the native policy knob. UI now exposes a clearer two-mode selector.
          t = replace_once(t,
              '        pref.forceMaxGpuClocks,\n        pref.freeGuestTextureMemory,\n        pref.disableShaderCache,\n',
              '        pref.forceMaxGpuClocks,\n        pref.vramUsageMode == 1,\n        pref.disableShaderCache,\n',
              'NativeSettings vram mapping')
          write(rel, t)
          
          rel = 'app/src/main/cpp/skyline/common/settings.h'
          t = read(rel)
          t = replace_once(t,
              '        Setting<bool> useAsynchronousShaders; //!< Allow safe skipping of larger draws while a graphics pipeline is still compiling\n        Setting<u32> executorSlotCountScale;',
              '        Setting<bool> useAsynchronousShaders; //!< Allow safe skipping of larger draws while a graphics pipeline is still compiling\n'
              '        Setting<u32> anisotropyMode; //!< 0 Auto, 1 guest/default, 2/4/8/16 force a minimum host anisotropy level\n'
              '        Setting<u32> dmaAccuracy; //!< 0 Default, 1 Unsafe/Fast, 2 Safe/Stall\n'
              '        Setting<u32> executorSlotCountScale;',
              'C++ phase6 settings')
          write(rel, t)
          
          rel = 'app/src/main/cpp/skyline/common/android_settings.h'
          t = read(rel)
          t = replace_once(t,
              '            enableDescriptorCompatibility = ktSettings.GetBool("enableDescriptorCompatibility");\n            useAsynchronousShaders = ktSettings.GetBool("useAsynchronousShaders");\n            executorSlotCountScale = ktSettings.GetInt<u32>("executorSlotCountScale");\n',
              '            enableDescriptorCompatibility = ktSettings.GetBool("enableDescriptorCompatibility");\n'
              '            useAsynchronousShaders = ktSettings.GetBool("useAsynchronousShaders");\n'
              '            anisotropyMode = ktSettings.GetInt<u32>("anisotropyMode");\n'
              '            dmaAccuracy = ktSettings.GetInt<u32>("dmaAccuracy");\n'
              '            executorSlotCountScale = ktSettings.GetInt<u32>("executorSlotCountScale");\n',
              'AndroidSettings phase6 ints')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 2) CommandExecutor exposes immutable-at-runtime policy values to engines.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/command_executor.h'
          t = read(rel)
          anchor = '''        bool UseAsynchronousShaders() const;\n\n'''
          insert = anchor + '''        /** @return Selected anisotropic filtering mode. */\n        u32 AnisotropyMode() const;\n\n        /** @return Selected DMA accuracy mode: 0 default, 1 unsafe/fast, 2 safe. */\n        u32 DmaAccuracy() const;\n\n'''
          t = replace_once(t, anchor, insert, 'CommandExecutor policy declarations')
          write(rel, t)
          
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp'
          t = read(rel)
          anchor = '''    bool CommandExecutor::UseAsynchronousShaders() const {\n        return *state.settings->useAsynchronousShaders;\n    }\n\n'''
          insert = anchor + '''    u32 CommandExecutor::AnisotropyMode() const {\n        return *state.settings->anisotropyMode;\n    }\n\n    u32 CommandExecutor::DmaAccuracy() const {\n        return *state.settings->dmaAccuracy;\n    }\n\n'''
          t = replace_once(t, anchor, insert, 'CommandExecutor policy implementations')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 3) Functional anisotropic filtering override at Vulkan sampler creation.
          #    Default preserves the guest sampler exactly. Forced modes never reduce it.
          #    Auto currently equals Default at 1X and becomes resolution-aware when the
          #    resolution-scaling backend is activated in the following CAM stage.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/common/samplers.cpp'
          t = read(rel)
          if '#include <algorithm>\n' not in t:
              t = replace_once(t, '#include <soc/gm20b/gmmu.h>\n', '#include <soc/gm20b/gmmu.h>\n#include <algorithm>\n', 'samplers algorithm include')
          old = '            auto maxAnisotropy{texSampler.MaxAnisotropy()};\n'
          new = '''            auto maxAnisotropy{texSampler.MaxAnisotropy()};\n            const u32 anisotropyMode{ctx.executor.AnisotropyMode()};\n            float forcedMinimum{};\n            switch (anisotropyMode) {\n                case 2: forcedMinimum = 2.0f; break;\n                case 4: forcedMinimum = 4.0f; break;\n                case 8: forcedMinimum = 8.0f; break;\n                case 16: forcedMinimum = 16.0f; break;\n                case 0: // Automatic: native at 1X; resolution-aware policy is enabled with CAM rescaling.\n                case 1: // Default: preserve the guest TSC value.\n                default: break;\n            }\n            if (forcedMinimum > 0.0f)\n                maxAnisotropy = std::min(16.0f, std::max(maxAnisotropy, forcedMinimum));\n\n            static std::atomic_flag esAnisotropyLogged = ATOMIC_FLAG_INIT;\n            if (!esAnisotropyLogged.test_and_set(std::memory_order_relaxed))\n                LOGI("[ES-GFX] anisotropyMode={} firstGuest={} firstHost={}", anisotropyMode, texSampler.MaxAnisotropy(), maxAnisotropy);\n'''
          t = replace_once(t, old, new, 'functional anisotropy override')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 4) Functional DMA policy adapted to Strato's engine architecture.
          #    Default = byte-for-byte legacy synchronization behavior.
          #    Unsafe/Fast = skips the legacy pre-submit on multiline CPU DMA conversions.
          #    Safe = synchronously drains prior GPU work before every DMA operation.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_dma.cpp'
          t = read(rel)
          old = '''    void MaxwellDma::DmaCopy() {\n        if (registers.launchDma->multiLineEnable) {\n'''
          new = '''    void MaxwellDma::DmaCopy() {\n        const u32 esDmaAccuracy{channelCtx.executor.DmaAccuracy()};\n        if (esDmaAccuracy == 2) {\n            // Safe: all previous GPU reads/writes must be visible before CPU/GMMU DMA touches memory.\n            channelCtx.executor.Submit(std::function<void()>{}, true);\n        }\n\n        static std::atomic<u64> esDmaPolicyOccurrence{};\n        const u64 esDmaOccurrence{esDmaPolicyOccurrence.fetch_add(1, std::memory_order_relaxed) + 1};\n        if (esDmaOccurrence <= 16 || (esDmaOccurrence % 2048) == 0)\n            LOGI("[ES-DMA] mode={} multiline={} occurrence #{}", esDmaAccuracy, registers.launchDma->multiLineEnable, esDmaOccurrence);\n\n        if (registers.launchDma->multiLineEnable) {\n'''
          t = replace_once(t, old, new, 'DMA policy prelude')
          if '#include <atomic>\n' not in t:
              t = replace_once(t, '#include <gpu/interconnect/command_executor.h>\n', '#include <atomic>\n#include <functional>\n#include <gpu/interconnect/command_executor.h>\n', 'DMA atomic/functional include')
          t = replace_once(t,
              '            channelCtx.executor.Submit();\n\n            if (registers.launchDma->srcMemoryLayout == registers.launchDma->dstMemoryLayout)',
              '            // Default keeps the historical pre-submit. Unsafe skips it; Safe already drained with wait=true above.\n'
              '            if (esDmaAccuracy == 0)\n'
              '                channelCtx.executor.Submit();\n\n'
              '            if (registers.launchDma->srcMemoryLayout == registers.launchDma->dstMemoryLayout)',
              'DMA multiline policy')
          write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 5) Material popup UI. IntegerListPreference already provides the requested
          #    single-choice dialog and closes immediately after selection.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/res/values/array.xml'
          t = read(rel)
          payload = '''    <string-array name="anisotropy_entries">\n        <item>@string/anisotropy_auto</item>\n        <item>@string/anisotropy_default</item>\n        <item>x2</item>\n        <item>x4</item>\n        <item>x8</item>\n        <item>x16</item>\n    </string-array>\n    <integer-array name="anisotropy_values">\n        <item>0</item><item>1</item><item>2</item><item>4</item><item>8</item><item>16</item>\n    </integer-array>\n    <string-array name="dma_accuracy_entries">\n        <item>@string/dma_accuracy_default</item>\n        <item>@string/dma_accuracy_unsafe</item>\n        <item>@string/dma_accuracy_safe</item>\n    </string-array>\n    <integer-array name="dma_accuracy_values">\n        <item>0</item><item>1</item><item>2</item>\n    </integer-array>\n    <string-array name="vram_usage_entries">\n        <item>@string/vram_conservative</item>\n        <item>@string/vram_aggressive</item>\n    </string-array>\n    <integer-array name="vram_usage_values">\n        <item>0</item><item>1</item>\n    </integer-array>\n'''
          if 'name="anisotropy_entries"' in t:
              raise SystemExit('Phase6 arrays already present')
          t = replace_once(t, '</resources>', payload + '</resources>', 'Phase6 arrays')
          write(rel, t)
          
          rel = 'app/src/main/res/xml/emulation_preferences.xml'
          t = read(rel)
          # Insert popup options after async shaders, before triple buffering.
          anchor = '''        <SwitchPreferenceCompat\n            android:defaultValue="false"\n            android:summary="@string/asynchronous_shaders_desc"\n            app:key="use_asynchronous_shaders"\n            app:title="@string/asynchronous_shaders" />\n'''
          insert = anchor + '''        <org.stratoemu.strato.preference.IntegerListPreference\n            android:defaultValue="1"\n            android:entries="@array/anisotropy_entries"\n            android:entryValues="@array/anisotropy_values"\n            android:summary="@string/anisotropic_filtering_desc"\n            app:key="anisotropy_mode"\n            app:title="@string/anisotropic_filtering"\n            app:useSimpleSummaryProvider="true" />\n        <org.stratoemu.strato.preference.IntegerListPreference\n            android:defaultValue="0"\n            android:entries="@array/dma_accuracy_entries"\n            android:entryValues="@array/dma_accuracy_values"\n            android:summary="@string/dma_accuracy_desc"\n            app:key="dma_accuracy"\n            app:title="@string/dma_accuracy"\n            app:useSimpleSummaryProvider="true" />\n        <org.stratoemu.strato.preference.IntegerListPreference\n            android:defaultValue="0"\n            android:entries="@array/vram_usage_entries"\n            android:entryValues="@array/vram_usage_values"\n            android:summary="@string/vram_usage_mode_desc"\n            app:key="vram_usage_mode"\n            app:title="@string/vram_usage_mode"\n            app:useSimpleSummaryProvider="true" />\n'''
          t = replace_once(t, anchor, insert, 'Phase6 popup preferences')
          # Remove the old raw internal free-memory switch from UI. Backend remains and is driven by vramUsageMode.
          old_switch = '''        <SwitchPreferenceCompat\n            android:defaultValue="false"\n            android:summary="@string/free_guest_texture_memory_desc"\n            app:key="free_guest_texture_memory"\n            app:title="@string/free_guest_texture_memory" />\n'''
          t = replace_once(t, old_switch, '', 'remove raw free guest memory switch')
          write(rel, t)
          
          strings_en = '''    <string name="anisotropic_filtering">Anisotropic Filtering</string>\n    <string name="anisotropic_filtering_desc">Controls texture sharpness at oblique viewing angles. Forced modes never reduce the game\'s own anisotropy.</string>\n    <string name="anisotropy_auto">Automatic</string>\n    <string name="anisotropy_default">Default</string>\n    <string name="dma_accuracy">DMA Accuracy</string>\n    <string name="dma_accuracy_desc">Controls synchronization before DMA memory operations. Safe can improve compatibility at a performance cost; Unsafe can be faster but may cause issues.</string>\n    <string name="dma_accuracy_default">Default</string>\n    <string name="dma_accuracy_unsafe">Unsafe (Fast)</string>\n    <string name="dma_accuracy_safe">Safe</string>\n    <string name="vram_usage_mode">VRAM Usage Mode</string>\n    <string name="vram_usage_mode_desc">Controls how aggressively Emerald Storm releases guest texture backing memory.</string>\n    <string name="vram_conservative">Conservative</string>\n    <string name="vram_aggressive">Aggressive</string>\n'''
          strings_pt = '''    <string name="anisotropic_filtering">Filtragem anisotrópica</string>\n    <string name="anisotropic_filtering_desc">Controla a nitidez das texturas vistas em ângulo. Os modos forçados nunca reduzem a anisotropia pedida pelo jogo.</string>\n    <string name="anisotropy_auto">Automático</string>\n    <string name="anisotropy_default">Padrão</string>\n    <string name="dma_accuracy">Precisão do DMA</string>\n    <string name="dma_accuracy_desc">Controla a sincronização antes das operações de DMA. Segura pode melhorar a compatibilidade com custo de desempenho; Insegura pode ser mais rápida, mas causar problemas.</string>\n    <string name="dma_accuracy_default">Padrão</string>\n    <string name="dma_accuracy_unsafe">Insegura (Rápida)</string>\n    <string name="dma_accuracy_safe">Segura</string>\n    <string name="vram_usage_mode">Modo de uso de VRAM</string>\n    <string name="vram_usage_mode_desc">Controla com que agressividade o Emerald Storm libera a memória de apoio das texturas do sistema emulado.</string>\n    <string name="vram_conservative">Conservador</string>\n    <string name="vram_aggressive">Agressivo</string>\n'''
          for rel, payload in [('app/src/main/res/values/strings.xml', strings_en), ('app/src/main/res/values-pt-rBR/strings.xml', strings_pt)]:
              t = read(rel)
              if 'name="anisotropic_filtering"' in t:
                  raise SystemExit(f'{rel}: Phase6 strings already present')
              t = replace_once(t, '</resources>', payload + '</resources>', f'{rel} Phase6 strings')
              write(rel, t)
          
          # ---------------------------------------------------------------------------
          # 6) Export report, version, provenance.
          # ---------------------------------------------------------------------------
          rel = 'app/src/main/java/org/stratoemu/strato/preference/ExportCustomSettingsPreference.kt'
          t = read(rel)
          t = replace_once(t,
              '            val gpuDescriptorCompatibility = emulationSettings.enableDescriptorCompatibility;\n            val gpuAsyncShaders = emulationSettings.useAsynchronousShaders;\n            val gpuTripleBuffering = emulationSettings.forceTripleBuffering;\n',
              '            val gpuDescriptorCompatibility = emulationSettings.enableDescriptorCompatibility;\n'
              '            val gpuAsyncShaders = emulationSettings.useAsynchronousShaders;\n'
              '            val gpuAnisotropyMode = emulationSettings.anisotropyMode;\n'
              '            val gpuDmaAccuracy = emulationSettings.dmaAccuracy;\n'
              '            val gpuVramUsageMode = emulationSettings.vramUsageMode;\n'
              '            val gpuTripleBuffering = emulationSettings.forceTripleBuffering;\n',
              'Export phase6 vars')
          t = replace_once(t,
              '            val gpuFreeGuestTextureMemory = emulationSettings.freeGuestTextureMemory;\n',
              '',
              'Export remove legacy raw VRAM var')
          t = replace_once(t,
              '                - Max clocks: $gpuForceMaxGpuClocks, free guest texture memory: $gpuFreeGuestTextureMemory\n',
              '                - Max clocks: $gpuForceMaxGpuClocks\n',
              'Export remove legacy raw VRAM line')
          t = replace_once(t,
              '                - Descriptor compatibility: $gpuDescriptorCompatibility, async shaders: $gpuAsyncShaders\n                - Executors: $gpuExecSlotCount slots (threshold: $gpuExecFlushThreshold)\n',
              '                - Descriptor compatibility: $gpuDescriptorCompatibility, async shaders: $gpuAsyncShaders\n'
              '                - Anisotropy mode: $gpuAnisotropyMode, DMA accuracy: $gpuDmaAccuracy, VRAM mode: $gpuVramUsageMode\n'
              '                - Executors: $gpuExecSlotCount slots (threshold: $gpuExecFlushThreshold)\n',
              'Export phase6 text')
          write(rel, t)
          
          rel = 'app/build.gradle'
          t = read(rel)
          t, n1 = re.subn(r'versionCode\s+47\b', 'versionCode 48', t, count=1)
          t, n2 = re.subn(r'versionName\s+"0\.2\.37-cam-phase5-qcom-descriptor-safety-async-shaders-ptbr"',
                           'versionName "0.2.38-cam-phase6-graphics-settings-foundation-ptbr"', t, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'v0.2.38 version patch failed: code={n1}, name={n2}')
          write(rel, t)
          
          Path('EMERALD_PHASE6_PROVENANCE.md').write_text('''# Emerald Storm v0.2.38 CAM Phase6 provenance\n\n- Base/runtime lineage: Emerald Storm v0.2.37 on Strato/Skyline (MPL-2.0).\n- Material popup UI uses Strato's existing IntegerListPreference dialog implementation.\n- Anisotropic filtering is implemented directly in Emerald's Vulkan sampler creation. Default preserves the guest sampler; x2/x4/x8/x16 establish a minimum without reducing guest-requested anisotropy. Automatic intentionally equals native behavior at 1X until the dedicated resolution-scaling backend is enabled.\n- DMA Accuracy is an original Emerald adaptation to Strato's Maxwell DMA architecture: Default preserves legacy submission behavior, Unsafe skips the legacy multiline pre-submit, Safe drains prior GPU work synchronously before DMA.\n- VRAM mode maps a user-facing Conservative/Aggressive selector onto Strato's existing freeGuestTextureMemory backend.\n- Resolution scaling is NOT exposed in this build. The pinned shader compiler contains a dormant RescalingPass, but Strato lacks the required texture-rescaling classification, per-draw rescaling data plumbing, render-target extent handling, viewport/scissor/blit scaling and presentation integration. Exposing scale choices before those pieces exist would be a placebo or break rendering.\n- No Eden GPL implementation was copied into Emerald. Eden behavior/documentation was used only as a reference for terminology and expected semantics.\n''')
          
          print('[ES-CI] CAM Phase6 applied: Material graphics popups + functional anisotropy + DMA accuracy + VRAM policy')
          print('[ES-CI] Resolution scaling deliberately remains hidden until the renderer backend is complete')
          PYPHASE6

      - name: Verify CAM Phase6 settings and Material popup UI
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('.')
          paths={k:root/v for k,v in {
              'prefs':'app/src/main/res/xml/emulation_preferences.xml',
              'arrays':'app/src/main/res/values/array.xml',
              'strings':'app/src/main/res/values/strings.xml',
              'pt':'app/src/main/res/values-pt-rBR/strings.xml',
              'emu':'app/src/main/java/org/stratoemu/strato/settings/EmulationSettings.kt',
              'native':'app/src/main/java/org/stratoemu/strato/settings/NativeSettings.kt',
              'settings':'app/src/main/cpp/skyline/common/settings.h',
              'android':'app/src/main/cpp/skyline/common/android_settings.h',
              'samplers':'app/src/main/cpp/skyline/gpu/interconnect/common/samplers.cpp',
              'dma':'app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_dma.cpp',
              'gradle':'app/build.gradle',
          }.items()}
          for p in paths.values():
              if not p.exists(): raise SystemExit('missing '+str(p))
          for key in ['prefs','arrays','strings','pt']:
              ET.parse(paths[key])

          prefs=paths['prefs'].read_text()
          for key in ['anisotropy_mode','dma_accuracy','vram_usage_mode']:
              if prefs.count(f'app:key="{key}"') != 1: raise SystemExit('popup missing/duplicated: '+key)
          if 'app:key="free_guest_texture_memory"' in prefs: raise SystemExit('legacy raw VRAM switch still visible')
          if 'resolution_scale' in prefs: raise SystemExit('resolution UI exposed before full backend')

          emu=paths['emu'].read_text(); native=paths['native'].read_text()
          for token in ['var anisotropyMode by sharedPreferences(context, 1','var dmaAccuracy by sharedPreferences(context, 0','var vramUsageMode by sharedPreferences(context, 0']:
              if token not in emu: raise SystemExit('persistent setting missing: '+token)
          for token in ['var anisotropyMode : Int','var dmaAccuracy : Int','pref.vramUsageMode == 1']:
              if token not in native: raise SystemExit('NativeSettings plumbing missing: '+token)

          sampler=paths['samplers'].read_text(); dma=paths['dma'].read_text()
          for token in ['ctx.executor.AnisotropyMode()','forcedMinimum = 16.0f','[ES-GFX] anisotropyMode=']:
              if token not in sampler: raise SystemExit('anisotropy backend missing: '+token)
          for token in ['channelCtx.executor.DmaAccuracy()','Submit(std::function<void()>{}, true)','esDmaAccuracy == 0','[ES-DMA] mode=']:
              if token not in dma: raise SystemExit('DMA backend missing: '+token)

          gradle=paths['gradle'].read_text()
          if 'versionCode 48' not in gradle or '0.2.38-cam-phase6-graphics-settings-foundation-ptbr' not in gradle:
              raise SystemExit('v0.2.38 identity invalid')
          print('[ES-CI] Phase6 settings/UI/native/backend verification passed')
          PY

      - name: CAM Phase6 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.')
          fermi=(r/'app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp').read_text()
          pipeline=(r/'app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc').read_text()
          shader=(r/'app/src/main/cpp/skyline/gpu/shader_manager.cpp').read_text()
          prefs=(r/'app/src/main/res/xml/emulation_preferences.xml').read_text()
          if 'const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};' not in fermi: raise SystemExit('Storm4 Fermi2D FlipY missing')
          if 'size_t sizeOverride{std::min<size_t>(cbufSizes[idx], view.size)};' not in pipeline: raise SystemExit('correct CBuffer min clamp missing')
          if 'support_descriptor_aliasing = descriptorAliasingSupported' not in shader: raise SystemExit('Phase5 descriptor safety missing')
          if 'use_asynchronous_shaders' not in prefs: raise SystemExit('Phase5 async option missing')
          if 'ResolveSampledFeedback(texture)' in pipeline: raise SystemExit('rejected feedback snapshot routing re-enabled')
          print('[ES-CI] Phase6 regression audit passed')
          PY

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          cp EMERALD_PHASE5_PROVENANCE.md ../EMERALD_PHASE5_PROVENANCE.md
          cp EMERALD_PHASE6_PROVENANCE.md ../EMERALD_PHASE6_PROVENANCE.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
