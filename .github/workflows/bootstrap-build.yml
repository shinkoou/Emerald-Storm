name: Emerald Storm v0.2.36 CAM Phase4 Eden Coherency + Feedback Snapshot + Full PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase4-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.36-CAM-Phase4-Eden-Coherency-Feedback-Snapshot-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.36 CAM Phase4 + Full PT-BR
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.35 source exactly
        run: |
          set -euo pipefail
          git show "${V235_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v235.yml
          test -s /tmp/emerald-v235.yml
          python3 - <<'PY'
          from __future__ import annotations
          import os, re, subprocess
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          WORKFLOW = Path('/tmp/emerald-v235.yml')
          SOURCE_DIR = os.environ['ES_SOURCE_DIR']

          lines = WORKFLOW.read_text().splitlines()
          starts = []
          for i, line in enumerate(lines):
              m = re.match(r'^      - name:\s*(.+?)\s*$', line)
              if m:
                  starts.append((i, m.group(1).strip('"\'')))

          run_steps = []
          for pos, (start, name) in enumerate(starts):
              end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
              block = lines[start:end]
              if name == 'Build Emerald Storm APK':
                  break
              workdir = None
              run_at = None
              for j, line in enumerate(block):
                  m = re.match(r'^        working-directory:\s*(.+?)\s*$', line)
                  if m:
                      workdir = m.group(1).strip('"\'')
                  if re.match(r'^        run:\s*\|\s*$', line):
                      run_at = j
                      break
              if run_at is None:
                  continue
              script_lines = []
              for line in block[run_at + 1:]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif not line.strip():
                      script_lines.append('')
                  else:
                      break
              run_steps.append((name, workdir, '\n'.join(script_lines) + '\n'))

          if not run_steps or run_steps[0][0] != 'Extract Emerald Storm source':
              raise SystemExit('v0.2.35 replay parser did not find expected first run step')
          if run_steps[-1][0] != 'CAM Phase3 Recovery isolation audit':
              raise SystemExit('v0.2.35 replay parser did not stop at expected final pre-build step')

          def resolve_workdir(raw):
              if not raw:
                  return ROOT
              expr_open = '$' + '{{'
              source_expr = expr_open + ' env.ES_SOURCE_DIR }}'
              raw = raw.replace(source_expr, SOURCE_DIR)
              if expr_open in raw:
                  raise SystemExit('Unsupported GitHub expression in replay workdir: ' + raw)
              return (ROOT / raw).resolve()

          for number, (name, workdir, script) in enumerate(run_steps, 1):
              cwd = resolve_workdir(workdir)
              print(f'\n[ES-REPLAY] {number:02d}/{len(run_steps)} {name}', flush=True)
              subprocess.run(['bash', '-e', '-u', '-o', 'pipefail', '-c', script],
                             cwd=cwd, env=os.environ.copy(), check=True)

          gradle = ROOT / SOURCE_DIR / 'app/build.gradle'
          body = gradle.read_text()
          if 'versionCode 45' not in body or '0.2.35-cam-phase3-recovery-feedback-loop-audit-ptbr' not in body:
              raise SystemExit('v0.2.35 reconstruction version verification failed')
          print('[ES-REPLAY] v0.2.35 source reconstructed exactly from proven Action #71 workflow')
          PY

