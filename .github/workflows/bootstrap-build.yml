                  const u32 baseLayer{view ? view->range.baseArrayLayer : 0};
                  const u32 layerCount{view ? view->range.layerCount : 0};

                  if (newestId != record.id && newestTick > record.modificationTick) {
                      const u64 staleOccurrence{++staleSampledEvents};
                      if (newestWriter == Writer::Gpu) {
                          if (EsTmShouldLog(staleOccurrence, 512, 1024)) {
                              LOGI("[ES-TM2] STALE-GPU-ALIAS sampledTex=#{} sampledTick={} newestAlias=#{} newestTick={} aliases={} dirty={} iova=0x{:X} mip={}/{} layer={}/{} staleOccurrence #{}",
                                   record.id, record.modificationTick, newestId, newestTick,
                                   record.aliases.size(), texture.GetDebugDirtyState(), record.lastIova,
                                   baseMip, levelCount, baseLayer, layerCount, staleOccurrence);
                          }
                      } else if (EsTmShouldLog(staleOccurrence, 64, 2048)) {
                          LOGI("[ES-TM2] NON-GPU-DIVERGENCE sampledTex=#{} sampledTick={} newestAlias=#{} newestTick={} newestWriter={} aliases={} dirty={} occurrence #{}",
                               record.id, record.modificationTick, newestId, newestTick, WriterName(newestWriter),
                               record.aliases.size(), texture.GetDebugDirtyState(), staleOccurrence);
                      }
                  } else if (!record.aliases.empty() && EsTmShouldLog(occurrence, 128, 4096)) {
                      LOGI("[ES-TM2] ALIAS-SAMPLED-CURRENT tex=#{} tick={} writer={} aliases={} dirty={} iova=0x{:X} occurrence #{}",
                           record.id, record.modificationTick, WriterName(record.lastWriter),
                           record.aliases.size(), texture.GetDebugDirtyState(), record.lastIova, occurrence);
                  }
              }

          '''
          m = replace_function(m, sample_start, sample_end, sample_impl)
          manager.write_text(m)

