          pm = Path('app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/pipeline_manager.cpp').read_text()
          pipeline = Path('app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc').read_text()
