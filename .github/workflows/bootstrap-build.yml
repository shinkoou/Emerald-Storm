            EMERALD_UI_PHASEH_PROVENANCE.md
            EMERALD_PHASE19_PROVENANCE.md
            EMERALD_UI_PHASEI_PROVENANCE.md
            EMERALD_SHADER_COMPILER_REVISION.txt
            EMERALD_RECOVERY_R1_PROVENANCE.md
            EMERALD_STRUCTURAL_AUDIT_00.md
          )
          for rel in "${required[@]}"; do
            test -f "$rel" || { echo "[ES-RECOVERY-R1] snapshot missing $rel"; exit 1; }
            mkdir -p "$SNAP_DIR/$(dirname "$rel")"
            cp "$rel" "$SNAP_DIR/$rel"
          done
          for optional in app/src/main/res/values-pt-rBR/strings.xml app/src/main/res/values-pt-rBR/array.xml; do
            if test -f "$optional"; then
              mkdir -p "$SNAP_DIR/$(dirname "$optional")"
              cp "$optional" "$SNAP_DIR/$optional"
            fi
          done
          tar -C "$SNAP_DIR" -czf "$OUT" .
          sha256sum "$OUT" > "$OUT.sha256"
          echo "[ES-RECOVERY-R1] source snapshot ready: $OUT"

      - name: Upload Recovery R1 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Source-Action${{ github.run_number }}
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Source-Action${{ github.run_number }}.tar.gz
            EmeraldStorm-${{ env.ES_VERSION }}-Source-Action${{ github.run_number }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

