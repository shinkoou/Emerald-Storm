          if '[ES-CBUF] REQUIRED-RANGE-TRUNCATED' in cbuf:
              raise SystemExit('Rejected Phase2.3 Refresh experiment leaked into CAM Phase2.5')
          if '[ES-F2D2]' in fermi or '[ES-F2D] SINGLE-DERIVATIVE-FIX' in fermi:
              raise SystemExit('Rejected Fermi experiments leaked into CAM Phase2.5')
          if 'const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};' not in fermi:
              raise SystemExit('Confirmed Fermi2D FlipY lineage missing')
          m = re.search(r'(?m)^\s*def locales = \[(.*?)\]\s*$', gradle)
          if not m or re.findall(r'"([^"]+)"', m.group(1)).count('pt-BR') != 1:
              raise SystemExit('PT-BR locale missing')
          print('[ES-CI] CAM Phase2.5 isolation audit passed')
          print('[ES-CI] Only new graphics behavior: propagate shader CBuffer used-size metadata')
          PY

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"

      - name: Upload APK (attempt 1)
        id: upload_apk_primary
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload APK (retry after artifact-service failure)
        if: steps.upload_apk_primary.outcome == 'failure'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64-Retry1
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
