              '            })\n'
              '\n'
              '            BOOST_PP_REPEAT(16, LOAD_CONSTANT_BUFFER_CALLBACKS, 0)\n'
              '            #undef LOAD_CONSTANT_BUFFER_CALLBACKS\n'
          )
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
