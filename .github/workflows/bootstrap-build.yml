# Emerald Storm v0.2.41 Phase9 FIX3 Storm4 Attachment Feedback Loop Fix
name: Emerald Storm v0.2.41 FIX3 CAM Phase9 Storm4 Attachment Feedback Loop Fix + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase9-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.41-FIX3-CAM-Phase9-Storm4-Attachment-Feedback-Loop-Fix-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
  V239_COMMIT: ca15dc208beb65a61ecd1e44eb7148992797
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.41 FIX3 CAM Phase9 Storm4 Feedback Loop
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.40 FIX4 Phase8 source exactly
        run: |
          set -euo pipefail
          git show "${V240_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v240.yml
          test -s /tmp/emerald-v240.yml
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<replay>', 'exec'))"

      - name: FIX3 verify Phase8 semantic anchors before patching
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<preflight>', 'exec'))"

      - name: Apply CAM Phase9 FIX3 Storm4 attachment feedback loop correction
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<patch>', 'exec'))"

      - name: Verify CAM Phase9 FIX3 feedback-loop correction
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<verify>', 'exec'))"

      - name: CAM Phase9 FIX3 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<audit>', 'exec'))"

      - name: Phase9 FIX3 prove generated correction before compilation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          echo "[ES-PHASE9-FIX3] capability:"
          grep -nF 'supportsAttachmentFeedbackLoopLayout' app/src/main/cpp/skyline/gpu/trait_manager.h
          echo "[ES-PHASE9-FIX3] descriptor layout:"
          grep -nF 'ResolveSampledImageLayout(texture)' app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
          echo "[ES-PHASE9-FIX3] Maxwell3D full descriptor gate:"
          grep -nF 'if (!esForceFullDescriptors &&' app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/maxwell_3d.cpp
          echo "[ES-PHASE9-FIX3] render-pass feedback dependency:"
          grep -nF 'VK_DEPENDENCY_FEEDBACK_LOOP_BIT_EXT' app/src/main/cpp/skyline/gpu/interconnect/command_nodes.cpp
          echo "[ES-PHASE9-FIX3] pipeline flags:"
          grep -nF 'VK_PIPELINE_CREATE_COLOR_ATTACHMENT_FEEDBACK_LOOP_BIT_EXT' app/src/main/cpp/skyline/gpu/graphics_pipeline_assembler.cpp
          echo "[ES-PHASE9-FIX3] correction proof passed"

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          cp EMERALD_PHASE5_PROVENANCE.md ../EMERALD_PHASE5_PROVENANCE.md
          cp EMERALD_PHASE6_PROVENANCE.md ../EMERALD_PHASE6_PROVENANCE.md
          cp EMERALD_PHASE7_PROVENANCE.md ../EMERALD_PHASE7_PROVENANCE.md
          cp EMERALD_PHASE8_PROVENANCE.md ../EMERALD_PHASE8_PROVENANCE.md
          cp EMERALD_PHASE9_PROVENANCE.md ../EMERALD_PHASE9_PROVENANCE.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
            EMERALD_PHASE8_PROVENANCE.md
            EMERALD_PHASE9_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
