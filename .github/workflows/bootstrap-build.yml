          if pm.count('stageDescInfo.constantBufferUsedSizes = stage.info.constant_buffer_used_sizes;') != 1:
              raise SystemExit('CAM Phase2.5 metadata propagation count invalid')
          if pm.count('[ES-CBUF3] PIPELINE-SIZE-PROPAGATION') != 1:
