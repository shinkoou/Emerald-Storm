# Emerald Storm v0.2.45 Structural 01 — Phase14 Subresource Identity Foundation
name: Emerald Storm v0.2.45 Structural 01 Phase14 Subresource Identity + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-struct01-phase14-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.45-Struct01-Phase14-Subresource-Identity-UI-D-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V243_PHASE12_COMMIT: a5a5ab6d7c0f087de0449f48d6b1ad1b86347ab7
  # Historical pins required by the Action105 replay chain.
  V242_PHASE11_COMMIT: 3bbd5cab85ef11ee8327fad537e331493da55a55
  V241_PHASE10_COMMIT: bb308016f64b73f05d4d263c32ce5b8ade7878f9
  V241_FIX5_COMMIT: d99d5e7e073c7c6aa61559f703625e6b5e353e3b
  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
  V239_COMMIT: ca15dc208beb65a61a163ecd1e44eb7148992797
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.45 Structural 01 on Phase14
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct exact proven Phase12 FIX3 Action105 source
        run: |
          set -euo pipefail
          echo "[ES-PHASE13-FIX2] validating pinned provenance chain"
          for commit in \
            "$V243_PHASE12_COMMIT" \
            "$V242_PHASE11_COMMIT" \
            "$V241_PHASE10_COMMIT" \
            "$V241_FIX5_COMMIT" \
            "$V240_COMMIT" \
            "$V239_COMMIT" \
            "$V238_COMMIT" \
            "$V237_COMMIT" \
            "$V235_COMMIT"; do
            git cat-file -e "${commit}^{commit}"
            echo "[ES-PHASE13-FIX2] OK $commit"
          done

          # Action105 materialized these before entering the nested replay payload.
          git show "${V243_PHASE12_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v243-phase12.yml
          git show "${V242_PHASE11_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v242-phase11.yml
          test -s /tmp/emerald-v243-phase12.yml
          test -s /tmp/emerald-v242-phase11.yml
          echo "[ES-PHASE13-FIX2] Action105 replay prerequisites materialized"
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-replay>', 'exec'))"

      - name: Preflight Phase13 source anchors + existing EmeraldTextureManager hooks
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/cpp/skyline/gpu/texture_manager.h')
          t = p.read_text()
          print('[ES-PHASE13-FIX4] texture_manager.h public-count =', t.count('      public:\n'))
          print('[ES-PHASE13-FIX4] TextureManager ctor-count =', t.count('        TextureManager(GPU &gpu);\n'))
          start = t.find('    class TextureManager')
          if start < 0:
              raise SystemExit('[ES-PHASE13-FIX4] class TextureManager not found')
          end = t.find('\n    };', start)
          if end < 0:
              end = min(len(t), start + 6000)
          print('[ES-PHASE13-FIX4] TextureManager declaration excerpt:')
          print(t[start:end + 7])

          # FIX4: prove the pinned Action105 tree already contains the EmeraldTextureManager
          # write-trap hooks that Phase13 must extend, not replace.
          texture_cpp = Path('app/src/main/cpp/skyline/gpu/texture/texture.cpp').read_text()
          setup_start = texture_cpp.find('    void Texture::SetupGuestMappings()')
          sync_start = texture_cpp.find('    std::shared_ptr<memory::StagingBuffer> Texture::SynchronizeHostImpl()', setup_start)
          if setup_start < 0 or sync_start < 0:
              raise SystemExit('[ES-PHASE13-FIX4] SetupGuestMappings block not found')
          setup = texture_cpp[setup_start:sync_start]
          hooks = [
              'WriteTrap-fast',
              'WriteTrap-fast-readback-hack',
              'WriteTrap-after-readback',
          ]
          for hook in hooks:
              count = setup.count(f'MarkCpuModified(*texture, "{hook}")')
              print(f'[ES-PHASE13-FIX4] existing ETM {hook} count =', count)
              if count != 1:
                  raise SystemExit(f'[ES-PHASE13-FIX4] expected one existing ETM {hook} hook, got {count}')
          print('[ES-PHASE13-FIX4] existing EmeraldTextureManager CPU-write hooks verified')
          PY

      - name: Apply Phase13 Emerald Texture Renderer Bridge and UI Phase C
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-patch>', 'exec'))"

      - name: Verify Phase13 structural bridge
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-verify>', 'exec'))"

      - name: Phase13 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase13-audit>', 'exec'))"

      - name: Prove generated Phase13 code before compilation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          grep -nE 'versionCode 54|0.2.44-cam-phase13' app/build.gradle
          grep -nF 'coherenceInvalidationEpoch' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'BeginGuestCacheInvalidation' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF 'NotifyCpuWrite' app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -nF 'ReconcileCoherence(ctx.gpu.texture.CurrentInvalidationEpoch())' app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
          grep -nF '[ES-TEXCOH-REFRESH]' app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -nF 'strong-cpu-sync' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF '[ES-MAXWELL-TEXCACHE-INVALIDATE]' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF '#000000' app/src/main/res/values-night/colors_emerald_ui.xml
          grep -nF '@color/emerald_ui_background' app/src/main/res/layout/main_activity.xml
          grep -nF '@color/emerald_ui_outline' app/src/main/res/layout/app_item_grid.xml
          echo '[ES-PHASE13] generated proof passed'

      - name: Apply Phase14 Emerald Texture Ecosystem Foundation I and UI Phase D
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase14-ecosystem-ui-d>', 'exec'))"

      - name: Verify Phase14 texture ecosystem and UI D
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          grep -nE 'versionCode 55|0.2.45-cam-phase14-texture-ecosystem-ui-d-ptbr' app/build.gradle
          grep -nF 'storageOwnerId' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'CpuInvalidationBatch' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'EmeraldTextureManager::MarkGpuModified' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF '[ES-ECOSYSTEM] GPU-STORAGE-OWNER' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF '[ES-ECOSYSTEM] CPU-INVALIDATION' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF '[ES-ECOSYSTEM] OWNER-INCOMPATIBLE' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF 'GetBackingGeneration' app/src/main/cpp/skyline/gpu/texture/texture.h
          grep -nF '[ES-ECOSYSTEM] BACKING-SWAP' app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -nF 'emerald.MarkGpuModified(*this, "MarkGpuDirty")' app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -nF 'invalidatedRecords' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF 'ReconcileCoherence(ctx.gpu.texture.CurrentInvalidationEpoch())' app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
          grep -nF 'android:maxLines="2"' app/src/main/res/layout/app_item_grid.xml
          grep -nF '@color/emerald_ui_accent' app/src/main/res/layout/main_activity.xml
          grep -nF 'Emerald Storm UI Phase D' app/src/main/java/org/stratoemu/strato/settings/EmeraldSettingsStyle.kt
          test -f EMERALD_PHASE14_PROVENANCE.md
          test -f EMERALD_UI_PHASED_PROVENANCE.md
          ! grep -Rni --include='*.xml' --include='*.kt' --include='*.md' 'JOGUE ALÉM' app EMERALD_UI_PHASED_PROVENANCE.md
          echo '[ES-PHASE14] structural verification passed'

      - name: Phase14 ecosystem regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          tmh = Path('app/src/main/cpp/skyline/gpu/texture_manager.h').read_text()
          tmc = Path('app/src/main/cpp/skyline/gpu/texture_manager.cpp').read_text()
          th = Path('app/src/main/cpp/skyline/gpu/texture/texture.h').read_text()
          tc = Path('app/src/main/cpp/skyline/gpu/texture/texture.cpp').read_text()
          cmd = Path('app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp').read_text()
          fermi = Path('app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp').read_text()
          mx = Path('app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp').read_text()

          if 'coherenceModificationTick' in tmh or 'coherenceInvalidationEpoch' in tmh:
              raise SystemExit('[ES-PHASE14] parallel Phase13 timelines still present')
          if tmc.count('EmeraldTextureManager::MarkGpuModified') != 1:
              raise SystemExit('[ES-PHASE14] MarkGpuModified implementation count invalid')
          if tmc.count('EmeraldTextureManager::NextModificationTick') != 1:
              raise SystemExit('[ES-PHASE14] NextModificationTick implementation count invalid')
          if 'coherenceLastModificationTick.store(gpu.texture.NextModificationTick()' in tc:
              raise SystemExit('[ES-PHASE14] duplicate Texture timeline survived')
          if 'ResolveNewestGpuAlias(*texturePtr)' not in cmd or 'CommitAliasSynchronization(*texturePtr, *aliasSource)' not in cmd:
              raise SystemExit('[ES-PHASE14] existing PrepareImage/SynchronizeAliases bridge lost')
          if 'const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};' not in fermi:
              raise SystemExit('[ES-PHASE14] proven Fermi2D FlipY lineage missing')
          if 'strong-cpu-sync' not in mx or 'AddFullBarrier()' not in mx:
              raise SystemExit('[ES-PHASE14] Phase13 adaptive Maxwell invalidation lost')
          if 'SynchronizeGuest(true, true)' not in tc:
              raise SystemExit('[ES-PHASE14] original safe CPU write/readback path missing')
          # Do not resurrect the rejected retire-all-alias experiment.
          if 'newest->SynchronizeGuest(false, false)' in tmc or 'hostMapping->texture->replaced = true; // Phase14' in tmc:
              raise SystemExit('[ES-PHASE14] unsafe retire/writeback alias experiment detected')

          for rel in ['app/src/main/res/layout/main_activity.xml', 'app/src/main/res/layout/app_item_grid.xml',
                      'app/src/main/res/values/colors_emerald_ui.xml', 'app/src/main/res/values-night/colors_emerald_ui.xml']:
              ET.parse(rel)
          grid = Path('app/src/main/res/layout/app_item_grid.xml').read_text()
          for view_id in ['item_click_layout', 'item_card', 'icon', 'text_title', 'text_version', 'text_author']:
              if grid.count(f'@+id/{view_id}') != 1:
                  raise SystemExit(f'[ES-PHASE14] grid id {view_id} count invalid')
          if 'JOGUE ALÉM' in grid.upper():
              raise SystemExit('[ES-PHASE14] unwanted slogan leaked into UI')
          print('[ES-PHASE14] regression safety audit passed')
          PY

      - name: Capture Phase14 active-path fingerprints
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          cpp = Path('app/src/main/cpp/skyline/gpu/texture_manager.cpp').read_text()
          names = [
              'EmeraldTextureManager::MarkCpuModified',
              'EmeraldTextureManager::MarkGpuModified',
              'EmeraldTextureManager::ObserveRenderTarget',
              'EmeraldTextureManager::ObserveSampled',
              'EmeraldTextureManager::ResolveNewestGpuAlias',
              'EmeraldTextureManager::CommitAliasSynchronization',
              'TextureManager::FindOrCreate',
          ]
          def body(name):
              start = cpp.find(name)
              if start < 0:
                  raise SystemExit(f'[ES-STRUCT01] missing function {name}')
              brace = cpp.find('{', start)
              depth = 0
              for i in range(brace, len(cpp)):
                  if cpp[i] == '{': depth += 1
                  elif cpp[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return cpp[start:i+1]
              raise SystemExit(f'[ES-STRUCT01] unterminated function {name}')
          data = {name: hashlib.sha256(body(name).encode()).hexdigest() for name in names}
          Path('/tmp/emerald-struct01-active.json').write_text(json.dumps(data, indent=2, sort_keys=True))
          print('[ES-STRUCT01] captured Phase14 active-path fingerprints')
          PY
          sha256sum \
            app/src/main/cpp/skyline/gpu/texture/texture.cpp \
            app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp \
            app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp \
            app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp \
            app/src/main/res/layout/main_activity.xml \
            app/src/main/res/layout/app_item_grid.xml \
            > /tmp/emerald-struct01-untouched.sha256

      - name: Apply Structural Audit 01 — Phase14 Subresource Identity
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<struct01-phase14>', 'exec'))"

      - name: Verify Structural Audit 01 behavior neutrality
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          grep -nE 'versionCode 62|0.2.45-struct01-phase14-subresource-identity-ptbr' app/build.gradle
          grep -nF 'guestOffset' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'struct SubresourceBase' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'struct MipStorageLayout' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'struct AliasCopy' app/src/main/cpp/skyline/gpu/texture_manager.h
          grep -nF 'TryResolveSubresourceLocked' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF 'BuildPassiveAliasCopiesLocked' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF 'ResolveGuestSubresource' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -nF 'subresourceCandidates=' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          test -f EMERALD_STRUCTURAL_AUDIT_01.md

          # No renderer/UI file outside TextureManager may change in this experiment.
          sha256sum -c /tmp/emerald-struct01-untouched.sha256

          # Prove the Phase14 hot paths themselves are byte-identical after the structural patch.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          expected = json.loads(Path('/tmp/emerald-struct01-active.json').read_text())
          cpp = Path('app/src/main/cpp/skyline/gpu/texture_manager.cpp').read_text()
          def body(name):
              start = cpp.find(name)
              if start < 0:
                  raise SystemExit(f'[ES-STRUCT01] missing function {name} after patch')
              brace = cpp.find('{', start)
              depth = 0
              for i in range(brace, len(cpp)):
                  if cpp[i] == '{': depth += 1
                  elif cpp[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return cpp[start:i+1]
              raise SystemExit(f'[ES-STRUCT01] unterminated function {name}')
          for name, old_hash in expected.items():
              new_hash = hashlib.sha256(body(name).encode()).hexdigest()
              if new_hash != old_hash:
                  raise SystemExit(f'[ES-STRUCT01] ACTIVE PATH CHANGED: {name}')
          print('[ES-STRUCT01] Phase14 active rendering paths remain byte-identical')
          PY

          # Structural model is passive: no executable candidate is allowed yet.
          python3 - <<'PY'
          from pathlib import Path
          h = Path('app/src/main/cpp/skyline/gpu/texture_manager.h').read_text()
          c = Path('app/src/main/cpp/skyline/gpu/texture_manager.cpp').read_text()
          if '.validated = true' in c:
              raise SystemExit('[ES-STRUCT01] alias candidate became executable')
          if 'bool validated{};' not in h:
              raise SystemExit('[ES-STRUCT01] validated=false safety bit missing')
          if 'record.imageType == vk::ImageType::e3D' not in c:
              raise SystemExit('[ES-STRUCT01] 3D conservative guard missing')
          print('[ES-STRUCT01] passive-only safety audit passed')
          PY

      - name: Prepare Structural Audit 01 source snapshot
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          SNAP_DIR="../struct01-source-snapshot"
          OUT="../EmeraldStorm-${ES_VERSION}-Source-Action${GITHUB_RUN_NUMBER}.tar.gz"
          rm -rf "$SNAP_DIR"
          mkdir -p "$SNAP_DIR"
          required=(
            app/build.gradle
            app/src/main/cpp/skyline/gpu/texture_manager.h
            app/src/main/cpp/skyline/gpu/texture_manager.cpp
            app/src/main/cpp/skyline/gpu/texture/texture.h
            app/src/main/cpp/skyline/gpu/texture/texture.cpp
            app/src/main/cpp/skyline/gpu/interconnect/command_executor.h
            app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
            app/src/main/cpp/skyline/gpu/interconnect/common/textures.h
            app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp
            app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
            app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp
            app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
            app/src/main/res/layout/main_activity.xml
            app/src/main/res/layout/app_item_grid.xml
            app/src/main/java/org/stratoemu/strato/settings/EmeraldSettingsStyle.kt
            EMERALD_PHASE14_PROVENANCE.md
            EMERALD_UI_PHASED_PROVENANCE.md
            EMERALD_STRUCTURAL_AUDIT_01.md
          )
          for rel in "${required[@]}"; do
            test -f "$rel" || { echo "[ES-STRUCT01] snapshot missing $rel"; exit 1; }
            mkdir -p "$SNAP_DIR/$(dirname "$rel")"
            cp "$rel" "$SNAP_DIR/$rel"
          done
          tar -C "$SNAP_DIR" -czf "$OUT" .
          sha256sum "$OUT" > "$OUT.sha256"
          echo "[ES-STRUCT01] source snapshot ready: $OUT"

      - name: Upload Structural Audit 01 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Source-Action${{ github.run_number }}
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Source-Action${{ github.run_number }}.tar.gz
            EmeraldStorm-${{ env.ES_VERSION }}-Source-Action${{ github.run_number }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          for provenance in \
            EMERALD_PHASE5_PROVENANCE.md \
            EMERALD_PHASE6_PROVENANCE.md \
            EMERALD_PHASE7_PROVENANCE.md \
            EMERALD_PHASE8_PROVENANCE.md \
            EMERALD_PHASE9_PROVENANCE.md \
            EMERALD_PHASE10_PROVENANCE.md \
            EMERALD_PHASE11_PROVENANCE.md \
            EMERALD_PHASE12_PROVENANCE.md \
            EMERALD_PHASE13_PROVENANCE.md \
            EMERALD_UI_PHASEA_PROVENANCE.md \
            EMERALD_UI_PHASEB_PROVENANCE.md \
            EMERALD_UI_PHASEC_PROVENANCE.md \
            EMERALD_PHASE14_PROVENANCE.md \
            EMERALD_UI_PHASED_PROVENANCE.md \
            EMERALD_STRUCTURAL_AUDIT_01.md; do
            test -f "$provenance"
            cp "$provenance" "../$provenance"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
            EMERALD_PHASE8_PROVENANCE.md
            EMERALD_PHASE9_PROVENANCE.md
            EMERALD_PHASE10_PROVENANCE.md
            EMERALD_PHASE11_PROVENANCE.md
            EMERALD_PHASE12_PROVENANCE.md
            EMERALD_PHASE13_PROVENANCE.md
            EMERALD_UI_PHASEA_PROVENANCE.md
            EMERALD_UI_PHASEB_PROVENANCE.md
            EMERALD_UI_PHASEC_PROVENANCE.md
            EMERALD_PHASE14_PROVENANCE.md
            EMERALD_UI_PHASED_PROVENANCE.md
            EMERALD_STRUCTURAL_AUDIT_01.md
          if-no-files-found: error
          retention-days: 30
