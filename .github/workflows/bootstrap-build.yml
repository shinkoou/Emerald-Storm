# CORRETO: Emerald Storm v0.2.40 Phase8 Storm4 BlackBox Forensics
name: Emerald Storm v0.2.40 CAM Phase8 Storm4 BlackBox Forensics + Full Diagnostics + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase8-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.40-CAM-Phase8-Storm4-BlackBox-Forensics-Full-Diagnostics-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V239_COMMIT: ca15dc208beb65a61a163ecd1e44eb7148992797

jobs:
  android:
    name: Build Emerald Storm v0.2.40 CAM Phase8 Storm4 BlackBox
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.39 Action82 source exactly
        run: |
          set -euo pipefail
          git show "${V239_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v239.yml
          test -s /tmp/emerald-v239.yml
          python3 - <<'PYREPLAY'
          from __future__ import annotations
          import os, re, subprocess
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          WORKFLOW = Path('/tmp/emerald-v239.yml')
          SOURCE_DIR = os.environ['ES_SOURCE_DIR']
          lines = WORKFLOW.read_text().splitlines()
          starts = []
          for i, line in enumerate(lines):
              m = re.match(r'^      - name:\s*(.+?)\s*$', line)
              if m:
                  starts.append((i, m.group(1).strip('"\'')))

          run_steps = []
          for pos, (start, name) in enumerate(starts):
              end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
              block = lines[start:end]
              if name == 'Build Emerald Storm APK':
                  break
              workdir = None
              run_at = None
              for j, line in enumerate(block):
                  m = re.match(r'^        working-directory:\s*(.+?)\s*$', line)
                  if m:
                      workdir = m.group(1).strip('"\'')
                  if re.match(r'^        run:\s*\|\s*$', line):
                      run_at = j
                      break
              if run_at is None:
                  continue
              script_lines = []
              for line in block[run_at + 1:]:
                  if line.startswith('          '):
                      script_lines.append(line[10:])
                  elif not line.strip():
                      script_lines.append('')
                  else:
                      break
              run_steps.append((name, workdir, '\n'.join(script_lines) + '\n'))

          if not run_steps or run_steps[0][0] != 'Reconstruct proven v0.2.38 source exactly':
              raise SystemExit('v0.2.39 replay parser did not find expected first run step')
          if run_steps[-1][0] != 'CAM Phase7 regression safety audit':
              raise SystemExit(f'v0.2.39 replay parser ended at unexpected step: {run_steps[-1][0] if run_steps else "none"}')

          def resolve_workdir(raw):
              if not raw:
                  return ROOT
              expr_open = '$' + '{{'
              source_expr = expr_open + ' env.ES_SOURCE_DIR }}'
              raw = raw.replace(source_expr, SOURCE_DIR)
              if expr_open in raw:
                  raise SystemExit('Unsupported GitHub expression in replay workdir: ' + raw)
              return (ROOT / raw).resolve()

          for number, (name, workdir, script) in enumerate(run_steps, 1):
              cwd = resolve_workdir(workdir)
              print(f'\n[ES-REPLAY239] {number:02d}/{len(run_steps)} {name}', flush=True)
              subprocess.run(['bash', '-e', '-u', '-o', 'pipefail', '-c', script], cwd=cwd, env=os.environ.copy(), check=True)

          gradle = ROOT / SOURCE_DIR / 'app/build.gradle'
          body = gradle.read_text()
          if 'versionCode 49' not in body or '0.2.39-cam-phase7-storm4-texture-forensics-tic-fix-settings-trace-ptbr' not in body:
              raise SystemExit('v0.2.39 reconstruction version verification failed')
          textures = (ROOT / SOURCE_DIR / 'app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp').read_text()
          if '[ES-S4-TIC-CHANGE]' not in textures or 'STALE-REUSE-BLOCKED' not in textures:
              raise SystemExit('v0.2.39 Phase7 forensic baseline missing')
          print('[ES-REPLAY239] v0.2.39 source reconstructed from proven Action #82 workflow')
          PYREPLAY

      - name: Apply CAM Phase8 Storm4 black-box diagnostic battery
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PYPHASE8'
          from pathlib import Path
          import re

          root = Path('.')

          def read(rel):
              return (root/rel).read_text()

          def write(rel, text):
              (root/rel).write_text(text)

          def replace_once(text, old, new, label):
              c = text.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: anchor count={c}, expected 1')
              return text.replace(old, new, 1)

          def replace_in_region(text, start_marker, end_marker, old, new, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker missing')
              region = text[start:end]
              c = region.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: regional anchor count={c}, expected 1')
              region = region.replace(old, new, 1)
              return text[:start] + region + text[end:]

          # -----------------------------------------------------------------------
          # 0) Version identity.
          # -----------------------------------------------------------------------
          rel = 'app/build.gradle'
          t = read(rel)
          t, n1 = re.subn(r'versionCode\s+49\b', 'versionCode 50', t, count=1)
          t, n2 = re.subn(
              r'versionName\s+"0\.2\.39-cam-phase7-storm4-texture-forensics-tic-fix-settings-trace-ptbr"',
              'versionName "0.2.40-cam-phase8-storm4-blackbox-forensics-full-diagnostics-ptbr"',
              t, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Phase8 version bump failed: code={n1}, name={n2}')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 1) Global Storm4 event clock + presented-frame clock.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu.h'
          t = read(rel)
          if '#include <atomic>\n' not in t:
              if '#include <string>\n' in t:
                  t = t.replace('#include <string>\n', '#include <atomic>\n#include <string>\n', 1)
              else:
                  raise SystemExit('gpu.h include anchor missing')
          old = '''        std::string currentTitleId{};\n        bool storm4TextureForensics{};\n'''
          new = '''        std::string currentTitleId{};\n        bool storm4TextureForensics{};\n        std::atomic<u64> storm4ForensicEvent{}; //!< Monotonic event id for cross-subsystem correlation\n        std::atomic<u64> storm4PresentFrame{}; //!< Number of frames actually presented by Android\n'''
          t = replace_once(t, old, new, 'GPU Phase8 clocks')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 2) CommandExecutor exposes forensic gate/event/frame to engines such as DMA.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/command_executor.h'
          t = read(rel)
          anchor = '''        /** @return Selected DMA accuracy mode: 0 default, 1 unsafe/fast, 2 safe. */\n        u32 DmaAccuracy() const;\n\n'''
          insert = anchor + '''        /** @return Whether Storm 4 black-box diagnostics are active for this title. */\n        bool Storm4TextureForensics() const;\n\n        /** @return A globally monotonic Storm 4 forensic event id. */\n        u64 NextStorm4ForensicEvent();\n\n        /** @return The latest frame index presented to Android. */\n        u64 Storm4PresentFrame() const;\n\n'''
          t = replace_once(t, anchor, insert, 'CommandExecutor forensic declarations')
          write(rel, t)

          rel = 'app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp'
          t = read(rel)
          anchor = '''    u32 CommandExecutor::DmaAccuracy() const {\n        return *state.settings->dmaAccuracy;\n    }\n\n'''
          insert = anchor + '''    bool CommandExecutor::Storm4TextureForensics() const {\n        return gpu.storm4TextureForensics;\n    }\n\n    u64 CommandExecutor::NextStorm4ForensicEvent() {\n        return gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1;\n    }\n\n    u64 CommandExecutor::Storm4PresentFrame() const {\n        return gpu.storm4PresentFrame.load(std::memory_order_relaxed);\n    }\n\n'''
          t = replace_once(t, anchor, insert, 'CommandExecutor forensic implementations')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 3) Texture and TextureView identities + content generations.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/texture/texture.h'
          t = read(rel)
          old = '''        LockableSharedPtr<Texture> texture;\n        vk::ImageViewType type;\n        texture::Format format;\n        vk::ComponentMapping mapping;\n        vk::ImageSubresourceRange range;\n'''
          new = '''        LockableSharedPtr<Texture> texture;\n        vk::ImageViewType type;\n        texture::Format format;\n        vk::ComponentMapping mapping;\n        vk::ImageSubresourceRange range;\n        u64 esViewId{}; //!< Stable Emerald forensic id for this exact TextureView object\n'''
          t = replace_once(t, old, new, 'TextureView forensic id field')

          old = '''        bool replaced{};\n'''
          new = '''        bool replaced{};\n\n        // Emerald Storm Phase8 black-box metadata. These do not affect rendering decisions.\n        std::atomic<u64> esContentGeneration{};\n        std::atomic<u64> esLastSampledGeneration{~u64{0}};\n        std::atomic<u64> esLastWriteEvent{};\n        std::atomic<u32> esLastWriter{}; // 0 none, 1 CPU upload, 2 render target, 3 texture copy\n\n        /** @return Lightweight fingerprint of CPU-visible guest backing, or 0 when unavailable. */\n        u64 DebugGuestFingerprint() const;\n'''
          t = replace_once(t, old, new, 'Texture forensic generation fields')
          write(rel, t)

          rel = 'app/src/main/cpp/skyline/gpu/texture/texture.cpp'
          t = read(rel)
          old = '''    TextureView::TextureView(std::shared_ptr<Texture> texture, vk::ImageViewType type, vk::ImageSubresourceRange range, texture::Format format, vk::ComponentMapping mapping) : texture(std::move(texture)), type(type), format(format), mapping(mapping), range(range) {}\n\n'''
          new = '''    TextureView::TextureView(std::shared_ptr<Texture> texture, vk::ImageViewType type, vk::ImageSubresourceRange range, texture::Format format, vk::ComponentMapping mapping) : texture(std::move(texture)), type(type), format(format), mapping(mapping), range(range) {\n        static std::atomic<u64> esNextViewId{1};\n        esViewId = esNextViewId.fetch_add(1, std::memory_order_relaxed);\n    }\n\n    u64 Texture::DebugGuestFingerprint() const {\n        if (!guest || memoryFreed || !mirror.valid() || mirror.size() == 0)\n            return 0;\n\n        // Sample at most ~4096 bytes spread over the entire guest mirror. This gives us a\n        // useful content signature without hashing multi-megabyte textures on every upload.\n        constexpr u64 FnvOffset{1469598103934665603ULL};\n        constexpr u64 FnvPrime{1099511628211ULL};\n        const size_t sampleBudget{4096};\n        const size_t step{mirror.size() > sampleBudget ? (mirror.size() / sampleBudget) : 1};\n        u64 hash{FnvOffset ^ static_cast<u64>(mirror.size())};\n        for (size_t i{}; i < mirror.size(); i += step) {\n            hash ^= static_cast<u64>(mirror[i]);\n            hash *= FnvPrime;\n        }\n        return hash;\n    }\n\n'''
          t = replace_once(t, old, new, 'TextureView id + guest fingerprint implementation')

          # CPU -> host upload path. This only reaches SynchronizeHostImpl when CpuDirty really needs upload.
          t = replace_in_region(
              t,
              '    void Texture::SynchronizeHost(bool gpuDirty) {\n',
              '    void Texture::SynchronizeHostInline(',
              '        auto stagingBuffer{SynchronizeHostImpl()};\n',
              '''        auto stagingBuffer{SynchronizeHostImpl()};\n        if (gpu.storm4TextureForensics) {\n            const u64 generation{esContentGeneration.fetch_add(1, std::memory_order_relaxed) + 1};\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            esLastWriter.store(1, std::memory_order_relaxed);\n            esLastWriteEvent.store(event, std::memory_order_relaxed);\n            LOGI("[ES-S4-CPU-UPLOAD] event={} frame={} tex=#{} gen={} fingerprint=0x{:016X} gpuDirty={} layout={} dims={}x{}x{}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), debugId, generation,\n                 DebugGuestFingerprint(), gpuDirty, static_cast<u32>(layout),\n                 dimensions.width, dimensions.height, dimensions.depth);\n        }\n''',
              'SynchronizeHost CPU upload trace')

          t = replace_in_region(
              t,
              '    void Texture::SynchronizeHostInline(',
              '    std::shared_ptr<memory::StagingBuffer> Texture::SnapshotSampledCpuDirty()',
              '        auto stagingBuffer{SynchronizeHostImpl()};\n',
              '''        auto stagingBuffer{SynchronizeHostImpl()};\n        if (gpu.storm4TextureForensics) {\n            const u64 generation{esContentGeneration.fetch_add(1, std::memory_order_relaxed) + 1};\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            esLastWriter.store(1, std::memory_order_relaxed);\n            esLastWriteEvent.store(event, std::memory_order_relaxed);\n            LOGI("[ES-S4-CPU-UPLOAD-INLINE] event={} frame={} tex=#{} gen={} fingerprint=0x{:016X} gpuDirty={} layout={} dims={}x{}x{}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), debugId, generation,\n                 DebugGuestFingerprint(), gpuDirty, static_cast<u32>(layout),\n                 dimensions.width, dimensions.height, dimensions.depth);\n        }\n''',
              'SynchronizeHostInline CPU upload trace')

          # Host -> guest readback/skip proof.
          t = replace_in_region(
              t,
              '    void Texture::SynchronizeGuest(bool cpuDirty, bool skipTrap) {\n',
              '    std::shared_ptr<TextureView> Texture::GetView(',
              '        if (layout == vk::ImageLayout::eUndefined || format != guest->format)\n',
              '''        if (gpu.storm4TextureForensics) {\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            LOGI("[ES-S4-GPU-READBACK] event={} frame={} tex=#{} gen={} writer={} cpuDirty={} skipTrap={} layout={} formatMatch={} guestWasFreed={}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), debugId,\n                 esContentGeneration.load(std::memory_order_relaxed), esLastWriter.load(std::memory_order_relaxed),\n                 cpuDirty, skipTrap, static_cast<u32>(layout), format == guest->format, esGuestWasFreed);\n        }\n\n        if (layout == vk::ImageLayout::eUndefined || format != guest->format)\n''',
              'SynchronizeGuest readback trace')

          # Texture -> texture copy path, including presentation copies and internal image copies.
          t = replace_in_region(
              t,
              '    void Texture::CopyFrom(std::shared_ptr<Texture> source,',
              '    bool Texture::ValidateRenderPassUsage(',
              '        TRACE_EVENT("gpu", "Texture::CopyFrom");\n',
              '''        TRACE_EVENT("gpu", "Texture::CopyFrom");\n\n        if (gpu.storm4TextureForensics) {\n            const u64 generation{esContentGeneration.fetch_add(1, std::memory_order_relaxed) + 1};\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            esLastWriter.store(3, std::memory_order_relaxed);\n            esLastWriteEvent.store(event, std::memory_order_relaxed);\n            LOGI("[ES-S4-TEXCOPY] event={} frame={} srcTex=#{} srcGen={} srcWriter={} dstTex=#{} dstGen={} srcLayout={} dstLayout={} dims={}x{}x{} srcFmt={} dstFmt={}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed),\n                 source->debugId, source->esContentGeneration.load(std::memory_order_relaxed), source->esLastWriter.load(std::memory_order_relaxed),\n                 debugId, generation, static_cast<u32>(source->layout), static_cast<u32>(layout),\n                 dimensions.width, dimensions.height, dimensions.depth,\n                 srcFormat ? static_cast<u32>(srcFormat->vkFormat) : 0U, static_cast<u32>(format->vkFormat));\n        }\n''',
              'Texture CopyFrom trace')

          # Render-target write epochs and the first sample of each content generation.
          start = t.find('    void Texture::UpdateRenderPassUsage(u32 renderPassIndex, texture::RenderPassUsage renderPassUsage) {\n')
          end = t.find('    texture::RenderPassUsage Texture::GetLastRenderPassUsage()', start)
          if start < 0 or end < 0:
              raise SystemExit('UpdateRenderPassUsage region missing')
          old_region = t[start:end]
          new_region = '''    void Texture::UpdateRenderPassUsage(u32 renderPassIndex, texture::RenderPassUsage renderPassUsage) {\n        const u32 esPreviousIndex{lastRenderPassIndex};\n        const auto esPreviousUsage{lastRenderPassUsage};\n\n        if (gpu.storm4TextureForensics && renderPassUsage == texture::RenderPassUsage::RenderTarget &&\n            (esPreviousIndex != renderPassIndex || esPreviousUsage != texture::RenderPassUsage::RenderTarget)) {\n            const u64 generation{esContentGeneration.fetch_add(1, std::memory_order_relaxed) + 1};\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            esLastWriter.store(2, std::memory_order_relaxed);\n            esLastWriteEvent.store(event, std::memory_order_relaxed);\n            LOGI("[ES-S4-RT-WRITE] event={} frame={} tex=#{} gen={} renderPass={} prevPass={} prevUsage={} layout={} dims={}x{}x{}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), debugId, generation,\n                 renderPassIndex, esPreviousIndex, static_cast<u32>(esPreviousUsage), static_cast<u32>(layout),\n                 dimensions.width, dimensions.height, dimensions.depth);\n        }\n\n        if (gpu.storm4TextureForensics && renderPassUsage == texture::RenderPassUsage::Sampled) {\n            const u64 generation{esContentGeneration.load(std::memory_order_relaxed)};\n            const u64 previouslySampled{esLastSampledGeneration.exchange(generation, std::memory_order_relaxed)};\n            if (previouslySampled != generation || esPreviousUsage == texture::RenderPassUsage::RenderTarget) {\n                const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                LOGI("[ES-S4-SAMPLE] event={} frame={} tex=#{} gen={} writer={} lastWriteEvent={} renderPass={} prevPass={} prevUsage={} pendingStages=0x{:X} readStages=0x{:X} layout={}",\n                     event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), debugId, generation,\n                     esLastWriter.load(std::memory_order_relaxed), esLastWriteEvent.load(std::memory_order_relaxed),\n                     renderPassIndex, esPreviousIndex, static_cast<u32>(esPreviousUsage),\n                     static_cast<u32>(pendingStageMask), static_cast<u32>(readStageMask), static_cast<u32>(layout));\n            }\n        }\n\n        lastRenderPassUsage = renderPassUsage;\n        lastRenderPassIndex = renderPassIndex;\n\n        if (renderPassUsage == texture::RenderPassUsage::RenderTarget) {\n            everUsedAsRt = true;\n            pendingStageMask = vk::PipelineStageFlagBits::eVertexShader |\n                vk::PipelineStageFlagBits::eTessellationControlShader |\n                vk::PipelineStageFlagBits::eTessellationEvaluationShader |\n                vk::PipelineStageFlagBits::eGeometryShader |\n                vk::PipelineStageFlagBits::eFragmentShader |\n                vk::PipelineStageFlagBits::eComputeShader;\n            readStageMask = {};\n        } else if (renderPassUsage == texture::RenderPassUsage::None) {\n            pendingStageMask = {};\n            readStageMask = {};\n        }\n    }\n\n'''
          if 'lastRenderPassUsage = renderPassUsage;' not in old_region:
              raise SystemExit('UpdateRenderPassUsage original body unexpected')
          t = t[:start] + new_region + t[end:]

          # Log every real RT -> shader-read barrier emission. This proves whether the image was synchronized.
          t = replace_in_region(
              t,
              '    void Texture::PopulateReadBarrier(',
              '\n}',
              '        if (!(pendingStageMask & dstStage))\n            return;\n\n',
              '''        if (!(pendingStageMask & dstStage))\n            return;\n\n        if (gpu.storm4TextureForensics) {\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            LOGI("[ES-S4-RT-READ-BARRIER] event={} frame={} tex=#{} gen={} writer={} dstStage=0x{:X} pendingBefore=0x{:X} readStages=0x{:X} layout={}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), debugId,\n                 esContentGeneration.load(std::memory_order_relaxed), esLastWriter.load(std::memory_order_relaxed),\n                 static_cast<u32>(dstStage), static_cast<u32>(pendingStageMask), static_cast<u32>(readStageMask), static_cast<u32>(layout));\n        }\n\n''',
              'RT read barrier trace')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 3b) Exact attachment-feedback correlation. Storm 4 repeatedly samples the
          # same backing/subresource it is also rendering to; tag these draws with the
          # global event clock so we can line them up with writes, binds and frames.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp'
          t = read(rel)
          old = '''                if (overlap) {\n                    static std::atomic<u64> esOverlappingFeedbackOccurrence{};\n'''
          new = '''                if (overlap) {\n                    if (gpu.storm4TextureForensics) {\n                        const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                        LOGI("[ES-S4-FEEDBACK] event={} frame={} tex=#{} gen={} writer={} lastWriteEvent={} rp={} kind={} slot={} sampleView=#{} outputView=#{} sameVkView={} split={} outputValid={} sampledValid={} attachmentsMatch={} sampleMip={}/{} sampleLayer={}/{} outputMip={}/{} outputLayer={}/{}",\n                             event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), sampled->texture->debugId,\n                             sampled->texture->esContentGeneration.load(std::memory_order_relaxed),\n                             sampled->texture->esLastWriter.load(std::memory_order_relaxed),\n                             sampled->texture->esLastWriteEvent.load(std::memory_order_relaxed),\n                             renderPassIndex, outputKind, outputSlot, sampled->esViewId, output->esViewId, sameVkView,\n                             splitRenderPass, outputUsageValid, sampledUsageValid, attachmentsMatch,\n                             sampled->range.baseMipLevel, sampled->range.levelCount, sampled->range.baseArrayLayer, sampled->range.layerCount,\n                             output->range.baseMipLevel, output->range.levelCount, output->range.baseArrayLayer, output->range.layerCount);\n                    }\n                    static std::atomic<u64> esOverlappingFeedbackOccurrence{};\n'''
          t = replace_once(t, old, new, 'Storm4 feedback correlation trace')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 4) Descriptor bind trace: exact TIC slot -> TextureView -> content generation.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp'
          t = read(rel)
          if '#include <unordered_map>\n' not in t:
              t = replace_once(t, '#include <unordered_set>\n', '#include <unordered_map>\n#include <unordered_set>\n', 'textures unordered_map include')
          old = '''        std::unordered_set<u64> esStorm4SeenTextureIds;\n'''
          new = '''        std::unordered_set<u64> esStorm4SeenTextureIds;\n        std::unordered_map<u32, u64> esStorm4LastSlotViewId;\n        std::atomic<u64> esStorm4BindEvents{};\n'''
          t = replace_once(t, old, new, 'textures slot view map')

          anchor = '''                if (esFirstUse) {\n                    const u64 firstOccurrence{esStorm4FirstUseEvents.fetch_add(1, std::memory_order_relaxed) + 1};\n'''
          if anchor not in t:
              raise SystemExit('Phase7 first-use anchor missing')
          # Add bind trace inside the existing Storm4-only provenance block, immediately after FIRST-USE handling.
          old = '''                }\n            }\n            static std::atomic<u64> esTicResolveFormatCount{};\n'''
          new = '''                }\n\n                bool esBindChanged{};\n                {\n                    std::scoped_lock lock{esStorm4TextureSeenMutex};\n                    auto [it, inserted]{esStorm4LastSlotViewId.try_emplace(index, texture->esViewId)};\n                    if (inserted || it->second != texture->esViewId) {\n                        esBindChanged = true;\n                        it->second = texture->esViewId;\n                    }\n                }\n                if (esBindChanged) {\n                    const u64 occurrence{esStorm4BindEvents.fetch_add(1, std::memory_order_relaxed) + 1};\n                    const u64 event{ctx.gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                    if (EsStorm4ShouldLog(occurrence, 8192, 2048)) {\n                        LOGI("[ES-S4-BIND] event={} frame={} occurrence={} slot={} sequence={} tex=#{} view=#{} gen={} writer={} lastWriteEvent={} iova=0x{:X} rawFmt=0x{:08X} viewFmt={} viewType={} mip={}/{} layer={}/{} replaced={}",\n                             event, ctx.gpu.storm4PresentFrame.load(std::memory_order_relaxed), occurrence, index,\n                             ctx.channelCtx.channelSequenceNumber, texture->texture->debugId, texture->esViewId,\n                             texture->texture->esContentGeneration.load(std::memory_order_relaxed),\n                             texture->texture->esLastWriter.load(std::memory_order_relaxed),\n                             texture->texture->esLastWriteEvent.load(std::memory_order_relaxed),\n                             textureHeader.Iova(), textureHeader.formatWord.Raw(),\n                             texture->format ? static_cast<u32>(texture->format->vkFormat) : 0U, static_cast<u32>(texture->type),\n                             texture->range.baseMipLevel, texture->range.levelCount, texture->range.baseArrayLayer, texture->range.layerCount,\n                             texture->texture->replaced);\n                    }\n                }\n            }\n            static std::atomic<u64> esTicResolveFormatCount{};\n'''
          t = replace_once(t, old, new, 'Storm4 bind trace insertion')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 5) TextureManager decisions: CREATE / FULL / LAYER-MIP / REPLACE / OVERLAP.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/texture_manager.cpp'
          t = read(rel)

          old = '''                        if (layerMipMatch) {\n                            static std::atomic<u64> esAliasLayerReplaceCount{};\n'''
          new = '''                        if (layerMipMatch) {\n                            if (gpu.storm4TextureForensics) {\n                                const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                                LOGI("[ES-S4-TEXMAN] event={} frame={} decision=REPLACE-LAYER-MIP oldTex=#{} newTex=#{} level={} layer={}",\n                                     event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), layerMipMatch->debugId, hostMapping->texture->debugId, matchLevel, matchLayer);\n                            }\n                            static std::atomic<u64> esAliasLayerReplaceCount{};\n'''
          t = replace_once(t, old, new, 'TextureManager layer-mip replacement trace')

          old = '''                        if (fullMatch) {\n                            static std::atomic<u64> esAliasFullReplaceCount{};\n'''
          new = '''                        if (fullMatch) {\n                            if (gpu.storm4TextureForensics) {\n                                const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                                LOGI("[ES-S4-TEXMAN] event={} frame={} decision=REPLACE-FULL oldTex=#{} newTex=#{} level={} layer={}",\n                                     event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), fullMatch->debugId, hostMapping->texture->debugId, matchLevel, matchLayer);\n                            }\n                            static std::atomic<u64> esAliasFullReplaceCount{};\n'''
          t = replace_once(t, old, new, 'TextureManager full replacement trace')

          old = '''        if (layerMipMatch) {\n            ContextLock textureLock{tag, *layerMipMatch};\n            return layerMipMatch->GetView(guestTexture.viewType, vk::ImageSubresourceRange{\n'''
          new = '''        if (layerMipMatch) {\n            if (gpu.storm4TextureForensics) {\n                const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                LOGI("[ES-S4-TEXMAN] event={} frame={} decision=LAYER-MIP-MATCH tex=#{} level={} layer={} guest={}x{}x{} mips={}/{}",\n                     event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), layerMipMatch->debugId, matchLevel, matchLayer,\n                     guestTexture.dimensions.width, guestTexture.dimensions.height, guestTexture.dimensions.depth,\n                     guestTexture.viewMipBase, guestTexture.viewMipCount);\n            }\n            ContextLock textureLock{tag, *layerMipMatch};\n            return layerMipMatch->GetView(guestTexture.viewType, vk::ImageSubresourceRange{\n'''
          t = replace_once(t, old, new, 'TextureManager layer-mip trace')

          old = '''        } else if (fullMatch) {\n            ContextLock textureLock{tag, *fullMatch};\n            return fullMatch->GetView(guestTexture.viewType, vk::ImageSubresourceRange{\n'''
          new = '''        } else if (fullMatch) {\n            if (gpu.storm4TextureForensics) {\n                const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n                LOGI("[ES-S4-TEXMAN] event={} frame={} decision=FULL-MATCH tex=#{} guest={}x{}x{} mips={}/{} format={}",\n                     event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), fullMatch->debugId,\n                     guestTexture.dimensions.width, guestTexture.dimensions.height, guestTexture.dimensions.depth,\n                     guestTexture.viewMipBase, guestTexture.viewMipCount, static_cast<u32>(guestTexture.format->vkFormat));\n            }\n            ContextLock textureLock{tag, *fullMatch};\n            return fullMatch->GetView(guestTexture.viewType, vk::ImageSubresourceRange{\n'''
          t = replace_once(t, old, new, 'TextureManager full-match trace')

