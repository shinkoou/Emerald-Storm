                           texture->GetDebugDirtyState(), overlap->GetDebugDirtyState());
                  }
              }

          '''
          m = replace_function(m, register_start, register_end, register_impl)

          cpu_start = '    void EmeraldTextureManager::MarkCpuModified('
          cpu_end = '    void EmeraldTextureManager::ObserveRenderTarget('
          cpu_impl = r'''    void EmeraldTextureManager::MarkCpuModified(Texture &texture, const char *source) {
                  std::scoped_lock lock{mutex};
                  auto &origin{EnsureRecordLocked(texture)};
                  const u64 tick{++modificationTick};

                  boost::container::small_vector<u64, 16> pending;
                  boost::container::small_vector<u64, 16> visited;
                  pending.emplace_back(origin.id);

                  while (!pending.empty()) {
                      const u64 id{pending.back()};
                      pending.pop_back();

                      if (std::find(visited.begin(), visited.end(), id) != visited.end())
                          continue;
                      visited.emplace_back(id);

                      auto it{records.find(id)};
                      if (it == records.end())
