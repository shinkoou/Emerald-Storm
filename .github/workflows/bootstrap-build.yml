          register_end = '    void EmeraldTextureManager::ObserveReplacement('
          register_impl = r'''    void EmeraldTextureManager::RegisterTexture(
                  const std::shared_ptr<Texture> &texture,
                  const GuestTexture &guestTexture,
                  const boost::container::small_vector<std::shared_ptr<Texture>, 4> &overlaps) {
                  if (!texture)
                      return;

                  std::scoped_lock lock{mutex};
                  EnsureRecordLocked(*texture);
                  PopulateRecordLocked(records.at(texture->debugId), guestTexture);

                  u64 inheritedTick{};
                  Writer inheritedWriter{Writer::None};
                  u64 inheritedFrom{};

                  for (const auto &overlap : overlaps) {
                      if (!overlap || overlap->debugId == texture->debugId)
                          continue;

                      EnsureRecordLocked(*overlap);
                      const auto &overlapRecord{records.at(overlap->debugId)};
                      if (overlapRecord.modificationTick > inheritedTick) {
                          inheritedTick = overlapRecord.modificationTick;
                          inheritedWriter = overlapRecord.lastWriter;
                          inheritedFrom = overlapRecord.id;
                      }

                      AddAliasLocked(texture->debugId, overlap->debugId);
                      ++aliasEvents;
                  }

                  auto &record{records.at(texture->debugId)};
                  if (inheritedTick > record.modificationTick) {
                      record.modificationTick = inheritedTick;
                      record.lastWriter = inheritedWriter;
                  }

                  const u64 occurrence{++createEvents};
                  size_t mappedBytes{};
                  for (const auto &range : record.mappings)
                      mappedBytes += range.end - range.begin;

                  if (!record.aliases.empty() || EsTmShouldLog(occurrence, 96, 4096)) {
                      LOGI("[ES-TM2] CREATE tex=#{} mappings={} bytes=0x{:X} dims={}x{}x{} fmt={} tile={} layers={} mips={} aliases={} inheritedTick={} inheritedFrom=#{} inheritedWriter={} dirty={} occurrence #{}",
                           record.id, record.mappings.size(), mappedBytes,
