          new = '''        if (gpu.storm4TextureForensics && !matches.empty()) {\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            LOGI("[ES-S4-TEXMAN] event={} frame={} decision=OVERLAP-SYNC overlapCount={} guest={}x{}x{} format={}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), matches.size(),\n                 guestTexture.dimensions.width, guestTexture.dimensions.height, guestTexture.dimensions.depth,\n                 static_cast<u32>(guestTexture.format->vkFormat));\n        }\n        for (auto &texture : matches)\n            texture->SynchronizeGuest(false, true);\n\n        // Create a texture as we cannot find one that matches\n'''
          t = replace_once(t, old, new, 'TextureManager overlap trace')

          old = '''        auto texture{std::make_shared<Texture>(gpu, guestTexture)};\n        emerald.RegisterTexture(texture, guestTexture, matches);\n'''
          new = '''        auto texture{std::make_shared<Texture>(gpu, guestTexture)};\n        emerald.RegisterTexture(texture, guestTexture, matches);\n        if (gpu.storm4TextureForensics) {\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            LOGI("[ES-S4-TEXMAN] event={} frame={} decision=CREATE tex=#{} guest={}x{}x{} bytes=0x{:X} layers={} mipLevels={} viewMip={}/{} format={} tileMode={}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), texture->debugId,\n                 guestTexture.dimensions.width, guestTexture.dimensions.height, guestTexture.dimensions.depth,\n                 guestTexture.CalculateLayerSize() * guestTexture.layerCount, guestTexture.layerCount, guestTexture.mipLevelCount,\n                 guestTexture.viewMipBase, guestTexture.viewMipCount, static_cast<u32>(guestTexture.format->vkFormat),\n                 static_cast<u32>(guestTexture.tileConfig.mode));\n        }\n'''
          t = replace_once(t, old, new, 'TextureManager create trace')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 6) Fermi2D correlation: src/dst texture identity, IOVA, rect and scaling.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp'
          t = read(rel)
          anchor = '''        auto dstTextureView{gpu.texture.FindOrCreate(dstGuestTexture, executor.tag)};\n        executor.AttachDependency(dstTextureView);\n        executor.AttachTexture(dstTextureView.get());\n        dstTextureView->texture->MarkGpuDirty(executor.usageTracker);\n\n'''
          insert = '''        auto dstTextureView{gpu.texture.FindOrCreate(dstGuestTexture, executor.tag)};\n        executor.AttachDependency(dstTextureView);\n        executor.AttachTexture(dstTextureView.get());\n        dstTextureView->texture->MarkGpuDirty(executor.usageTracker);\n\n        if (gpu.storm4TextureForensics) {\n            const u64 event{gpu.storm4ForensicEvent.fetch_add(1, std::memory_order_relaxed) + 1};\n            LOGI("[ES-S4-FERMI2D] event={} frame={} sequence={} srcTex=#{} srcView=#{} dstTex=#{} dstView=#{} srcIova=0x{:X} dstIova=0x{:X} src={}x{}x{} dst={}x{}x{} rectSrc=({:.3f},{:.3f}) rectDst=({},{} {}x{}) duDx={:.6f} dvDy={:.6f} resolve={} filter={}",\n                 event, gpu.storm4PresentFrame.load(std::memory_order_relaxed), channelCtx.channelSequenceNumber,\n                 srcTextureView->texture->debugId, srcTextureView->esViewId, dstTextureView->texture->debugId, dstTextureView->esViewId,\n                 u64{srcSurface.address}, u64{dstSurface.address},\n                 srcGuestTexture.dimensions.width, srcGuestTexture.dimensions.height, srcGuestTexture.dimensions.depth,\n                 dstGuestTexture.dimensions.width, dstGuestTexture.dimensions.height, dstGuestTexture.dimensions.depth,\n                 centredSrcRectX, centredSrcRectY, dstRectX, dstRectY, dstRectWidth, dstRectHeight,\n                 duDx, dvDy, resolve, static_cast<u32>(filter));\n        }\n\n'''
          t = replace_once(t, anchor, insert, 'Fermi2D black-box trace')
          write(rel, t)

          # -----------------------------------------------------------------------
          # 7) Maxwell DMA correlation: raw guest IOVAs and copy geometry in the same event clock.
          # -----------------------------------------------------------------------
          rel = 'app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_dma.cpp'
          t = read(rel)
          anchor = '''        if (esDmaOccurrence <= 16 || (esDmaOccurrence % 2048) == 0)\n            LOGI("[ES-DMA] mode={} multiline={} occurrence #{}", esDmaAccuracy, esMultiLineEnable, esDmaOccurrence);\n\n'''
          insert = anchor + '''        if (channelCtx.executor.Storm4TextureForensics()) {\n            static std::atomic<u64> esStorm4DmaTraceCount{};\n            const u64 traceCount{esStorm4DmaTraceCount.fetch_add(1, std::memory_order_relaxed) + 1};\n            if (traceCount <= 8192 || (traceCount % 2048) == 0) {\n                const u64 event{channelCtx.executor.NextStorm4ForensicEvent()};\n                const u64 srcIova{u64{*registers.offsetIn}};\n                const u64 dstIova{u64{*registers.offsetOut}};\n                const u32 lineLength{*registers.lineLengthIn};\n                const u32 lineCount{esMultiLineEnable ? static_cast<u32>(*registers.lineCount) : 1U};\n                const u32 pitchIn{esMultiLineEnable ? static_cast<u32>(*registers.pitchIn) : 0U};\n                const u32 pitchOut{esMultiLineEnable ? static_cast<u32>(*registers.pitchOut) : 0U};\n                const u32 srcLayout{static_cast<u32>(registers.launchDma->srcMemoryLayout)};\n                const u32 dstLayout{static_cast<u32>(registers.launchDma->dstMemoryLayout)};\n                const bool remapEnable{static_cast<bool>(registers.launchDma->remapEnable)};\n                LOGI("[ES-S4-DMA] event={} frame={} trace={} sequence={} mode={} src=0x{:X} dst=0x{:X} lineLength=0x{:X} lineCount={} pitchIn=0x{:X} pitchOut=0x{:X} srcLayout={} dstLayout={} remap={} multiline={}",\n                     event, channelCtx.executor.Storm4PresentFrame(), traceCount, channelCtx.channelSequenceNumber, esDmaAccuracy,\n                     srcIova, dstIova, lineLength, lineCount, pitchIn, pitchOut, srcLayout, dstLayout, remapEnable, esMultiLineEnable);\n            }\n        }\n\n'''
          t = replace_once(t, anchor, insert, 'Storm4 DMA black-box trace')
