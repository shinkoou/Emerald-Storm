name: Emerald Storm v0.2.22 TEXMAN ScanSafe NVDEC Runtime Restore COMPILEFIX6

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap-build.yml'

concurrency:
  group: emerald-texman-runtime-compilefix6-${{ github.ref }}
  cancel-in-progress: true

env:
  TEXMAN_REPO: https://github.com/isyvdshvsy/Skyline-texman.git
  TEXMAN_SHA: 24e2f648871a5daab5198e119f95187791c96c6e
  SOURCE_DIR: texman-src
  NDK_VERSION: 25.0.8775105
  CMAKE_VERSION: 3.22.1
  DONOR_ZIP: EmeraldStorm-v0.1.0-Baseline-Source.zip
  DONOR_EXTRACT: emerald-runtime-donor
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: string:25.0.8775105

jobs:
  android:
    name: Build v0.2.22 TEXMAN + ScanSafe + NVDEC H264 VP9 COMPILEFIX6
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Emerald repository metadata
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache git unzip glslang-tools

      - name: Switch to Java 11 for legacy TEXMAN Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Replay proven TEXMAN pipeline with COMPILEFIX6 compatibility bridge
        run: |
          set -euo pipefail
          BASE_WORKFLOW=/tmp/bootstrap-build-compilefix3.yml
          git show c4d13fbd63e8264e688402133709fef056a61081:.github/workflows/bootstrap-build.yml > "$BASE_WORKFLOW"
          test -s "$BASE_WORKFLOW"
          python3 - <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path
          
          ROOT = Path.cwd().resolve()
          WORKFLOW = Path('/tmp/bootstrap-build-compilefix3.yml')
          SOURCE_DIR = os.environ.get('SOURCE_DIR', 'texman-src')
          
          RUN_ORDER = [
              'Extract known-good Emerald runtime donor',
              'Clone recovered Skyline TEXMAN snapshot',
              'Restore TEXMAN pinned dependencies through surviving mirrors',
              'Restore Emerald ScanSafe library behavior COMPILEFIX3',
              'Restore Emerald NVDEC H264 VP9 and VIC runtime COMPILEFIX3',
              'Restore Emerald launcher icon assets',
              'Apply Emerald TEXMAN safety corrections and v0.2.22 branding',
              'Verify v0.2.22 TEXMAN runtime restoration COMPILEFIX3',
              'Build v0.2.22 TEXMAN ScanSafe NVDEC ARM64 APK COMPILEFIX3',
              'Prepare APK and provenance',
          ]
          
          
          def parse_run_steps(path: Path) -> dict[str, tuple[str | None, str]]:
              lines = path.read_text().splitlines()
              starts: list[tuple[int, str]] = []
              for i, line in enumerate(lines):
                  m = re.match(r'^      - name:\s*(.+?)\s*$', line)
                  if m:
                      starts.append((i, m.group(1).strip('"\'')))
          
              steps: dict[str, tuple[str | None, str]] = {}
              for pos, (start, name) in enumerate(starts):
                  end = starts[pos + 1][0] if pos + 1 < len(starts) else len(lines)
                  block = lines[start:end]
                  workdir = None
                  run_at = None
                  for j, line in enumerate(block):
                      m = re.match(r'^        working-directory:\s*(.+?)\s*$', line)
                      if m:
                          workdir = m.group(1).strip('"\'')
                      if re.match(r'^        run:\s*\|\s*$', line):
                          run_at = j
                          break
                  if run_at is None:
                      continue
          
                  script_lines: list[str] = []
                  for line in block[run_at + 1:]:
                      if line.startswith('          '):
                          script_lines.append(line[10:])
                      elif not line.strip():
                          script_lines.append('')
                      else:
                          break
                  steps[name] = (workdir, '\n'.join(script_lines) + '\n')
              return steps
          
          
          def resolve_workdir(raw: str | None) -> Path:
              if not raw:
                  return ROOT
              expr_open = '$' + '{{'
              source_expr = expr_open + ' env.SOURCE_DIR }}'
              raw = raw.replace(source_expr, SOURCE_DIR)
              if expr_open in raw:
                  raise SystemExit(f'Unsupported GitHub expression in working-directory: {raw}')
              return (ROOT / raw).resolve()
          
          
          def run_step(name: str, workdir: str | None, script: str) -> None:
              cwd = resolve_workdir(workdir)
              print(f'\n[ES-CI] ===== Replay: {name} =====', flush=True)
              print(f'[ES-CI] cwd: {cwd}', flush=True)
              subprocess.run(
                  ['bash', '-e', '-u', '-o', 'pipefail', '-c', script],
                  cwd=cwd,
                  env=os.environ.copy(),
                  check=True,
              )
          
          
          def apply_compilefix6() -> None:
              target_root = (ROOT / SOURCE_DIR).resolve()
              target_app = target_root / 'app'
              donor_rel = (ROOT / 'donor-root.txt').read_text().strip()
              donor_root = (ROOT / donor_rel).resolve()
              donor_app = donor_root / 'app'
          
              rel_host1x = Path('src/main/cpp/skyline/soc/host1x.h')
              donor_host1x = donor_app / rel_host1x
              target_host1x = target_app / rel_host1x
              if not donor_host1x.is_file():
                  raise SystemExit(f'COMPILEFIX6: donor host1x ABI root missing: {donor_host1x}')
          
              target_host1x.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(donor_host1x, target_host1x)
          
              manifest = target_root / 'EMERALD_NVDEC_IMPORTED.txt'
              imported = [line.strip() for line in manifest.read_text().splitlines() if line.strip()]
              if rel_host1x.as_posix() not in imported:
                  imported.append(rel_host1x.as_posix())

              # COMPILEFIX6: the donor discovery also picked the full Strato
              # EmulationActivity because it contains NVDEC bridge markers.
              # That Activity belongs to a newer Android app architecture and
              # depends on AppSettings, which does not exist in pinned TEXMAN.
              # TEXMAN's manifest/namespace uses emu.skyline.EmulationActivity,
              # so keep only the narrow NvdecMediaCodec bridge and remove the
              # incompatible duplicate Activity from the donor import.
              donor_activity_rel = 'src/main/java/org/stratoemu/strato/EmulationActivity.kt'
              donor_activity = target_app / donor_activity_rel
              texman_activity = target_app / 'src/main/java/emu/skyline/EmulationActivity.kt'
              codec_bridge = target_app / 'src/main/java/org/stratoemu/strato/emulation/NvdecMediaCodec.kt'

              if not donor_activity.is_file():
                  raise SystemExit('COMPILEFIX6: expected donor Strato EmulationActivity was not imported')
              if not texman_activity.is_file():
                  raise SystemExit('COMPILEFIX6: TEXMAN emu.skyline.EmulationActivity is missing')
              if not codec_bridge.is_file():
                  raise SystemExit('COMPILEFIX6: NvdecMediaCodec bridge is missing')

              donor_activity.unlink()
              imported = [rel for rel in imported if rel != donor_activity_rel]
              manifest.write_text('\n'.join(imported) + '\n')

              texman_activity_text = texman_activity.read_text(errors='ignore')
              if 'PreferenceSettings' not in texman_activity_text:
                  raise SystemExit('COMPILEFIX6: TEXMAN Activity does not match expected PreferenceSettings architecture')
              if donor_activity.exists():
                  raise SystemExit('COMPILEFIX6: incompatible donor Activity still exists')
          
              replacements = {
                  'LOGENF': 'Logger::ErrorNoPrefix',
                  'LOGWNF': 'Logger::WarnNoPrefix',
                  'LOGINF': 'Logger::InfoNoPrefix',
                  'LOGDNF': 'Logger::DebugNoPrefix',
                  'LOGVNF': 'Logger::VerboseNoPrefix',
                  'LOGE': 'Logger::Error',
                  'LOGW': 'Logger::Warn',
                  'LOGI': 'Logger::Info',
                  'LOGD': 'Logger::Debug',
                  'LOGV': 'Logger::Verbose',
              }
              native_ext = {'.cpp', '.cc', '.c', '.h', '.hpp'}
              rewrite_count = 0
              for rel_s in imported:
                  rel = Path(rel_s)
                  path = target_app / rel
                  if not path.is_file() or path.suffix.lower() not in native_ext:
                      continue
                  data = path.read_text(errors='ignore')
                  data, n = re.subn(r'\bAsyncLogger::UpdateTag\s*\(\s*\)', 'Logger::UpdateTag()', data)
                  rewrite_count += n
                  for macro, logger_call in replacements.items():
                      data, n = re.subn(rf'\b{macro}\s*\(', logger_call + '(', data)
                      rewrite_count += n
                  path.write_text(data)
          
              command_fifo = target_app / 'src/main/cpp/skyline/soc/host1x/command_fifo.h'
              command_text = command_fifo.read_text(errors='ignore')
              host_text = target_host1x.read_text(errors='ignore')
          
              if 'VideoFrameQueue &videoFrames' in command_text:
                  if 'VideoFrameQueue' not in host_text or 'videoFrames' not in host_text:
                      raise SystemExit(
                          'COMPILEFIX6: command_fifo expects VideoFrameQueue but donor host1x.h does not own/pass it'
                      )
          
              leftovers: list[str] = []
              log_re = re.compile(r'\bLOG(?:E|W|I|D|V)(?:NF)?\s*\(')
              for rel_s in imported:
                  rel = Path(rel_s)
                  path = target_app / rel
                  if path.is_file() and path.suffix.lower() in native_ext:
                      if log_re.search(path.read_text(errors='ignore')):
                          leftovers.append(rel_s)
              if leftovers:
                  raise SystemExit('COMPILEFIX6: untranslated donor LOG macros remain: ' + ', '.join(leftovers))
          
              async_leftovers = []
              for rel_s in imported:
                  rel = Path(rel_s)
                  path = target_app / rel
                  if path.is_file() and path.suffix.lower() in native_ext:
                      if 'AsyncLogger::' in path.read_text(errors='ignore'):
                          async_leftovers.append(rel_s)
              if async_leftovers:
                  raise SystemExit('COMPILEFIX6: untranslated AsyncLogger references remain: ' + ', '.join(async_leftovers))

              # Emerald VIC uses the newer pitch-aware texture layout API.
              # Keep TEXMAN's texture manager intact and add a narrow bridge.
              layout_h = target_app / 'src/main/cpp/skyline/gpu/texture/layout.h'
              layout_cpp = target_app / 'src/main/cpp/skyline/gpu/texture/layout.cpp'
              lh = layout_h.read_text()
              lc = layout_cpp.read_text()

              pitch_decl = '''    void CopyPitchToBlockLinear(Dimensions dimensions,
                                       size_t formatBlockWidth, size_t formatBlockHeight, size_t formatBpb, u32 pitchAmount,
                                       size_t gobBlockHeight, size_t gobBlockDepth,
                                       u8 *pitch, u8 *blockLinear);
          
              '''
              if 'void CopyPitchToBlockLinear(Dimensions dimensions' not in lh:
                  decl_anchor = '    void CopyLinearToBlockLinear(const GuestTexture &guest, u8 *linear, u8 *blockLinear);\n'
                  if decl_anchor not in lh:
                      raise SystemExit('COMPILEFIX6: TEXMAN layout.h declaration anchor missing')
                  lh = lh.replace(decl_anchor, decl_anchor + '\n' + pitch_decl, 1)
                  layout_h.write_text(lh)

              pitch_impl = r'''
              void CopyPitchToBlockLinear(Dimensions dimensions,
                                size_t formatBlockWidth, size_t formatBlockHeight, size_t formatBpb, u32 pitchAmount,
                                size_t gobBlockHeight, size_t gobBlockDepth,
                                u8 *pitch, u8 *blockLinear) {
                  const size_t rowBytes{util::DivideCeil<size_t>(dimensions.width, formatBlockWidth) * formatBpb};
                  const size_t rows{util::DivideCeil<size_t>(dimensions.height, formatBlockHeight)};
                  const size_t sourcePitch{pitchAmount ? static_cast<size_t>(pitchAmount) : rowBytes};
          
                  if (sourcePitch == rowBytes) {
            CopyLinearToBlockLinear(
                dimensions,
                formatBlockWidth, formatBlockHeight, formatBpb,
                gobBlockHeight, gobBlockDepth,
                pitch, blockLinear
            );
            return;
                  }
          
                  std::vector<u8> tight(rowBytes * rows * dimensions.depth);
                  const size_t sourceSliceBytes{sourcePitch * rows};
                  const size_t tightSliceBytes{rowBytes * rows};
          
                  for (size_t z{}; z < dimensions.depth; ++z) {
            u8 *srcSlice{pitch + z * sourceSliceBytes};
            u8 *dstSlice{tight.data() + z * tightSliceBytes};
            for (size_t y{}; y < rows; ++y)
                std::memcpy(dstSlice + y * rowBytes, srcSlice + y * sourcePitch, rowBytes);
                  }
          
                  CopyLinearToBlockLinear(
            dimensions,
            formatBlockWidth, formatBlockHeight, formatBpb,
            gobBlockHeight, gobBlockDepth,
            tight.data(), blockLinear
                  );
              }
              '''
              if 'void CopyPitchToBlockLinear(Dimensions dimensions' not in lc:
                  ns_end = lc.rfind('\n}')
                  if ns_end == -1:
                      raise SystemExit('COMPILEFIX6: TEXMAN layout.cpp namespace end missing')
                  lc = lc[:ns_end] + '\n' + pitch_impl + lc[ns_end:]
                  layout_cpp.write_text(lc)

              final_lh = layout_h.read_text()
              final_lc = layout_cpp.read_text()
              if 'void CopyPitchToBlockLinear(Dimensions dimensions' not in final_lh:
                  raise SystemExit('COMPILEFIX6: VIC pitch bridge declaration missing')
              if 'sourcePitch' not in final_lc or 'tight.data()' not in final_lc:
                  raise SystemExit('COMPILEFIX6: VIC pitch bridge implementation missing')

              jvm = (target_app / 'src/main/cpp/skyline/jvm.cpp').read_text(errors='ignore')
              thi = (target_app / 'src/main/cpp/skyline/soc/host1x/tegra_host_interface.h').read_text(errors='ignore')
              for needle in ('Logger::Error(', 'Logger::Warn('):
                  if needle not in jvm:
                      raise SystemExit(f'COMPILEFIX6: jvm logging bridge verification failed: {needle}')
              for needle in ('Logger::Debug(', 'Logger::Verbose(', 'Logger::Error('):
                  if needle not in thi:
                      raise SystemExit(f'COMPILEFIX6: THI logging bridge verification failed: {needle}')
          
              command_cpp = (target_app / 'src/main/cpp/skyline/soc/host1x/command_fifo.cpp').read_text(errors='ignore')
              for needle in ('Logger::UpdateTag()', 'Logger::ErrorNoPrefix('):
                  if needle not in command_cpp:
                      raise SystemExit(f'COMPILEFIX6: command FIFO logger bridge verification failed: {needle}')

              print(f'[ES-CI] COMPILEFIX6 restored {rel_host1x}')
              print(f'[ES-CI] COMPILEFIX6 translated {rewrite_count} LOG* calls to TEXMAN Logger::*')
              print('[ES-CI] COMPILEFIX6 removed incompatible donor org.stratoemu.strato.EmulationActivity')
              print('[ES-CI] COMPILEFIX6 kept TEXMAN emu.skyline.EmulationActivity + NvdecMediaCodec bridge')
              print('[ES-CI] COMPILEFIX6 VideoFrameQueue ABI + logger + VIC pitch bridge verified')
          
          
          def append_provenance() -> None:
              provenance = ROOT / 'artifact/TEXMAN-PROVENANCE.txt'
              with provenance.open('a') as f:
                  f.write('CompileFix5: restored host1x ABI, translated newer logger API, and added TEXMAN-compatible VIC pitch-to-blocklinear bridge\n')
          
          
          def main() -> None:
              if not WORKFLOW.is_file():
                  raise SystemExit(f'Base workflow missing: {WORKFLOW}')
              steps = parse_run_steps(WORKFLOW)
              missing = [name for name in RUN_ORDER if name not in steps]
              if missing:
                  raise SystemExit('Base workflow run steps missing: ' + ', '.join(missing))
          
              for name in RUN_ORDER:
                  if name == 'Restore Emerald launcher icon assets':
                      apply_compilefix6()
                  workdir, script = steps[name]
                  run_step(name, workdir, script)
          
              append_provenance()
              print('\n[ES-CI] COMPILEFIX6 replay pipeline completed successfully')
          
          
          if __name__ == '__main__':
              main()
          PY

      - name: Upload v0.2.22 TEXMAN runtime-restored COMPILEFIX6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-v0.2.22-TEXMAN-ScanSafe-NVDEC-COMPILEFIX6-Action${{ github.run_number }}-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
