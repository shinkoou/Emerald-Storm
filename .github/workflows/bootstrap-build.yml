               */
              class EmeraldTextureManager {
                public:
                  enum class Writer : u8 {
                      None,
                      Cpu,
                      Gpu,
                  };

                  struct MappingRange {
                      uintptr_t begin{};
                      uintptr_t end{};
                  };

                  struct Record {
                      u64 id{};
                      std::vector<MappingRange> mappings;
                      texture::Dimensions dimensions{};
                      vk::Format format{vk::Format::eUndefined};
                      u32 tileMode{};
                      u32 layerCount{};
                      u32 mipLevelCount{};
                      u64 lastIova{};
                      u64 modificationTick{};
                      u64 cpuWriteCount{};
                      u64 gpuWriteCount{};
                      u64 sampledUseCount{};
                      u64 renderTargetUseCount{};
                      Writer lastWriter{Writer::None};
                      boost::container::small_vector<u64, 8> aliases;
                  };

                private:
                  std::mutex mutex;
                  std::unordered_map<u64, Record> records;
                  u64 modificationTick{};
                  u64 createEvents{};
                  u64 aliasEvents{};
                  u64 cpuWriteEvents{};
                  u64 gpuWriteEvents{};
                  u64 sampledEvents{};
                  u64 staleSampledEvents{};
                  u64 iovaChangeEvents{};

                  static const char *WriterName(Writer writer);
                  void PopulateRecordLocked(Record &record, const GuestTexture &guestTexture);
                  Record &EnsureRecordLocked(Texture &texture);
                  void AddAliasLocked(u64 lhs, u64 rhs);

                public:
                  void RegisterTexture(const std::shared_ptr<Texture> &texture,
                                       const GuestTexture &guestTexture,
                                       const boost::container::small_vector<std::shared_ptr<Texture>, 4> &overlaps);
                  void ObserveReplacement(Texture &oldTexture, Texture &newTexture, const char *reason);
