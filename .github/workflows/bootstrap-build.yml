          (root/'EMERALD_PHASE8_PROVENANCE.md').write_text('''# Emerald Storm v0.2.40 Phase8 provenance\n\nPhase8 is an original Emerald Storm diagnostic implementation built on the proven v0.2.39 Action #82 source.\n\nStorm 4 black-box battery:\n- global monotonic event id shared by texture, TextureManager, Fermi2D, DMA and presentation;\n- actual Android presented-frame counter;\n- stable TextureView ids;\n- per-texture content generations and last-writer classification;\n- first sample after every content generation;\n- render-target write epochs and RT -> shader-read barrier proof;\n- CPU upload fingerprint and GPU readback trace;\n- texture-to-texture copy trace;\n- exact TIC slot -> TextureView bind changes;\n- TextureManager full/layer-mip/create/replacement/overlap decisions;\n- Fermi2D source/destination IOVA + texture correlation;\n- Maxwell DMA source/destination IOVA + geometry + sequence correlation;\n- presented texture/view/generation on every frame.\n\nHeavy tracing remains gated to Storm 4 title ID `010084D00CF5E000`. No GPL reference source was copied.\n''')

