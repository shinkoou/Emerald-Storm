      - name: Verify CAM Phase4 and Full PT-BR
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          grep -Fn 'versionCode 46' app/build.gradle
          grep -Fn 'versionName "0.2.36-cam-phase4-eden-coherency-feedback-snapshot-ptbr"' app/build.gradle
          grep -Fn 'exactMappings' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -Fn 'ResolveNewestGpuAlias' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -Fn 'GetOrCreateFeedbackSnapshot' app/src/main/cpp/skyline/gpu/texture_manager.cpp
          grep -Fn 'SNAPSHOT-RESOLVE' app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          grep -Fn 'SNAPSHOT-COPY' app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          grep -Fn 'ResolveSampledFeedback' app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
          grep -Fn 'SetUpcomingRenderTargets' app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/maxwell_3d.cpp
          test -f app/src/main/res/values-pt-rBR/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          base_root = ET.parse('app/src/main/res/values/strings.xml').getroot()
          pt_root = ET.parse('app/src/main/res/values-pt-rBR/strings.xml').getroot()
          def entries(root):
              return {(node.tag, node.attrib.get('name')): ''.join(node.itertext())
                      for node in root if node.attrib.get('name')}
          base = entries(base_root)
          pt = entries(pt_root)
          translatable = {(node.tag, node.attrib['name']) for node in base_root
                          if node.attrib.get('name') and node.attrib.get('translatable', 'true') != 'false'}
          missing = sorted(translatable - set(pt))
          if missing:
              raise SystemExit('PT-BR missing resources: ' + repr(missing[:20]))
          if len(translatable) != 290:
              raise SystemExit(f'Unexpected translatable count: {len(translatable)}')
          placeholder = re.compile(r'%(?:\d+\$)?[-+#0 ,(]*\d*(?:\.\d+)?[a-zA-Z%]')
          bad = [key for key in translatable
                 if sorted(placeholder.findall(base[key])) != sorted(placeholder.findall(pt[key]))]
          if bad:
              raise SystemExit('PT-BR placeholder mismatch: ' + repr(bad[:20]))
          print('[ES-CI] Full PT-BR validated: 290/290 translatable resources')
          PY

      - name: CAM Phase4 safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          tm = Path('app/src/main/cpp/skyline/gpu/texture_manager.cpp').read_text()
          tmh = Path('app/src/main/cpp/skyline/gpu/texture_manager.h').read_text()
          tex = Path('app/src/main/cpp/skyline/gpu/texture/texture.cpp').read_text()
          exe = Path('app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp').read_text()
          exeh = Path('app/src/main/cpp/skyline/gpu/interconnect/command_executor.h').read_text()
          pipe = Path('app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc').read_text()
          mx = Path('app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/maxwell_3d.cpp').read_text()
          pm = Path('app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/pipeline_manager.cpp').read_text()
          joined = tm + tmh + tex + exe + exeh + pipe + mx + pm
          required = [
              (tm, 'EmeraldTextureManager::ResolveNewestGpuAlias', 1),
              (tm, 'EmeraldTextureManager::CommitAliasSynchronization', 1),
              (tm, 'EmeraldTextureManager::GetOrCreateFeedbackSnapshot', 1),
              (tex, 'Texture::CreateEmeraldFeedbackSnapshot', 1),
              (tex, 'Texture::RecordEmeraldImageCopy', 1),
              (exe, 'CommandExecutor::ResolveSampledFeedback', 1),
              (exe, 'CommandExecutor::NeedsFeedbackDescriptorRefresh', 1),
              (pipe, 'ctx.executor.ResolveSampledFeedback(texture);', 1),
              (mx, 'ctx.executor.SetUpcomingRenderTargets', 1),
          ]
          for body, marker, count in required:
              if body.count(marker) != count:
                  raise SystemExit(f'Phase4 marker count invalid: {marker}={body.count(marker)} expected={count}')
          for marker in ('exactMappings', 'alias.tileMode != record.tileMode',
                         'alias.mappings.size() == record.mappings.size()'):
              if marker not in tm:
                  raise SystemExit('Alias safety guard missing: ' + marker)
          forbidden = [
              'VK_EXT_attachment_feedback_loop_layout',
              'VK_IMAGE_USAGE_ATTACHMENT_FEEDBACK_LOOP_BIT_EXT',
              'PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT',
              'VK_IMAGE_LAYOUT_ATTACHMENT_FEEDBACK_LOOP_OPTIMAL_EXT',
              'EsMaterializeMultiMappingConstantBuffer',
              '[ES-CBUF4]',
          ]
          leaked = [marker for marker in forbidden if marker in joined]
          if leaked:
              raise SystemExit('Forbidden Phase4 behavior leaked: ' + ', '.join(leaked))
          if pm.count('stageDescInfo.constantBufferUsedSizes = stage.info.constant_buffer_used_sizes;') != 1:
              raise SystemExit('Phase2.5 CBuffer metadata propagation changed')
          if 'const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};' not in Path('app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp').read_text():
              raise SystemExit('Confirmed Fermi2D FlipY missing')
          print('[ES-CI] CAM Phase4 safety audit passed')
          print('[ES-CI] No blind partial-alias copy, no new Vulkan extension dependency, no rejected 64KiB CBuffer path')
          PY

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          cp EMERALD_PHASE4_PROVENANCE.md ../EMERALD_PHASE4_PROVENANCE.md

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE4_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
