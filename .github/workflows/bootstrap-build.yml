# Emerald Storm v0.2.42 Phase11 + UI Phase A
name: Emerald Storm v0.2.42 FIX1 CAM Phase11 Storm4 In-Subpass Feedback Barrier + UI Phase A + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase11-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.42-FIX1-CAM-Phase11-Storm4-InSubpass-Feedback-Barrier-UI-PhaseA-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V241_PHASE10_COMMIT: bb308016f64b73f05d4d263c32ce5b8ade7878f9
  V241_FIX5_COMMIT: d99d5e7e073c7c6aa61559f703625e6b5e353e3b
  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
  V239_COMMIT: ca15dc208beb65a61a163ecd1e44eb7148992797
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.42 Phase11 + UI Phase A
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.41 Phase10 FIX4 Action101 source exactly
        run: |
          set -euo pipefail
          git show "${V241_PHASE10_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v241-phase10-fix4.yml
          test -s /tmp/emerald-v241-phase10-fix4.yml
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<replay-phase10-fix4>', 'exec'))"

      - name: Apply CAM Phase11 in-subpass feedback barrier and Emerald UI Phase A
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase11-ui-phasea>', 'exec'))"

      - name: Verify CAM Phase11 and Emerald UI Phase A
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<verify-phase11-ui>', 'exec'))"

      - name: CAM Phase11 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<audit-phase11>', 'exec'))"

      - name: Phase11 prove generated correction before compilation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          echo "[ES-PHASE11] version:"
          grep -nE 'versionCode 52|0.2.42-cam-phase11' app/build.gradle
          echo "[ES-PHASE11] explicit in-subpass barrier:"
          grep -nF '[ES-S4-FEEDBACK-BARRIER]' app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          grep -nF 'esFeedbackBarrierPending = esAvoidedLegacyUsageSplit' app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          echo "[ES-PHASE11] framebuffer-space feedback dependencies:"
          grep -nF 'dependencies=2' app/src/main/cpp/skyline/gpu/interconnect/command_nodes.cpp
          echo "[ES-UI-PHASEA] Emerald settings style:"
          grep -nF 'class EmeraldPreferenceDecoration' app/src/main/java/org/stratoemu/strato/settings/EmeraldSettingsStyle.kt
          grep -nF 'applyEmeraldSettingsStyle(view)' app/src/main/java/org/stratoemu/strato/settings/GlobalSettingsFragment.kt
          grep -nF 'applyEmeraldSettingsStyle(view)' app/src/main/java/org/stratoemu/strato/settings/GameSettingsFragment.kt
          echo "[ES-PHASE11] generated correction proof passed"

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          for provenance in             EMERALD_PHASE5_PROVENANCE.md             EMERALD_PHASE6_PROVENANCE.md             EMERALD_PHASE7_PROVENANCE.md             EMERALD_PHASE8_PROVENANCE.md             EMERALD_PHASE9_PROVENANCE.md             EMERALD_PHASE10_PROVENANCE.md             EMERALD_PHASE11_PROVENANCE.md             EMERALD_UI_PHASEA_PROVENANCE.md; do
            test -f "$provenance"
            cp "$provenance" "../$provenance"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
            EMERALD_PHASE8_PROVENANCE.md
            EMERALD_PHASE9_PROVENANCE.md
            EMERALD_PHASE10_PROVENANCE.md
            EMERALD_PHASE11_PROVENANCE.md
            EMERALD_UI_PHASEA_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
