                          continue;
          
                      auto texture{view->texture};
                      Texture *texturePtr{texture.get()};
                      if (ranges::find(esRenderTargetTextures, texturePtr) != esRenderTargetTextures.end())
                          continue;
          
                      // Preserve ordering against an older GPU version before this execution takes ownership.
                      if (texture->cycle && texture->cycle != cycle)
                          cycle->ChainCycle(texture->cycle);
          
                      auto stagingBuffer{texture->BeginRenderTargetUse()};
                      texture->cycle = cycle;
                      texture->MarkGpuDirty(usageTracker);
                      esRenderTargetTextures.emplace_back(texturePtr);
          
                      if (stagingBuffer) {
                          AddOutsideRpCommand([texture = std::move(texture), stagingBuffer = std::move(stagingBuffer)](
                                                  vk::raii::CommandBuffer &commandBuffer,
                                                  const std::shared_ptr<FenceCycle> &cycle,
                                                  GPU &) {
                              texture->RecordRenderTargetPreload(commandBuffer, stagingBuffer);
                              cycle->AttachObjects(texture, stagingBuffer);
                          });
                      }
                  }
              }
          
              void CommandExecutor::PrepareSampledTexturesAtUse(span<TextureView *> sampledImages) {
          '''
          if anchor not in t:
              raise SystemExit('command_executor.cpp v0.2.16 helper insertion anchor missing')
          t = t.replace(anchor, helper, 1)
          
          # Normal subpass: GPU-write ownership must be established before sampled sync so feedback/RT reuse
          # cannot be mistaken for CPU-authoritative data.
          old = '''        PrepareSampledTexturesAtUse(sampledImages);\n\n        bool gotoNext{CreateRenderPassWithSubpass(renderArea, sampledImages, inputAttachments, colorAttachments, depthStencilAttachment ? &*depthStencilAttachment : nullptr, noSubpassCreation, srcStageMask, dstStageMask)};\n'''
          new = '''        PrepareRenderTargetsAtUse(colorAttachments, depthStencilAttachment);\n        PrepareSampledTexturesAtUse(sampledImages);\n\n        bool gotoNext{CreateRenderPassWithSubpass(renderArea, sampledImages, inputAttachments, colorAttachments, depthStencilAttachment ? &*depthStencilAttachment : nullptr, noSubpassCreation, srcStageMask, dstStageMask)};\n'''
          if old not in t:
              raise SystemExit('AddSubpass v0.2.16 call anchor missing')
          t = t.replace(old, new, 1)
          
          # Clear paths bypass AddSubpass, so establish GPU ownership there too.
          old = '''    void CommandExecutor::AddClearColorSubpass(TextureView *attachment, const vk::ClearColorValue &value) {\n        bool gotoNext{CreateRenderPassWithSubpass(vk::Rect2D{.extent = attachment->texture->dimensions}, {}, {}, attachment, nullptr)};\n'''
          new = '''    void CommandExecutor::AddClearColorSubpass(TextureView *attachment, const vk::ClearColorValue &value) {\n        PrepareRenderTargetsAtUse(span<TextureView *>(attachment), nullptr);\n        bool gotoNext{CreateRenderPassWithSubpass(vk::Rect2D{.extent = attachment->texture->dimensions}, {}, {}, attachment, nullptr)};\n'''
          if old not in t:
              raise SystemExit('clear color v0.2.16 anchor missing')
          t = t.replace(old, new, 1)
          
          old = '''    void CommandExecutor::AddClearDepthStencilSubpass(TextureView *attachment, const vk::ClearDepthStencilValue &value) {\n        bool gotoNext{CreateRenderPassWithSubpass(vk::Rect2D{.extent = attachment->texture->dimensions}, {}, {}, {}, attachment)};\n'''
          new = '''    void CommandExecutor::AddClearDepthStencilSubpass(TextureView *attachment, const vk::ClearDepthStencilValue &value) {\n        PrepareRenderTargetsAtUse({}, attachment);\n        bool gotoNext{CreateRenderPassWithSubpass(vk::Rect2D{.extent = attachment->texture->dimensions}, {}, {}, {}, attachment)};\n'''
          if old not in t:
              raise SystemExit('clear depth v0.2.16 anchor missing')
          t = t.replace(old, new, 1)
          
          pc.write_text(t)
          
          # 5) Version bump from the v0.2.15 tree.
          gradle = root/'app/build.gradle'
          t = gradle.read_text()
          t, n1 = re.subn(r'versionCode\s+25\b', 'versionCode 26', t, count=1)
          t, n2 = re.subn(r'versionName\s+"0\.2\.15-storm4-texture-use-point-synchronization-alpha1"',
                           'versionName "0.2.16-storm4-render-target-use-point-coherency-alpha1"', t, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'version patch failed {n1=} {n2=}')
          gradle.write_text(t)
          
          print('v0.2.16 Render Target Use-Point Coherency patch applied')
          PY

      - name: Verify render-target use-point coherency
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          grep -n "BeginRenderTargetUse" app/src/main/cpp/skyline/gpu/texture/texture.h
          grep -n "std::unique_lock stateLock{stateMutex}" app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -n "\[ES-RTOWN\] GPU ownership armed at render-target use" app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -n "PrepareRenderTargetsAtUse(colorAttachments, depthStencilAttachment)" app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          grep -n "versionCode 26" app/build.gradle
          grep -n 'versionName "0.2.16-storm4-render-target-use-point-coherency-alpha1"' app/build.gradle

      - name: Apply image-specific RT-to-sampled barrier
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          root = Path('.')
          
          # 1) Track shader stages that need an image-specific write-to-read barrier.
          p = root/'app/src/main/cpp/skyline/gpu/texture/texture.h'
          t = p.read_text()
          anchor = '        vk::PipelineStageFlags readStageMask{}; //!< Set of pipeline stages that this texture has been read in since it was last used as an RT\n'
          if anchor not in t:
              raise SystemExit('texture.h state anchor missing')
          t = t.replace(anchor, anchor + '        vk::PipelineStageFlags queuedImageReadBarrierDstStageMask{}; //!< Shader stages requiring an image-specific RT-write -> sampled-read barrier\n', 1)
          
          anchor = """        vk::PipelineStageFlags GetReadStageMask();
          
                  /**
                   * @brief Populates the input src and dst stage masks with appropriate read barrier parameters for the current texture state
          """
          patch = """        vk::PipelineStageFlags GetReadStageMask();
          
                  /**
                   * @brief Consumes shader stages queued by PopulateReadBarrier for an image-specific RT-write -> sampled-read barrier.
                   */
                  vk::PipelineStageFlags ConsumeImageReadBarrierStages();
          
                  /**
                   * @brief Records an image-specific write-to-read barrier for a texture whose latest authoritative contents came from a render target.
                   */
                  void RecordRenderTargetToSampledBarrier(const vk::raii::CommandBuffer &commandBuffer, vk::PipelineStageFlags dstStageMask);
          
                  /**
                   * @brief Populates the input src and dst stage masks with appropriate read barrier parameters for the current texture state
          """
          if anchor not in t:
              raise SystemExit('texture.h method anchor missing')
          t = t.replace(anchor, patch, 1)
          p.write_text(t)
          
          # 2) Queue the exact sampled shader stage when the existing RT read-barrier tracker fires,
          #    then expose an image-specific Vulkan barrier recorder.
          p = root/'app/src/main/cpp/skyline/gpu/texture/texture.cpp'
          t = p.read_text()
          old = """        if (renderPassUsage == texture::RenderPassUsage::RenderTarget) {
                      everUsedAsRt = true;
                      pendingStageMask = vk::PipelineStageFlagBits::eVertexShader |
          """
          new = """        if (renderPassUsage == texture::RenderPassUsage::RenderTarget) {
                      everUsedAsRt = true;
                      queuedImageReadBarrierDstStageMask = {};
                      pendingStageMask = vk::PipelineStageFlagBits::eVertexShader |
          """
          if old not in t:
              raise SystemExit('RT state anchor missing')
          t = t.replace(old, new, 1)
          
          old = """        } else if (renderPassUsage == texture::RenderPassUsage::None) {
                      pendingStageMask = {};
                      readStageMask = {};
          """
          new = """        } else if (renderPassUsage == texture::RenderPassUsage::None) {
                      pendingStageMask = {};
                      readStageMask = {};
                      queuedImageReadBarrierDstStageMask = {};
          """
          if old not in t:
              raise SystemExit('None state anchor missing')
          t = t.replace(old, new, 1)
          
          old = """        pendingStageMask &= ~dstStage;
                  dstStageMask |= dstStage;
              }
          }
          """
          new = """        pendingStageMask &= ~dstStage;
                  dstStageMask |= dstStage;
          
                  // Emerald Storm v0.2.17: preserve the exact shader stage for a per-image
                  // RT-write -> sampled-read barrier, while keeping the original aggregate barrier too.
                  queuedImageReadBarrierDstStageMask |= dstStage;
              }
          
              vk::PipelineStageFlags Texture::ConsumeImageReadBarrierStages() {
                  return std::exchange(queuedImageReadBarrierDstStageMask, vk::PipelineStageFlags{});
              }
          
              void Texture::RecordRenderTargetToSampledBarrier(const vk::raii::CommandBuffer &commandBuffer, vk::PipelineStageFlags dstStageMask) {
                  if (!dstStageMask)
                      return;
          
                  const bool depthStencil{static_cast<bool>(format->vkAspect & (vk::ImageAspectFlagBits::eDepth | vk::ImageAspectFlagBits::eStencil))};
                  const vk::PipelineStageFlags srcStageMask = depthStencil
                      ? vk::PipelineStageFlags{vk::PipelineStageFlagBits::eEarlyFragmentTests | vk::PipelineStageFlagBits::eLateFragmentTests}
                      : vk::PipelineStageFlags{vk::PipelineStageFlagBits::eColorAttachmentOutput};
                  const vk::AccessFlags srcAccessMask = depthStencil
                      ? vk::AccessFlags{vk::AccessFlagBits::eDepthStencilAttachmentWrite}
                      : vk::AccessFlags{vk::AccessFlagBits::eColorAttachmentWrite};
          
                  commandBuffer.pipelineBarrier(
                      srcStageMask,
                      dstStageMask,
                      {}, {}, {},
                      vk::ImageMemoryBarrier{
                          .srcAccessMask = srcAccessMask,
                          .dstAccessMask = vk::AccessFlagBits::eShaderRead,
                          .oldLayout = layout,
                          .newLayout = layout,
                          .srcQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED,
                          .dstQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED,
                          .image = GetBacking(),
                          .subresourceRange = {
                              .aspectMask = format->vkAspect,
                              .levelCount = levelCount,
                              .layerCount = layerCount,
                          },
                      }
                  );
              }
          }
          """
          if old not in t:
              raise SystemExit('PopulateReadBarrier tail anchor missing')
          t = t.replace(old, new, 1)
          p.write_text(t)
          
          # 3) Consume the queued transition at the exact sampled-image use point.
          #    AddOutsideRpCommand naturally ends the previous render pass before recording the image barrier.
          p = root/'app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp'
          t = p.read_text()
          needle = """            auto texture{view->texture};
                      Texture *texturePtr{texture.get()};
                      if (ranges::find(preparedThisUse, texturePtr) != preparedThisUse.end())
                          continue;
                      preparedThisUse.emplace_back(texturePtr);
          
                      // If this same backing has already been written as a render target in the pending
                      // command stream, guest CPU memory is not necessarily the authoritative source.
          """
          replacement = """            auto texture{view->texture};
                      Texture *texturePtr{texture.get()};
                      if (ranges::find(preparedThisUse, texturePtr) != preparedThisUse.end())
                          continue;
                      preparedThisUse.emplace_back(texturePtr);
          
                      // Ryujinx's Vulkan backend queues an image-specific write-to-read barrier when a
                      // render-target texture is rebound for shader reading. Strato only carries a broad
                      // MemoryBarrier through RenderPassNode. Keep that existing dependency, but add the
                      // per-image visibility barrier at this exact sampled use.
                      const vk::PipelineStageFlags imageReadBarrierStages{texture->ConsumeImageReadBarrierStages()};
                      if (imageReadBarrierStages && texture->GetDebugDirtyState() == 2) {
                          if (texture->cycle && texture->cycle != cycle)
                              cycle->ChainCycle(texture->cycle);
                          texture->cycle = cycle;
          
                          static std::atomic<u64> esTextureBarrierCount{};
                          const u64 occurrence{esTextureBarrierCount.fetch_add(1, std::memory_order_relaxed) + 1};
                          if (occurrence <= 128 || (occurrence % 4096) == 0)
                              LOGI("[ES-TEXBARRIER] RT write -> sampled read image barrier: tex=#{} dstStage=0x{:X} dirty={} occurrence #{}",
                                   texture->debugId, static_cast<VkPipelineStageFlags>(imageReadBarrierStages),
                                   texture->GetDebugDirtyState(), occurrence);
          
                          AddOutsideRpCommand([texture, imageReadBarrierStages](
                                                  vk::raii::CommandBuffer &commandBuffer,
                                                  const std::shared_ptr<FenceCycle> &cycle,
                                                  GPU &) {
                              texture->RecordRenderTargetToSampledBarrier(commandBuffer, imageReadBarrierStages);
                              cycle->AttachObject(texture);
                          });
                      }
          
                      // If this same backing has already been written as a render target in the pending
                      // command stream, guest CPU memory is not necessarily the authoritative source.
          """
          if needle not in t:
              raise SystemExit('PrepareSampledTexturesAtUse anchor missing')
          t = t.replace(needle, replacement, 1)
          p.write_text(t)
          
          # 4) Version.
          p = root/'app/build.gradle'
          t = p.read_text()
          t, n1 = re.subn(r'versionCode\s+26\b', 'versionCode 27', t, count=1)
          t, n2 = re.subn(r'versionName\s+"0\.2\.16-storm4-render-target-use-point-coherency-alpha1"',
                           'versionName "0.2.17-storm4-image-write-to-read-barrier-alpha1"', t, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'version patch failed {n1=} {n2=}')
          p.write_text(t)
          
          print('v0.2.17 Image Write-to-Read Barrier patch applied')
          PY

      - name: Verify image-specific RT-to-sampled barrier
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          grep -n "queuedImageReadBarrierDstStageMask" app/src/main/cpp/skyline/gpu/texture/texture.h
          grep -n "RecordRenderTargetToSampledBarrier" app/src/main/cpp/skyline/gpu/texture/texture.cpp
          grep -n "\[ES-TEXBARRIER\] RT write -> sampled read image barrier" app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          grep -n "versionCode 27" app/build.gradle
          grep -n 'versionName "0.2.17-storm4-image-write-to-read-barrier-alpha1"' app/build.gradle
          ! grep -R "ES-FRAGSTAGE" -n app/src/main/cpp/skyline/gpu
          ! grep -R "ES-VBSYNC" -n app/src/main/cpp/skyline/gpu

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"

      - name: Upload APK (attempt 1)
        id: upload_apk_primary
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload APK (retry after artifact-service failure)
        if: steps.upload_apk_primary.outcome == 'failure'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64-Retry1
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
