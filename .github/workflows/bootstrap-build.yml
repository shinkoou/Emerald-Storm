name: Emerald Storm v0.2.8 Storm 4 Constant Buffer Split Compatibility

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.8-Storm4-Constant-Buffer-Split-Compatibility
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0

jobs:
  android:
    name: Build Emerald Storm v0.2.8 Storm 4 Constant Buffer Split Compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Emerald Storm source
        run: |
          rm -rf "$ES_SOURCE_DIR"
          unzip -q EmeraldStorm-v0.1.0-Baseline-Source.zip
          test -f "$ES_SOURCE_DIR/gradlew"
          test -f "$ES_SOURCE_DIR/app/build.gradle"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache unzip

      - name: Restore pinned Strato dependencies
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          chmod +x scripts/hydrate_submodules.sh
          ./scripts/hydrate_submodules.sh

      - name: Apply Storm 4 Fermi2D FlipY fix
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp")
          text = source.read_text()

          anchor = '        executor.AddCheckpoint("Before blit");\n'
          injection = (
              '        // Emerald Storm: Fermi2D negative-Y correction.\n'
              '        // srcRect.height already contains dvDy, so passing a negative dvDy again\n'
              '        // into BlitHelperShader cancels the requested Y flip. Preserve the sign\n'
              '        // exactly once by making only the helper multiplier positive.\n'
              '        const float esHelperScaleY{dvDy < 0.0f ? -dvDy : dvDy};\n'
              '\n'
          )

          if "esHelperScaleY" not in text:
              if anchor not in text:
                  raise SystemExit("Fermi2D checkpoint anchor not found")
              text = text.replace(anchor, injection + anchor, 1)

          call_pattern = (
              r'(srcGuestTexture\.dimensions,\s*dstGuestTexture\.dimensions,\s*\n'
              r'\s*duDx,\s*)dvDy(,)'
          )
          text, call_count = re.subn(
              call_pattern,
              r'\1esHelperScaleY\2',
              text,
              count=1
          )
          if call_count != 1:
              raise SystemExit(f"Fermi2D helper scale patch failed: matches={call_count}")
          source.write_text(text)

          gradle = Path("app/build.gradle")
          gtext = gradle.read_text()
          gtext, code_count = re.subn(r"versionCode\s+14\b", "versionCode 18", gtext, count=1)
          gtext, name_count = re.subn(r'versionName\s+"0\.2\.4-performance-hud-simple-alpha1"',
                                      'versionName "0.2.8-storm4-constant-buffer-split-compatibility-alpha1"',
                                      gtext,
                                      count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Version patch failed: versionCode={code_count}, versionName={name_count}")
          gradle.write_text(gtext)

          print("Storm 4 Fermi2D FlipY fix applied")
          print("Positive-Y behaviour remains unchanged")
          print("Version set to 0.2.8-storm4-constant-buffer-split-compatibility-alpha1 (18)")
          PY

      - name: Verify Storm 4 Fermi2D FlipY fix
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          grep -n "esHelperScaleY" app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp
          grep -n "duDx, esHelperScaleY" app/src/main/cpp/skyline/gpu/interconnect/fermi_2d.cpp
          grep -n "versionCode 18" app/build.gradle
          grep -n 'versionName "0.2.8-storm4-constant-buffer-split-compatibility-alpha1"' app/build.gradle


      - name: Apply TIC mapping stabilization
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("app/src/main/cpp/skyline/gpu/interconnect/common/textures.h")
          htext = header.read_text()

          cache_anchor = '        std::vector<CacheEntry> textureHeaderCache;\n'
          stable_decl = (
              '\n'
              '        struct StableTextureEntry {\n'
              '            std::shared_ptr<TextureView> view{};\n'
              '            u64 iova{};\n'
              '            size_t bytes{};\n'
              '            texture::Dimensions dimensions{};\n'
              '            texture::Format format{};\n'
              '            texture::TileConfig tileConfig{};\n'
              '            vk::ImageViewType viewType{};\n'
              '            u32 baseArrayLayer{};\n'
              '            u32 layerCount{};\n'
              '            u32 mipLevelCount{};\n'
              '            u32 viewMipBase{};\n'
              '            u32 viewMipCount{};\n'
              '            vk::ComponentMapping swizzle{};\n'
              '            vk::ImageAspectFlags aspect{};\n'
              '            u64 sequenceNumber{};\n'
              '        };\n'
              '        std::vector<StableTextureEntry> stableTextureCache;\n'
          )

          if 'stableTextureCache' not in htext:
              if cache_anchor not in htext:
                  raise SystemExit("Texture cache declaration anchor not found")
              htext = htext.replace(cache_anchor, cache_anchor + stable_decl, 1)
          header.write_text(htext)

          source = Path("app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp")
          text = source.read_text()

          resize_anchor = (
              '            textureHeaderCache.resize(textureHeaders.size());\n'
              '            std::fill(textureHeaderCache.begin(), textureHeaderCache.end(), CacheEntry{});\n'
          )
          resize_patch = resize_anchor + (
              '            // Preserve existing per-slot stable views when possible. New slots default empty.\n'
              '            stableTextureCache.resize(textureHeaders.size());\n'
          )
          if 'stableTextureCache.resize(textureHeaders.size())' not in text:
              if resize_anchor not in text:
                  raise SystemExit("Texture cache resize anchor not found")
              text = text.replace(resize_anchor, resize_patch, 1)

          fallback_anchor = (
              '                if (!nullTextureView)\n'
              '                    nullTextureView = CreateNullTexture(ctx);\n'
              '\n'
              '                textureHeaderCache[index] = {textureHeader, nullTextureView.get(), ctx.channelCtx.channelSequenceNumber, true};\n'
              '                return nullTextureView.get();\n'
          )
          fallback_patch = (
              '                // Emerald Storm v0.2.7: bridge short-lived mapping gaps with the last\n'
              '                // known-good view from the same TIC slot. Reuse is allowed only when\n'
              '                // the backing address, size and view-critical properties still match.\n'
              '                // Mark it transient so GMMU translation is retried on the next sequence.\n'
              '                auto &stable{stableTextureCache[index]};\n'
              '                constexpr u64 StableSequenceWindow{64};\n'
              '                const u64 currentSequence{ctx.channelCtx.channelSequenceNumber};\n'
              '                const bool stableRecent{stable.view && currentSequence >= stable.sequenceNumber &&\n'
              '                                        (currentSequence - stable.sequenceNumber) <= StableSequenceWindow};\n'
              '                const bool stableCompatible{\n'
              '                    stableRecent && !stable.view->texture->replaced &&\n'
              '                    stable.iova == textureHeader.Iova() &&\n'
              '                    stable.bytes == guest.GetSize() &&\n'
              '                    stable.dimensions == guest.dimensions &&\n'
              '                    stable.format == guest.format &&\n'
              '                    stable.tileConfig == guest.tileConfig &&\n'
              '                    stable.viewType == guest.viewType &&\n'
              '                    stable.baseArrayLayer == guest.baseArrayLayer &&\n'
              '                    stable.layerCount == guest.layerCount &&\n'
              '                    stable.mipLevelCount == guest.mipLevelCount &&\n'
              '                    stable.viewMipBase == guest.viewMipBase &&\n'
              '                    stable.viewMipCount == guest.viewMipCount &&\n'
              '                    stable.swizzle == guest.swizzle &&\n'
              '                    stable.aspect == guest.aspect\n'
              '                };\n'
              '\n'
              '                if (stableCompatible) {\n'
              '                    static std::atomic<u64> stableReuseOccurrences{0};\n'
              '                    const u64 reuseOccurrence{stableReuseOccurrences.fetch_add(1, std::memory_order_relaxed) + 1};\n'
              '                    if (reuseOccurrence <= 8 || (reuseOccurrence % 4096) == 0) {\n'
              '                        LOGI("[ES-GPU] Reusing last-known-good TIC during transient mapping gap: index={}, iova=0x{:X}, bytes=0x{:X}, age={} sequences, occurrence #{}",\n'
              '                             index, textureHeader.Iova(), guest.GetSize(), currentSequence - stable.sequenceNumber, reuseOccurrence);\n'
              '                    }\n'
              '                    textureHeaderCache[index] = {textureHeader, stable.view.get(), currentSequence, true};\n'
              '                    return stable.view.get();\n'
              '                }\n'
              '\n'
          ) + fallback_anchor

          if 'Reusing last-known-good TIC during transient mapping gap' not in text:
              if fallback_anchor not in text:
                  raise SystemExit("Transient null fallback anchor not found")
              text = text.replace(fallback_anchor, fallback_patch, 1)

          store_anchor = '            texture = ctx.gpu.texture.FindOrCreate(guest, ctx.executor.tag);\n'
          store_patch = store_anchor + (
              '            stableTextureCache[index] = {\n'
              '                texture,\n'
              '                textureHeader.Iova(),\n'
              '                guest.GetSize(),\n'
              '                guest.dimensions,\n'
              '                guest.format,\n'
              '                guest.tileConfig,\n'
              '                guest.viewType,\n'
              '                guest.baseArrayLayer,\n'
              '                guest.layerCount,\n'
              '                guest.mipLevelCount,\n'
              '                guest.viewMipBase,\n'
              '                guest.viewMipCount,\n'
              '                guest.swizzle,\n'
              '                guest.aspect,\n'
              '                ctx.channelCtx.channelSequenceNumber\n'
              '            };\n'
          )
          if 'stableTextureCache[index] = {' not in text:
              if store_anchor not in text:
                  raise SystemExit("Valid texture store anchor not found")
              text = text.replace(store_anchor, store_patch, 1)

          source.write_text(text)
          print("TIC mapping stabilization applied")
          print("Stable fallback window: 64 channel sequences")
          PY

      - name: Verify TIC mapping stabilization
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          grep -n "stableTextureCache" app/src/main/cpp/skyline/gpu/interconnect/common/textures.h
          grep -n "StableSequenceWindow{64}" app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp
          grep -n "Reusing last-known-good TIC during transient mapping gap" app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp
          grep -n "stableTextureCache\\[index\\] = {" app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp

      - name: Apply constant buffer split compatibility
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("app/src/main/cpp/skyline/gpu/interconnect/common/common.h")
          htext = header.read_text()
          old_decl = '        void Update(InterconnectContext &ctx, u64 address, u64 size, bool splitMappingWarn = true);\n'
          new_decl = '        void Update(InterconnectContext &ctx, u64 address, u64 size, bool splitMappingWarn = true, bool coalesceSplitMapping = true);\n'
          if old_decl not in htext:
              raise SystemExit("CachedMappedBufferView::Update declaration anchor not found")
          htext = htext.replace(old_decl, new_decl, 1)
          header.write_text(htext)

          source = Path("app/src/main/cpp/skyline/gpu/interconnect/common/common.cpp")
          text = source.read_text()
          old_signature = '    void CachedMappedBufferView::Update(InterconnectContext &ctx, u64 address, u64 size, bool splitMappingWarn) {\n'
          new_signature = '    void CachedMappedBufferView::Update(InterconnectContext &ctx, u64 address, u64 size, bool splitMappingWarn, bool coalesceSplitMapping) {\n'
          if old_signature not in text:
              raise SystemExit("CachedMappedBufferView::Update definition anchor not found")
          text = text.replace(old_signature, new_signature, 1)

          split_anchor = '        if (fullMapping.size() < size) {\n'
          split_patch = (
              '        // Emerald Storm v0.2.8: Constant-buffer selectors commonly request the default\\n'
              '        // 0x10000-byte window even when the first underlying GMMU mapping is smaller.\\n'
              '        // For that caller we intentionally keep Strato\'s conservative first-region\\n'
              '        // behavior instead of coalescing adjacent mappings. Other buffer paths retain\\n'
              '        // the Alpha3 contiguous-split coalescing optimization.\\n'
              '        if (fullMapping.size() < size && !coalesceSplitMapping) {\\n'
              '            static std::atomic<u64> conservativeConstantBufferSplitCount{};\\n'
              '            const u64 occurrence{conservativeConstantBufferSplitCount.fetch_add(1, std::memory_order_relaxed) + 1};\\n'
              '            if (occurrence <= 8 || (occurrence % 4096) == 0) {\\n'
              '                LOGI("[ES-GPU] Constant buffer split using conservative first-region mapping: iova=0x{:X}, requested=0x{:X}, first=0x{:X}, occurrence #{}",\\n'
              '                     address, size, fullMapping.size(), occurrence);\\n'
              '            }\\n'
              '        }\\n'
              '\\n'
              '        if (fullMapping.size() < size && coalesceSplitMapping) {\\n'
          ).replace('\\n', '\n')
          if split_anchor not in text:
              raise SystemExit("Split mapping branch anchor not found")
          text = text.replace(split_anchor, split_patch, 1)
          source.write_text(text)

          cbuf = Path("app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/constant_buffers.cpp")
          ctext = cbuf.read_text()
          old_flush = '        view.Update(ctx, selector.address, std::max<size_t>(minSize, selector.size), false);\n'
          new_flush = '        view.Update(ctx, selector.address, std::max<size_t>(minSize, selector.size), false, false);\n'
          old_refresh = '            view.Update(ctx, selector.address, selectorMinSize, false);\n'
          new_refresh = '            view.Update(ctx, selector.address, selectorMinSize, false, false);\n'
          if old_flush not in ctext or old_refresh not in ctext:
              raise SystemExit("Constant buffer selector Update anchors not found")
          ctext = ctext.replace(old_flush, new_flush, 1)
          ctext = ctext.replace(old_refresh, new_refresh, 1)
          cbuf.write_text(ctext)

          print("Constant buffer split compatibility applied")
          print("Constant-buffer selector: coalescing disabled, conservative first-region fallback restored")
          print("All other buffer paths: Alpha3 contiguous split coalescing preserved")
          PY

      - name: Verify constant buffer split compatibility
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          grep -n "bool coalesceSplitMapping = true" app/src/main/cpp/skyline/gpu/interconnect/common/common.h
          grep -n "bool splitMappingWarn, bool coalesceSplitMapping" app/src/main/cpp/skyline/gpu/interconnect/common/common.cpp
          grep -n "Constant buffer split using conservative first-region mapping" app/src/main/cpp/skyline/gpu/interconnect/common/common.cpp
          grep -n "fullMapping.size() < size && coalesceSplitMapping" app/src/main/cpp/skyline/gpu/interconnect/common/common.cpp
          grep -n "selector.size), false, false" app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/constant_buffers.cpp
          grep -n "selectorMinSize, false, false" app/src/main/cpp/skyline/gpu/interconnect/maxwell_3d/constant_buffers.cpp

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
