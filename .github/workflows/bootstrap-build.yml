          grep -nF 'return false;' app/src/main/cpp/skyline/gpu/interconnect/common/textures.cpp
          grep -nF 'static constexpr u32 Version{5}' app/src/main/cpp/skyline/gpu/pipeline_cache_manager.cpp
          test -f EMERALD_RECOVERY_R1_PROVENANCE.md
          test -f EMERALD_STRUCTURAL_AUDIT_00.md
          test ! -f app/src/main/res/xml/emerald_settings_hub.xml
          ! grep -RniE 'ES-GUEST-BRIDGE|BuildGpuGuestBridgePlan|ExecuteGpuGuestBridge|GPU-RANGE-OWNER|RANGE-OWNER-PARTIAL' \
            app/src/main/cpp/skyline/gpu/texture_manager.* \
            app/src/main/cpp/skyline/gpu/texture/texture.*
          ! grep -RniF 'emerald_settings_section' app/src/main/java/org/stratoemu/strato/settings
          echo '[ES-RECOVERY-R1] recovery verification passed'

      - name: Prepare Recovery R1 exact source snapshot
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          SNAP_DIR="../recovery-r1-source-snapshot"
          OUT="../EmeraldStorm-${ES_VERSION}-Source-Action${GITHUB_RUN_NUMBER}.tar.gz"
          rm -rf "$SNAP_DIR"
          mkdir -p "$SNAP_DIR"
          required=(
            app/build.gradle
            app/src/main/cpp/skyline/gpu/pipeline_cache_manager.cpp
            app/src/main/cpp/skyline/gpu/shader_manager.h
            app/src/main/cpp/skyline/gpu/shader_manager.cpp
