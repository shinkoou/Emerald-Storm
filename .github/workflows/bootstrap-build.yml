                  }

                  for (const auto &overlap : overlaps) {
                      if (!overlap || overlap->debugId == texture->debugId)
                          continue;
                      const auto &oldRecord{records.at(overlap->debugId)};

                      size_t intersectionBytes{};
                      for (const auto &lhs : record.mappings) {
