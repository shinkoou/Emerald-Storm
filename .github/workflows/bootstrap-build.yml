          g = gradle.read_text()
          g, n_code = re.subn(r'versionCode\s+33\b', 'versionCode 34', g, count=1)
          g, n_name = re.subn(
              r'versionName\s+"0\.2\.23-emerald-texture-manager-phase0-diagnostics"',
