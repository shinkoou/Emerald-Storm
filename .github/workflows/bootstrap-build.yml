              r'            #define LOAD_CONSTANT_BUFFER_CALLBACKS\(z, index, data_\).*?\n'
              r'            BOOST_PP_REPEAT\(16, LOAD_CONSTANT_BUFFER_CALLBACKS, 0\)\n'
