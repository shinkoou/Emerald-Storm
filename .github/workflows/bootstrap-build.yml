          for key in ['use_asynchronous_shaders','anisotropy_mode','dma_accuracy','vram_usage_mode']:
              if key not in prefs: raise SystemExit('graphics setting missing: '+key)
          for token in ['var anisotropyMode : Int','var dmaAccuracy : Int','pref.vramUsageMode == 1']:
              if token not in native: raise SystemExit('Phase6 NativeSettings plumbing missing: '+token)
          unsafe='if (cached.sequenceNumber == ctx.channelCtx.channelSequenceNumber)\n                return cached.view;'
