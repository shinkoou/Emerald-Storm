            app/src/main/res/drawable/emerald_game_overlay.xml
            app/src/main/res/drawable/emerald_badge_background.xml
            app/src/main/res/drawable/emerald_settings_background.xml
            app/src/main/res/values/colors_emerald_ui.xml
            app/src/main/res/values-night/colors_emerald_ui.xml
            EMERALD_PHASE14_PROVENANCE.md
            EMERALD_UI_PHASED_PROVENANCE.md
            EMERALD_PHASE15_PROVENANCE.md
            EMERALD_UI_PHASEE_PROVENANCE.md
            EMERALD_PHASE16_PROVENANCE.md
            EMERALD_UI_PHASEF_PROVENANCE.md
