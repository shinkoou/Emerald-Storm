# Emerald Storm v0.2.41 Phase10 FIX4 Storm4 Explicit Feedback RenderPass State
name: Emerald Storm v0.2.41 FIX4 CAM Phase10 Storm4 Explicit Feedback State + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase10-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.41-FIX4-CAM-Phase10-Storm4-Explicit-Feedback-State-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V241_FIX5_COMMIT: d99d5e7e073c7c6aa61559f703625e6b5e353e3b
  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
  V239_COMMIT: ca15dc208beb65a61a163ecd1e44eb7148992797
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.41 FIX4 CAM Phase10 Storm4 Feedback State
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct pinned v0.2.41 Phase9 FIX5 source exactly
        run: |
          set -euo pipefail
          git show "${V241_FIX5_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v241-fix5.yml
          test -s /tmp/emerald-v241-fix5.yml
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<replay-phase9-fix5>', 'exec'))"

      - name: Apply CAM Phase10 explicit feedback render-pass state correction
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase10-patch>', 'exec'))"

      - name: Verify CAM Phase10 explicit feedback state correction
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase10-verify>', 'exec'))"

      - name: CAM Phase10 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<phase10-audit>', 'exec'))"

      - name: Phase10 prove generated correction before compilation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          echo "[ES-PHASE10] explicit state enum:"
          grep -nA6 -B2 'enum class RenderPassUsage' app/src/main/cpp/skyline/gpu/texture/texture.h | grep -F 'Feedback'
          echo "[ES-PHASE10] overlap classifier:"
          grep -nF 'esFeedbackTextures' app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp | head
          echo "[ES-PHASE10] state diagnostics:"
          grep -nF '[ES-S4-FEEDBACK-STATE]' app/src/main/cpp/skyline/gpu/interconnect/command_executor.cpp
          echo "[ES-PHASE10] feedback dependency lineage:"
          grep -nF 'usage == texture::RenderPassUsage::RenderTarget || usage == texture::RenderPassUsage::Feedback' app/src/main/cpp/skyline/gpu/interconnect/command_nodes.cpp
          echo "[ES-PHASE10] Phase9 Vulkan self-dependency preserved:"
          grep -nF 'VK_DEPENDENCY_FEEDBACK_LOOP_BIT_EXT' app/src/main/cpp/skyline/gpu/interconnect/command_nodes.cpp
          echo "[ES-PHASE10] Phase9 descriptor feedback layout preserved:"
          grep -nF 'ResolveSampledImageLayout(texture)' app/src/main/cpp/skyline/gpu/interconnect/common/pipeline.inc
          echo "[ES-PHASE10] correction proof passed"

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          for phase in 5 6 7 8 9 10; do
            FILE="EMERALD_PHASE${phase}_PROVENANCE.md"
            test -f "$FILE"
            cp "$FILE" "../$FILE"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
            EMERALD_PHASE8_PROVENANCE.md
            EMERALD_PHASE9_PROVENANCE.md
            EMERALD_PHASE10_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
