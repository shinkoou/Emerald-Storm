# Emerald Storm v0.2.43 Phase12 + UI Phase B
name: Emerald Storm v0.2.43 FIX1 CAM Phase12 Storm4 Maxwell Guest Barriers + Shader Forensics + UI Phase B + PT-BR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: emerald-phase12-${{ github.ref }}
  cancel-in-progress: true

env:
  ES_VERSION: v0.2.43-FIX1-CAM-Phase12-Storm4-Maxwell-Guest-Barriers-Shader-Forensics-UI-PhaseB-Full-PTBR
  ES_SOURCE_DIR: EmeraldStorm-v0.1.0
  V242_PHASE11_COMMIT: 3bbd5cab85ef11ee8327fad537e331493da55a55
  V241_PHASE10_COMMIT: bb308016f64b73f05d4d263c32ce5b8ade7878f9
  V241_FIX5_COMMIT: d99d5e7e073c7c6aa61559f703625e6b5e353e3b
  V240_COMMIT: 616df95da30cdabbdaa9ad3c51e424e0572e0445
  V239_COMMIT: ca15dc208beb65a61e44eb7148992797
  V238_COMMIT: c3ff99dcebb7b958ca44a2437491a32b53dafc6c
  V237_COMMIT: dfafe68a823d4fa12a043641a430ba1e44417a42
  V235_COMMIT: af569dd75cc1b9ed0fe679c467a0c702e3b0bf9c

jobs:
  android:
    name: Build Emerald Storm v0.2.43 Phase12 + UI Phase B
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct proven v0.2.42 Phase11 Action102 source exactly
        run: |
          set -euo pipefail
          git show "${V242_PHASE11_COMMIT}:.github/workflows/bootstrap-build.yml" > /tmp/emerald-v242-phase11.yml
          test -s /tmp/emerald-v242-phase11.yml
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<replay-phase11>', 'exec'))"

      - name: Apply CAM Phase12 Maxwell guest barriers shader forensics and Emerald UI Phase B
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<apply-phase12>', 'exec'))"

      - name: Verify CAM Phase12 and Emerald UI Phase B
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<verify-phase12>', 'exec'))"

      - name: CAM Phase12 regression safety audit
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 -c "import base64,zlib;exec(compile(zlib.decompress(base64.b64decode('')), '<audit-phase12>', 'exec'))"

      - name: Phase12 prove generated correction before compilation
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          echo "[ES-PHASE12] version:"
          grep -nE 'versionCode 53|0.2.43-cam-phase12' app/build.gradle
          echo "[ES-PHASE12] Maxwell guest barriers:"
          grep -nF 'Register<0x378, u32> fragmentBarrier;' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.h
          grep -nF '[ES-MAXWELL-FRAGMENT-BARRIER]' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF '[ES-MAXWELL-TILED-BARRIER]' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          grep -nF '[ES-MAXWELL-TEXCACHE-INVALIDATE]' app/src/main/cpp/skyline/soc/gm20b/engines/maxwell_3d.cpp
          echo "[ES-PHASE12] Storm4 shader forensics:"
          grep -nF '[ES-S4-SHADER]' app/src/main/cpp/skyline/gpu/shader_manager.cpp
          grep -nF 'fmt::format("{:016X}", hash)' app/src/main/cpp/skyline/gpu/shader_manager.cpp
          echo "[ES-UI-PHASEB] visual redesign:"
          grep -nF 'PreferenceGroupAdapter' app/src/main/java/org/stratoemu/strato/settings/EmeraldSettingsStyle.kt
          grep -nF 'Emerald Storm UI Phase B app bar' app/src/main/java/org/stratoemu/strato/settings/SettingsActivity.kt
          echo "[ES-PHASE12] generated correction proof passed"

      - name: Build Emerald Storm APK
        working-directory: ${{ env.ES_SOURCE_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleMainlineRelease

      - name: Prepare APK artifact
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mainline/release/app-mainline-release.apk"
          OUT="EmeraldStorm-${ES_VERSION}-Action${GITHUB_RUN_NUMBER}-arm64.apk"
          test -f "$APK"
          cp "$APK" "../$OUT"
          sha256sum "../$OUT" > "../$OUT.sha256"
          for provenance in \
            EMERALD_PHASE5_PROVENANCE.md \
            EMERALD_PHASE6_PROVENANCE.md \
            EMERALD_PHASE7_PROVENANCE.md \
            EMERALD_PHASE8_PROVENANCE.md \
            EMERALD_PHASE9_PROVENANCE.md \
            EMERALD_PHASE10_PROVENANCE.md \
            EMERALD_PHASE11_PROVENANCE.md \
            EMERALD_PHASE12_PROVENANCE.md \
            EMERALD_UI_PHASEA_PROVENANCE.md \
            EMERALD_UI_PHASEB_PROVENANCE.md; do
            test -f "$provenance"
            cp "$provenance" "../$provenance"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64
          path: |
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk
            EmeraldStorm-${{ env.ES_VERSION }}-Action${{ github.run_number }}-arm64.apk.sha256
            EMERALD_PHASE5_PROVENANCE.md
            EMERALD_PHASE6_PROVENANCE.md
            EMERALD_PHASE7_PROVENANCE.md
            EMERALD_PHASE8_PROVENANCE.md
            EMERALD_PHASE9_PROVENANCE.md
            EMERALD_PHASE10_PROVENANCE.md
            EMERALD_PHASE11_PROVENANCE.md
            EMERALD_PHASE12_PROVENANCE.md
            EMERALD_UI_PHASEA_PROVENANCE.md
            EMERALD_UI_PHASEB_PROVENANCE.md
          if-no-files-found: error
          retention-days: 30
