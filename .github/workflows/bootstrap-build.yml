      - name: Apply EmeraldTextureManager Phase0.6 GPU read visibility tracking
        working-directory: ${{ env.ES_SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          header = root / 'app/src/main/cpp/skyline/gpu/texture_manager.h'
          h = header.read_text()

          # COMPILEFIX1: semantic anchors, independent of indentation produced
          # by the previous generated C++ blocks.
          if 'u64 readDependencyTick{};' not in h:
              pattern = re.compile(
                  r'(?m)^(\s*)u64 modificationTick\{\};\n'
                  r'(\s*)u64 cpuWriteCount\{\};'
              )
              def add_read_tick(match):
                  indent = match.group(1)
                  return (
                      f'{indent}u64 modificationTick{{}};\n'
                      f'{indent}u64 readDependencyTick{{}}; //!< Latest GPU-written generation covered by a shader-read dependency\n'
                      f'{match.group(2)}u64 cpuWriteCount{{}};'
                  )
              h, count = pattern.subn(add_read_tick, h, count=1)
              if count != 1:
                  raise SystemExit(f'Phase0.6 Record semantic anchor missing: matches={count}')

          if 'u64 readDependencyEvents{};' not in h:
              pattern = re.compile(
                  r'(?m)^(\s*)u64 sampledEvents\{\};\n'
                  r'(\s*)u64 staleSampledEvents\{\};'
              )
              def add_event_counters(match):
                  return (
                      f'{match.group(1)}u64 sampledEvents{{}};\n'
                      f'{match.group(2)}u64 staleSampledEvents{{}};\n'
                      f'{match.group(2)}u64 readDependencyEvents{{}};\n'
                      f'{match.group(2)}u64 unbarrieredGpuSampleEvents{{}};'
                  )
              h, count = pattern.subn(add_event_counters, h, count=1)
              if count != 1:
                  raise SystemExit(f'Phase0.6 event counter semantic anchor missing: matches={count}')

          if 'ObserveReadDependency(Texture &texture' not in h:
              pattern = re.compile(
                  r'(?m)^(\s*)void ObserveRenderTarget\(Texture &texture, TextureView \*view\);\n'
                  r'(\s*)void ObserveSampled\(Texture &texture, TextureView \*view\);'
              )
              def add_read_method(match):
                  return (
                      f'{match.group(1)}void ObserveRenderTarget(Texture &texture, TextureView *view);\n'
                      f'{match.group(1)}void ObserveReadDependency(Texture &texture, vk::PipelineStageFlagBits dstStage);\n'
                      f'{match.group(2)}void ObserveSampled(Texture &texture, TextureView *view);'
                  )
              h, count = pattern.subn(add_read_method, h, count=1)
              if count != 1:
                  raise SystemExit(f'Phase0.6 method semantic anchor missing: matches={count}')

          header.write_text(h)

