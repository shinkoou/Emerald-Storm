          if 'esTicEqual && !esReplaced && (esSameSequence || !cached.transientNull)' not in textures: raise SystemExit('Phase7 TIC correctness fix missing')
          if 'ResolveSampledFeedback(texture)' in pipeline: raise SystemExit('rejected feedback snapshot routing re-enabled')
